<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title"><title id="title">四种队形 · 规则 [7.2]–[7.5]</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a4825"/></marker></defs><rect width="1000" height="550" fill="#fffdf8"/><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif;fill:#202a35}.base{stroke:#243447;stroke-width:2;fill:#dfebf4}.enemy{stroke:#704336;stroke-width:2;fill:#f6ded2}</style><text x="28" y="38" font-size="25">四种队形 · 规则 [7.2]–[7.5]</text><text x="35" y="85" font-size="19">密集 Closed：底座相接</text><rect x="45" y="105" width="36" height="36" class="base"/><rect x="81" y="105" width="36" height="36" class="base"/><rect x="117" y="105" width="36" height="36" class="base"/><rect x="153" y="105" width="36" height="36" class="base"/><rect x="189" y="105" width="36" height="36" class="base"/><rect x="225" y="105" width="36" height="36" class="base"/><rect x="45" y="141" width="36" height="36" class="base"/><rect x="81" y="141" width="36" height="36" class="base"/><rect x="117" y="141" width="36" height="36" class="base"/><rect x="153" y="141" width="36" height="36" class="base"/><rect x="189" y="141" width="36" height="36" class="base"/><rect x="225" y="141" width="36" height="36" class="base"/><text x="455" y="85" font-size="19">疏开 Open：相邻底座约间隔 ½ 英寸</text><rect x="470" y="105" width="32" height="32" class="base"/><rect x="526" y="105" width="32" height="32" class="base"/><rect x="582" y="105" width="32" height="32" class="base"/><rect x="638" y="105" width="32" height="32" class="base"/><rect x="694" y="105" width="32" height="32" class="base"/><rect x="750" y="105" width="32" height="32" class="base"/><rect x="470" y="161" width="32" height="32" class="base"/><rect x="526" y="161" width="32" height="32" class="base"/><rect x="582" y="161" width="32" height="32" class="base"/><rect x="638" y="161" width="32" height="32" class="base"/><rect x="694" y="161" width="32" height="32" class="base"/><rect x="750" y="161" width="32" height="32" class="base"/><text x="35" y="280" font-size="19">散兵 Skirmish：模型间至少相隔 1 英寸</text><rect x="50" y="320" width="36" height="36" class="base"/><rect x="160" y="360" width="36" height="36" class="base"/><rect x="290" y="315" width="36" height="36" class="base"/><rect x="360" y="400" width="36" height="36" class="base"/><text x="455" y="280" font-size="19">乱群 Mob：不规则排列，底座保持接触</text><rect x="570" y="310" width="36" height="36" class="base"/><rect x="606" y="310" width="36" height="36" class="base"/><rect x="642" y="310" width="36" height="36" class="base"/><rect x="534" y="346" width="36" height="36" class="base"/><rect x="570" y="346" width="36" height="36" class="base"/><rect x="606" y="346" width="36" height="36" class="base"/><rect x="642" y="346" width="36" height="36" class="base"/><rect x="678" y="346" width="36" height="36" class="base"/><rect x="498" y="382" width="36" height="36" class="base"/><rect x="534" y="382" width="36" height="36" class="base"/><rect x="570" y="382" width="36" height="36" class="base"/><rect x="606" y="382" width="36" height="36" class="base"/><rect x="642" y="382" width="36" height="36" class="base"/><rect x="678" y="382" width="36" height="36" class="base"/><rect x="534" y="418" width="36" height="36" class="base"/><rect x="570" y="418" width="36" height="36" class="base"/><rect x="606" y="418" width="36" height="36" class="base"/><rect x="642" y="418" width="36" height="36" class="base"/><text x="35" y="510" font-size="18">蓝色方块代表同一部队的模型底座；此图说明队形，不作为测距模板。</text></svg>