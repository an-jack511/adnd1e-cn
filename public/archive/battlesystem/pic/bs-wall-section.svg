<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title"><title id="title">纸模城墙：形状与封端 · 图 7a–7c</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9a4825"/></marker></defs><rect width="1000" height="400" fill="#fffdf8"/><style>text{font-family:Microsoft YaHei,Noto Sans CJK SC,sans-serif;fill:#202a35}.base{stroke:#243447;stroke-width:2;fill:#dfebf4}.enemy{stroke:#704336;stroke-width:2;fill:#f6ded2}</style><text x="28" y="38" font-size="25">纸模城墙：形状与封端 · 图 7a–7c</text><text x="35" y="90" font-size="22">7a：矩形墙，可翻越</text><path d="M55,165 L195,120 L260,155 L120,200 Z M55,165 L55,260 L120,295 L120,200 M120,295 L260,250 L260,155" fill="#dfebf4" stroke="#243447" stroke-width="3"/><text x="355" y="90" font-size="22">7b：三角墙，不可通行</text><path d="M375,275 L410,170 L475,275 Z M410,170 L555,125 L620,230 L475,275 M375,275 L520,230 L555,125" fill="#dfebf4" stroke="#243447" stroke-width="3"/><text x="700" y="90" font-size="22">7c：留出翼片封端</text><path d="M720,180 L850,135 L915,170 L785,215 Z M720,180 L720,270 L785,305 L785,215 M785,305 L915,260 L915,170" fill="#dfebf4" stroke="#243447" stroke-width="3"/><path d="M720,180 L750,210 L750,265 L720,270 M785,215 L760,235 L760,285 L785,305" fill="#f6ded2" stroke="#9a4825" stroke-width="3" stroke-dasharray="6 4"/><text x="30" y="365" font-size="21">图示为折成后的外形；封端翼片的裁留方式见原组装图与正文。</text></svg>