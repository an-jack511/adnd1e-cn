 x="346" y="374" width="44" height="44" class="base"/><rect x="390" y="374" width="44" height="44" class="base"/></g><path d="M170,330 Q80,170 250,115" fill="none" stroke="#9a4825" stroke-width="5" marker-end="url(#arrow)"/><text x="40" y="100" font-size="19">原图示例：外侧走 5 英寸</text><text x="560" y="200" font-size="22">以一端模型为轴，整队轮转。</text><text x="560" y="245" font-size="22">消耗 = 最外侧模型移动距离。</text><text x="560" y="290" font-size="17">几何位置为规则示意；测距以实际底座为准。</text></svg>