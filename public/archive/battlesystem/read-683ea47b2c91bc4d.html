<figure class="rule-table" id="table-1"><figcaption><a href="#table-1">表 1　A. 力量等级 Power Levels</a><button type="button" data-cite="《AD&amp;D 1e 不全书》v1.0.0 · 大战系统 BATTLESYSTEM Fantasy Combat Supplement (1985) · A. 力量等级 Power Levels · 表 1 A. 力量等级 Power Levels">复制引用</button></figcaption><div class="scroll-table" tabindex="0" aria-label="规则表格"><TABLE class="MsoNormalTable rules-table" style="BORDER-COLLAPSE: collapse; WIDTH: auto" cellSpacing=0 cellPadding=0 border=0 align=center>
<TR><TH style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">等级</TH><TH style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">允许范围</TH></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">基础 Basic</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">只用基础规则；中、高级能力不能发动</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">中级 Intermediate</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">只用基础、中级规则；高级能力不能发动</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">高级／低魔 Low Magic</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">AD&amp;D 法术及效果至多 2 级，禁止 XP 价值至少 1,200 的魔法物品；D&amp;D 允许基础套装全部规则、物品</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">高级／中魔 Medium Magic</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">AD&amp;D 至多 5 级，禁止 XP 价值至少 4,000 的物品；D&amp;D 允许基础、专家套装</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">高级／高魔 High Magic</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">AD&amp;D 全等级法术，每 50,000 点至多一道许愿，禁止神器；D&amp;D 允许基础、专家、伙伴套装</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">高级／无限制 Anything Goes</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">AD&amp;D 许愿与神器不限次数，但仍付点数；D&amp;D 可用全部正式套装、模组规则物品；自创物品须裁判批准</TD></TR>
