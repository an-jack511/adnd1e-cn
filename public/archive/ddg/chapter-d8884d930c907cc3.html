<h1>附录二：神殿布置 · Appendix 2: Temple Trappings</h1>

<P>下表列出本书部分神祇的神殿中可能出现的典型物品。神殿内的信徒与侍从应由地下城主另作编号说明。地下城主应主动从表中选择物品来布置神殿，仅在补充细节或临时应变时使用随机掷骰。某些物品不适合某些宗教，例如守序善良的神殿中不会有用于活体献祭的火坑。</P>
