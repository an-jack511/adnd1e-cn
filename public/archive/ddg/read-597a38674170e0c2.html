<P>守序邪恶弱等神，AC &#8722;1，生命值 230，魔法抗性 75%，可每日召来 2–20 个普通魔鬼。他的灵魂物件寄宿在活人身上；肉身被毁时，寄主会逐渐长成带有杜拉加记忆的新魔鬼。红宝石钉头锤每击造成 35 点伤害，未通过魔法豁免者会变成随机魔鬼。</P><P class="reading-order"><A href="read-fd86edfe05f98950.html">上一节：达哈克 · Dahak</A><BR><A href="read-39b7be7dddc93cd7.html">下一节：吉尔伽美什 · Gilgamesh</A></P>
