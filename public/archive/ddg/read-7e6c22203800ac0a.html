<P>乌鸦是改变形态的诡计者，被认为参与创造和改造世界。它能随意变形为乌鸦、狐狸、松鸦或月鸟，通常只在最后关头化为巨鸦战斗；它也被视为给人类带来食物与火的伟大供给者。想求它帮助，最有效的献礼是食物。</P>
