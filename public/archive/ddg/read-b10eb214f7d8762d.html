<P>郊狼教人艺术、工艺、光与火，却主要是欺凌、贪婪的混乱诡计者。它可以每天变形一次，但只限于动物形态；受困时会以 3–30 点伤害撕咬。它的信徒常祈求盗窃和幻术火焰、光明或黑暗的技巧。</P>
