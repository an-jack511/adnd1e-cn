<h1>空房间 Empty Rooms</h1>
<P>空房间不是无意义的空白，而是让角色获得线索、休息、补给或理解反派计划的地点。字段包括描述、概要、发现、可用物品、隐藏内容、人物、遭遇和离开后的后果。示例是被 Llirryn 遗弃的木屋：主房间有床、桌椅、羊皮纸和可用水泵；调查这些物件可以显示他曾在此停留并留下地图线索。</P>
