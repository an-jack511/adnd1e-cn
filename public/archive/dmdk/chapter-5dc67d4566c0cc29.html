<h1>《水世界的战士》填表结果</h1>
<P>已填表单按以下顺序组成示例：核心反派、冒险大纲、情节与谜案、核心生物、冒险地图、主怪物矩阵、冒险开场、近战、角色扮演、游荡遭遇与随机事件、陷阱与两难、空房间、事件、追逐、两页大结局和财宝。它们不是新的规则章节，而是把 Book I 的设计方法组合成可直接主持的一场冒险。</P>
