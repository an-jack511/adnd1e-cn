<h1>事件 Events</h1>
<P>字段包括：标题、预示、发生条件、事件详情、特殊效果和结果。示例事件是王室暗杀企图：艺术节上，王室卫队在骚乱中抓捕角色；根据角色的行动，国王可能受伤、被救或被暗杀，事件也可能把角色引入追逐。</P>
