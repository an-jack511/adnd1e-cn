<P>红鲱鱼不应只是浪费时间。无效神器可以让角色暴露在真正危险前；错误目标、嫌疑人或证据应揭示是谁故意把调查引向错误方向；错误道路可以由主反派或次要反派故意布置；虚假流言可能错误地说出反派弱点，直到角色已经据此采取行动。</P>
<P>红鲱鱼可以是被偷走但无效的神器、错误的嫌疑人、冒牌预言、假地图或故意误导角色的证据。它不应只是浪费时间；发现错误线索本身也应揭示反派的行为模式。</P>
