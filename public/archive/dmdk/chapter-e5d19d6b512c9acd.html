<h1>追逐 Chases</h1>
<P>字段包括：追逐双方、特殊条件、特殊路线、捷径机会、追逐矩阵、每阶段距离、延误、追上和逃脱结果。示例“追踪 Llirryn”让 Llirryn 队伍领先 100 码；角色一方速度更快获得 +2，但若停下来攻击拖延部下，Llirryn 的检定获得 +4。</P>
