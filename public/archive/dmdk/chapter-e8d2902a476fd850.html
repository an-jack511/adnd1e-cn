<h1>角色扮演 Role-Playing Encounter</h1>
<P>字段包括：警告、标题、概要、人物、对话要点、人物目标、角色可发现的信息、触发条件和可能结果。示例“Lightning”中，角色赶到并警告国王有危险，但国王不相信任何关于个人保护的建议，且阴谋会在公开场合迅速升级。</P>
