<P>目标是让玩家获得轻松娱乐而不是悲剧。非玩家角色，包括反派，应更多表现为滑稽、机智、笨拙或古怪，而非真正可怕；即使可怕反派，也应有某个裂缝，例如可笑习惯、矫饰举止或无意暴露弱点。</P><P class="reading-order"><A href="read-3f147e8cc870ea9c.html">上一节：动作／冒险 Action/Adventure</A><BR><A href="read-df0bcf99b0166434.html">下一节：谜案 Mystery</A></P>
