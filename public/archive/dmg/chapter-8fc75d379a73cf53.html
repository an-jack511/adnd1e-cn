<A NAME="dmg-glossary"></A>
<h1>术语表 · Glossary</h1>
<P>本术语表汇集《地下城主指南》与《高级龙与地下城玩家手册》中的常用规则术语。</P>
<figure class="rule-table" id="read-8fc75d379a73cf53-table-1"><figcaption><a href="#read-8fc75d379a73cf53-table-1">表 1　术语表 · Glossary</a><button type="button" data-cite=《AD&amp;D 1e 不全书》v1.0.0 · 地下城主指南 Dungeon Master&#x27;s Guide · 术语表 · Glossary · 章节起页 228 · 表 1 术语表 · Glossary">复制引用</button></figcaption><div class="scroll-table" tabindex="0" aria-label="规则表格"><TABLE class="MsoNormalTable rules-table" style="BORDER-COLLAPSE: collapse; WIDTH: auto" cellSpacing=0 cellPadding=0 border=0 align=center>
<TR><TH style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">术语</TH><TH style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">释义</TH></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">属性值 Ability Scores</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">角色六项属性的数值评级，范围为 3–18：力量、智力、感知、体质、敏捷与魅力。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">AD&amp;D</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">《高级龙与地下城》（Advanced Dungeons &amp; Dragons）。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">阵营 Alignment</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">对角色行为与伦理倾向的概述，由守序、中立或混乱，与善良、中立或邪恶组合而成。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">护甲等级 Armor Class</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">表示角色受到伤害时的防护程度，综合护甲类型、敏捷加值或减值、魔法防护等因素。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">圣物 Artifact</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">在遥远过去打造、拥有巨大力量的魔法物品。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">星界 Astral</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">与星界位面有关或位于其中；参见《玩家手册》第 120 页。与以太位面不同。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">弩矢 Bolt</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">1. 弩发射的弹矢。2. 用于闩门的横木。3. 闪电。4. 逃跑。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">吐息武器 Breath Weapon</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">某些生物（如龙、奇美拉）拥有的特殊攻击，可产生多种效果。用于豁免检定时，“吐息武器”不包括石化与变形效果，它们各有独立类别。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">战役 Campaign</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">泛指同一地下城主主持的所有冒险，而非某一次冒险；一系列基于既定世界持续进行的游戏。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">比较 Cf.</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">比较、参见。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">魅惑 Charm</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">一种轻微的心灵控制魔法。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">职业 Class</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">冒险者的职业，如战士、牧师、盗贼等。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">铜币 c.p.（亦作 cp）</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">铜币，价值为金币的 1/200。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">伤害 Damage</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">对生物或结构造成的生命值或结构点数损失。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">死亡 Death</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">生物生命值降至 0（或可选规则中的 &#8722;10）时死亡。多数死者可被复活，但尸体遭毁坏等情况会妨碍复活。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">死亡魔法 Death Magic</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">死亡射线、死亡之指等魔法；未通过豁免的目标会死亡。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">神祇 Deities</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">地下城主希望纳入战役的神话或传说中的神性存在。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">类人种 Demi-humans</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">通常指可作为玩家角色的类人且一般不敌视人类的生物，如精灵、矮人、半身人等。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">DM</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">地下城主（Dungeon Master），即 AD&amp;D 的裁判。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">地下城 Dungeon</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">泛指任何城堡、地点或遗迹，只要它可作为地下冒险的场所。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">魔力 Dweomer</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">源自古英语 dweomercraeft，意为魔法之术。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">e.g.</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">例如。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">遭遇 Encounter</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">与怪物、另一支队伍等意外相遇。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">负重 Encumbrance</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">冒险者所携物品（护甲、武器、装备等）的重量与体积。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">银币 e.p.（亦作 ep）</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">琥珀金币，由自然形成的银金合金制成，价值为金币的一半。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">et al.</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">以及其他人／事物。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">以太位面 Ethereal</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">与以太位面有关或位于其中；参见《玩家手册》第 120 页。与星界不同。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">特殊力量 Exceptional Strength</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">超过 18 的力量，通常记作 18／x，其中 x 为 01–00（100）。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">经验 Experience</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">击败怪物、获得财宝、扮演角色等带来的奖励，以经验值（XP）表示。经验越丰富，战斗能力、豁免等越强。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">尺 Feet</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">“尺”或符号 ′（如 30 尺或 30′）通常指角色尺度下的实际英尺距离。另见“寸”及《玩家手册》第 39 页。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">追随者 Followers</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">角色达到特定等级后获得的一群忠诚同伴。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">金币 g.p.（亦作 gp）</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">标准货币单位；10 金币重 1 磅，每枚约重 1.6 常衡盎司。也用作重量／负重单位。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">随从 Henchman</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">等级较低、忠于队伍中某一成员而非整个队伍的非玩家角色。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">受雇者 Hireling</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">受雇陪同队伍冒险或临时承担其他工作的非玩家角色。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">生命骰 Hit Dice</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">用于掷骰决定生物生命值的骰子数。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">生命值 Hit Points</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">生物死亡（或可选规则中的昏迷）前可承受的伤害点数，反映体能、战斗经验、技巧或运气。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">圣水／邪水 Holy/Unholy Water</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">由牧师特别制备的水，可用于攻击不死生物或减缓毒素效果。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">类人生物 Humanoid</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">指类人且通常敌视人类的生物，如兽人、地精、大地精、狗头人等。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">i.e.</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">即、也就是。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">寸 Inches</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">地下城尺度中 1 寸＝10 尺；户外尺度中 1 寸＝10 码（参见《玩家手册》第 39 页）。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">先攻 Initiative</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">决定敌对个人或群体行动顺序的方法；用于确定战斗中的攻击先后，也适用于其他行动。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">隐形 Invisibility</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">一种避开正常视觉观察的方法，但不会使对象无声无味。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">联盟 League</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">游戏中 1 联盟约等于 3 英里。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">等级 Level</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">1. 地下城楼层的深度或难度。2. 法术的难度与力量。3. 角色职业熟练度与经验程度。4. 怪物的强弱尺度。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">兽化人 Lycanthrope</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">传说中能够变形的人兽，如狼人、虎人等。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">魔法 Magic</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">无法用该世界科学解释的事物。任何带有 +1、+2 等加值的武器或物品均视为魔法物品。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">魔法抗性 Magic Resistance</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">怪物使法术完全失效的概率。其基准为 11 级魔法师施法；施法者每低于 11 级，抗力提高 5%；每高于 11 级，抗力降低 5%。例如，95% 魔法抗性意味着 10 级魔法师无法影响该怪物，而 12 级魔法师有 10% 概率成功。即使法术生效，怪物仍可照常进行豁免检定。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">近战 Melee</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">两名以上生物使用手持武器进行的战斗；不同于两名对手之间的决斗，也不同于远距离投射或发射武器的远程战斗。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">梅佐恶魔 Mezzodaemon</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">出现于 AD&amp;D 模组 D3《卓尔地底城堡》的怪物；若无法查到其数据，可忽略。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">世界设定 Milieu</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">独特的游戏背景，其中含有构建世界时的多种变量，即冒险发生的“世界”。</TD></TR>
</TABLE></div></figure>
<figure class="rule-table" id="read-8fc75d379a73cf53-table-2"><figcaption><a href="#read-8fc75d379a73cf53-table-2">表 2　术语表 · Glossary</a><button type="button" data-cite=《AD&amp;D 1e 不全书》v1.0.0 · 地下城主指南 Dungeon Master&#x27;s Guide · 术语表 · Glossary · 章节起页 228 · 表 2 术语表 · Glossary">复制引用</button></figcaption><div class="scroll-table" tabindex="0" aria-label="规则表格"><TABLE class="MsoNormalTable rules-table" style="BORDER-COLLAPSE: collapse; WIDTH: auto" cellSpacing=0 cellPadding=0 border=0 align=center>
<TR><TH style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">术语</TH><TH style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">释义</TH></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">微缩模型 Miniature</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">用作视觉辅助的小型铅制或塑料人偶。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">投射武器 Missile</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">向目标投掷或发射的武器，包括箭、长矛、投石机石块、投石索弹丸，以及掷向目标的其他物品（如油瓶、圣水瓶等）。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">怪物 Monster</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">游戏中指可能构成威胁的生物，包括人类或野兽。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">蒙蒂·豪尔 Monty Haul</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">奖励过量财宝／经验值的战役，或主持这种战役的地下城主。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">MU（亦作 M-U）</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">魔法师（Magic-User）。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">自然 20 Natural 20</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">掷 20 面骰出现“20”。这不同于总结果为 20；后者可能是较低骰值加上属性或魔法加值。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">N.B.</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">请注意。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">NPC（亦作 N-PC）</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">非玩家角色。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">尼卡恶魔 Nycadaemon</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">出现于 AD&amp;D 模组 D3《卓尔地底城堡》的怪物；若无法查到其数据，可忽略。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">队伍 Party</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">一群冒险者。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">PC</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">玩家角色。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">角色 Persona</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">玩家所扮演角色的身份。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">石化 Petrification</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">通过魔法使某物或生物迅速变成石头，例如蛇发怪的凝视。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">灵药 Philter</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">魔法饮剂或药水。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">圣匣 Phylactery</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">用于存放宗教文字的臂缠盒，因此也属于护符或符咒。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">位面 Planes</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">存在的其他领域，其中一些与主要物质位面相连；参见《玩家手册》第 120 页。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">毒素 Poison</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">既指人工制成的有毒物质，也指毒性生物的毒液。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">长柄武器 Pole Arm</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">长度至少 5 尺、带长柄且非长矛或手杖的武器。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">变形 Polymorph</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">通过魔法改变生物的外形。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">白金币 p.p.（亦作 pp）</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">白金货币单位，每枚价值 5 枚金币。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">灵能 Psionics</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">仅非常聪明的生物与部分怪物能够进行的心灵战斗；也包括心灵遥控等特殊心智能力。参见《玩家手册》附录 I。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">Q.E.D.</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">证毕。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">q.v.（亦作 q.q.v.）</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">参见；指另有交叉引用的条目。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">随机生成 Random Generation</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">通常通过掷骰，从多种可能性中随机决定某项内容。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">圣遗物 Relic</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">通常年代久远、拥有强大力量的神圣魔法物品。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">研究 Research</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">除通常含义外，也指魔法师或炼金术士准备新法术、附魔物品等工作。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">复活 Resurrection</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">通过魔法使死去的角色恢复生命。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">轮（亦称近战轮） Round</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">AD&amp;D 的时间单位，等于 1 分钟；每轮由 10 个分段组成，10 轮为一个回合。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">豁免检定 Saving Throw</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">在不利情形下掷骰，判断法术效果、生物是否跌入坑中、是否避开龙息等。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">侦测 Scrying</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">通过神秘手段观察某个人或物品。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">分段 Segment</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">AD&amp;D 中最小的时间单位，每段 6 秒；10 段组成一轮。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">银币 s.p.（亦作 sp）</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">银币单位；20 枚银币等于 1 枚金币。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">结构点数 Structural Points</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">建筑或结构在崩塌前可承受的伤害量。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">突袭 Surprise</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">遭遇双方均需检定是否被突袭，这可能导致失去先攻。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">命中 To Hit</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">20 面骰掷出达到或超过的数值，才能对对手造成伤害。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">陷阱 Trap</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">冒险者可能触发的机械或魔法装置，通常会对一名或多名角色造成伤害，如坑洞、尖刺坑洞、宝箱上的毒针陷阱等。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">财宝 Treasure</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">冒险中可能获得的任何有价值物品的统称。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">诡计 Trick</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">更可能靠机智而非武力解决的装置或机关；不一定会造成身体伤害，例如旋转或下降的房间、会随机行动的雕像、暗中将队伍带到更深楼层的倾斜通道等。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">回合 Turn</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">AD&amp;D 的时间单位，等于 10 分钟；每回合包含 10 轮，每轮又由 10 个分段组成。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">驱散不死生物 Turning Undead</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">牧师运用神圣力量迫退、影响、摧毁或诅咒遭遇到的不死生物的过程。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">不死生物 Undead</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">一类邪恶、无灵魂、既非真正死亡也非真正存活的怪物，包括骷髅、吸血鬼、鬼魂、僵尸、食尸鬼等。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">vis-à-vis</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">面对面；相比之下。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">viz.</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">即；也就是说。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">游荡怪物 Wandering Monster</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">地下城主未预先标注的遭遇的统称；通常指在地下城中定期检查是否出现怪物。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">x.p.</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">经验值。</TD></TR>
</TABLE></div></figure>
