<h1>涂抹油剂 · Applying Oils</h1>
<P>魔法油剂不会被饮用，因此处理方式不同。应将内容物倒在手上与身体上，并适当涂抹。打开容器并倒出内容物仍需正常时间，即 <STRONG>1 个轮段</STRONG>；涂抹油剂还需 <STRONG>2–5 个轮段</STRONG>，与药水发挥效果所需的时间相同。</P>
