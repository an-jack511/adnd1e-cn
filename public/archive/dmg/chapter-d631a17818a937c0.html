<h1>非玩家角色人物设定 · Personae of Non-Player Characters</h1>
<P>充分塑造非玩家角色（NPC）往往十分理想，有时甚至不可或缺。为便于塑造这些人物，下面提供若干参考表。各种事实与特征按一定次序排列，让角色在 DM 的适当引导下自行成形：先确定阵营、外貌和财物，再确定总体倾向。前三项必然会影响第四项，而总体倾向又会显著影响其他特征。</P>
