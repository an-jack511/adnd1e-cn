<P class="breadcrumbs"><A href="index.html">地下城主指南</A> &gt; <A href="read-a248df27d530784a.html">魔法物品的使用 · Use of Magic Items</A></P><H1>涂抹油剂 · Applying Oils</H1>
<P>魔法油剂不会被饮用，因此处理方式不同。应将内容物倒在手上与身体上，并适当涂抹。打开容器并倒出内容物仍需正常时间，即 <STRONG>1 个轮段</STRONG>；涂抹油剂还需 <STRONG>2–5 个轮段</STRONG>，与药水发挥效果所需的时间相同。</P><P class="reading-order"><A href="read-6564db6afa76a598.html">上一节：饮用药水 · Drinking Potions</A><BR><A href="read-63897b16097a7559.html">下一节：药水混合 · Potion Miscibility</A></P>
