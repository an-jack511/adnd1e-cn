<P>水深不到腰部时没有水战惩罚；腰部至胸部时惩罚减半；游泳或水位高过胸部时全部生效。非水生生物攻击 &#8722;4，命中后的伤害再 &#8722;4（最低 1）；水生生物和拥有游泳熟练项的角色不受罚。</P>
