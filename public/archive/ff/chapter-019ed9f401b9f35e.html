<h1>出现频率 · Frequency</h1>
<P>指出在某个地区或区域中、于该生物可能居住的地方遇到它的可能性，也就是该怪物在此类区域中的稀有程度。“极罕见”表示出现机会为 4%；“罕见”为 11%；“不常见”为 20%；“常见”为 65%。这些概率经过必要的小幅近似，反映在怪物等级表中，这些近似完全处于统计变动允许的范围之内。每个类别内部仍有差异，例如，同属“极罕见”的某些生物事实上会比其他同类更罕见。</P>
