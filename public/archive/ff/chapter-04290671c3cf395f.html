<h1>护甲等级 · Armour Class</h1>
<P>描述人类、近人类或人形怪物所穿防护的大致类型，也包括怪物因身体结构和／或魔法性质而固有的防护，以及因速度、反应等因素导致的受击难度。所有这些因素合并为单一护甲等级数值。裁判无需因为高敏捷而调整这一数值；如果在特定情况下需要调整 AC，怪物个体描述中会列出相应改变。</P>
