<h1>魔法抗性 · Magic Resistance</h1>
<P>表示法术施放在该怪物身上或以其为目标时，法术绝对失效的百分比。该数值以 11 级魔法师施法为基础；施法者每低于 11 级一层，数值上调 5%；每高于 11 级一层，数值下调 5%。因此，拥有 95% 魔法抗性的怪物不会受 10 级或更低等级魔法师施放的法术影响，而 12 级魔法师有 10% 的机会影响它。</P>
<P>注意，即使法术“克服了魔法抗性”，怪物仍然可以进行正常豁免。</P>
