<h1>R–S 部条目 · R–S</h1>
<P>寻猎魔；还魂尸；洛斯兽；沙人；稻草人；尖啸小魔；暗影恶魔；尸衣食尸鬼；裹尸幻影；电击怪；骷髅战士；隐伏者；史拉蟾；斯尼亚德；凯厄斯之子；震慑胶怪；苏苏鲁斯；斯涅布力深地侏儒；共生胶怪。</P>
