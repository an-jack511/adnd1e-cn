<h1>每次攻击伤害 · Damage per Attack</h1>
<P>表示某次攻击命中时对受害者造成的伤害点数，以伤害范围表示。如果怪物使用武器攻击，则不会列出伤害，因为伤害会随所用武器类型变化。更详细的攻击方式和每种攻击可能造成的伤害，必须查阅怪物正文。</P>
