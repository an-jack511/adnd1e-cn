<P>火蟾蜍 是一种约 4 英尺高、覆盖紫色疣状突起的大型红色蟾蜍。向它投掷液体或油会使它逃跑，不过在逃跑时，它会在同一个近战轮内把两次火球攻击集中到做出该行为的人身上。</P>
<P>火蟾蜍 可以随意喷吐小型火球，射程 30"，爆炸半径 5 英尺。这是它唯一的攻击方式；火球造成的伤害等于 火蟾蜍 当前剩余的生命值。对这次攻击可以进行正常豁免，成功则伤害减半。</P>
<P>火蟾蜍 很少（20% 的概率）主动攻击，除非受到威胁、骚扰，或是在防御自己的宝藏。</P>
