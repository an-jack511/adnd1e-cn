<h1>巢穴概率 % · in Lair</h1>
<P>表示在该怪物居住并储存宝藏（若有宝藏）的地方遇到它的机会。有些怪物永远不会在巢穴中发现：可能因为巢穴无法进入或无人知晓，也可能因为怪物没有固定巢穴，是真正的游荡怪物。</P>
<P>某些怪物的巢穴位于主物质位面以外；如果遭遇发生在主物质位面，或发生在不是该怪物居住位面的其他位面，显然不可能在它的巢穴中遇到它。然而，某些通常把巢穴设在主物质位面以外的怪物，可能为了追求特定目的或执行特定任务，暂时在那里建立巢穴。</P>
