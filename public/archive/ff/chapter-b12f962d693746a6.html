<P>亵渎尸骸 是一种不死灵体，外形类似披袍骷髅；在牧师／不死生物矩阵上按 尸妖 对待。它抵抗所有影响心灵的法术。它每天能够使用三次自我变形术。</P>
<P>亵渎尸骸 的触碰造成 1–6 点生命值伤害；除非受害者通过对抗毒素的豁免，否则会感染一种急性心血管—肾脏疾病（如《高级龙与地下城地下城主指南》“疾病”一节所述）。</P>
