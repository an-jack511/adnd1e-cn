<P>金币虫是一种甲虫，身体扁平而呈圆形，外壳金色，大小和形状都像一枚金币。它是一种行动非常迟缓的生物，大多数时间都在睡觉，经常选择一堆金币作为床铺。只有非常仔细的检查才能把它与自己躺卧的金币区别开来。因此，尽管它自己没有宝藏，却占据着其他生物的宝藏。</P>
<P>受到惊扰时，它会像大型蜘蛛一样施放带毒的啮咬，使受害者受到 1–4 点生命值伤害；受害者还必须通过对抗毒素的豁免，否则死亡。</P>
