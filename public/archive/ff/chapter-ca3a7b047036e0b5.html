<h1>攻击次数 · Number of Attacks</h1>
<P>表示怪物在一个特定近战轮中可以发动的基本攻击次数，不包括特殊攻击。这个数字可能受到加速、迟缓等法术的改变，但不包括不寻常或特殊的攻击形式。多次攻击通常表示同一近战轮内使用了几种攻击方式；例如，一只用两只爪撕抓并在同一近战轮咬人的怪物，会记为 3 次攻击。</P>
