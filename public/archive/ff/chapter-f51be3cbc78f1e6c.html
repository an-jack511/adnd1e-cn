<P>钩爪恐兽是大型而强壮的双足生物，有秃鹫般的头部和坚硬的板状外骨骼，颜色为斑驳的灰色。它们居住在深地下的走廊和房间中。</P>
<P>虽然视力很差，但听觉极其敏锐；钩爪恐兽被突袭的概率只有 10%。它的双臂末端是锋利的钩状爪，在近战中使用，每只造成 1–8 点生命值伤害。</P>
<P>钩爪恐兽不会说话，但会通过外骨骼发出咔哒声与同类交流——这种声音在地下城走廊中回荡时，会使没有防备的人感到恐惧。</P>
