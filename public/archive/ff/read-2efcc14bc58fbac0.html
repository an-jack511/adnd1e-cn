<P class="breadcrumbs"><A href="index.html">恶魔宝典</A> &gt; <A href="read-b056d88f237a2307.html">D 部怪物 · D</A> &gt; <A href="read-93e20ef1b5fc0fd0.html">东方龙 · Oriental Dragons</A></P><H1>东方龙豁免</H1>
<P>当一条东方龙达到每骰 5 点或更多生命值时，其豁免检定按总生命值除以 4 计算，从而得出一个高于实际生命骰数的生命骰数。这反映了龙的魔法抗性与总体坚韧性。反过来，即使是极幼年的东方龙，也会在决定所需掷骰数时受益于实际生命骰数，尽管它每骰生命值只有 1。这同样反映了龙族的本质，即抗性与坚韧。</P><P class="reading-order"><A href="read-fe659e7410e397db.html">上一节：宝藏</A><BR><A href="read-8bf182111847a373.html">下一节：地龙 · Li Lung</A></P>
