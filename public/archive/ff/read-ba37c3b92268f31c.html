<P>最常见的 海胆。黑海胆 的颜色更接近深灰，而不是黑色。</P>
<P>每个近战轮，黑海胆 可以发射 1 根棘刺，精度相当于一把 +1 轻型弩。命中后对受害者造成 1–6 点生命值伤害。</P>
<P>生物体内的宝石价值 10–100 金币。</P><P class="reading-order"><A href="read-930e279c991f1cf2.html">上一节：海胆 · Urchin</A><BR><A href="read-c23740f8799750fc.html">下一节：绿海胆 · Green Urchin</A></P>
