<P>这种 海胆 呈浅绿色，在水中很难凭肉眼发现（概率为 5%）。</P>
<P>每个近战轮，该生物可以发射 2 根棘刺，精度相当于一把 +2 轻型弩。命中后对受害者造成 2–7 点生命值伤害。</P>
<P>生物体内的宝石价值 40–400 金币。</P><P class="reading-order"><A href="read-ba37c3b92268f31c.html">上一节：黑海胆 · Black Urchin</A><BR><A href="read-375a8b02200fac57.html">下一节：红海胆 · Red Urchin</A></P>
