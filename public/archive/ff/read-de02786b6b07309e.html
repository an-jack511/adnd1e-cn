<P>贝巴朗每个月的大部分时间都处于一种看似休眠的状态，最好在一处隐蔽良好的洞穴中冬眠。虽然它看起来像是昏迷不醒，但实际上贝巴朗正在星界漫游，把时间花在猎杀比自己弱小的生物上……</P>
