<P>洛斯兽 是长着大量黑色长毛的小型牛状生物。它们用两只角攻击（每只造成 1–3 点生命值伤害），并用咬击攻击（造成 1–8 点生命值伤害）。</P>
<P>它们是害羞的生物，厌恶明亮光线；通常会把巢穴建在地下，靠近有大量地衣和苔藓可供食用的湖泊或河流。</P><P class="reading-order"><A href="read-2c8b79bd9fb9c3b9.html">上一节：还魂尸 · Revenant</A><BR><A href="read-5e85c02b90572b93.html">下一节：S 部怪物 · S</A></P>
