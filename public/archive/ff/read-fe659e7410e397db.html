<P class="breadcrumbs"><A href="index.html">恶魔宝典</A> &gt; <A href="read-b056d88f237a2307.html">D 部怪物 · D</A> &gt; <A href="read-93e20ef1b5fc0fd0.html">东方龙 · Oriental Dragons</A></P><H1>宝藏</H1>
<P>极幼年东方龙通常没有宝藏，但有 10% 的概率拥有列表宝藏的四分之一。幼年东方龙有 25% 的概率拥有列表宝藏的四分之一。亚成体有 50% 的概率拥有列表宝藏的一半。青年成体、成体和老年龙拥有正常宝藏。极老龙与古龙分别有 50% 和 75% 的概率拥有列表宝藏的 150% 和 200%。</P><P class="reading-order"><A href="read-b489f29ede384376.html">上一节：遇到多条龙</A><BR><A href="read-2efcc14bc58fbac0.html">下一节：东方龙豁免</A></P>
