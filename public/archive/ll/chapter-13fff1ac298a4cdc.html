<h1>牧师与神祇 · Clerics and Deities</h1>
<P>牧师是神祇在凡间的代理者，必须让日常行动符合守护神的阵营、领域和戒律。法术等级受所侍奉神祇的等级限制：半神通常不能授予六、七环牧师法术，弱等神可授予至五环，强大神才可能完整授予一至七环。牧师的宗教义务包括祭祀、守护神殿、传教、照顾信徒和执行神祇要求的任务。</P>
