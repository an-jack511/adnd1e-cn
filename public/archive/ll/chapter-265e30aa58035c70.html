<h1>义家 · Yoshi-Iye</h1>
<P><STRONG>Yoshi-Iye</STRONG> 是中立善良英雄，AC 2，109 点生命值，13 级巡林客兼 5 级牧师、5 级吟游诗人。他奉战神 Hachiman 为主神，拥有传奇弓术；箭矢能击碎岩石，每次命中都造成高于普通弓箭的伤害。若危急时刻向 Hachiman 祈求援助，战神偶尔会亲自回应。</P>
