<h1>诸神黄昏 的最后战役 · Ragnarok 的最后战役</h1>
<P>当 Fimbulwinter 结束，海水升高、太阳被吞噬，束缚中的怪物将重获自由。Aesir、Vanir、英灵战士与巨人军队在 Vigrid 平原会战；Odin 死于 Fenris Wolf，Thor 在杀死 Jormungandr 后也被毒液杀死，Loki 与 Heimdall 互相杀死。火焰焚毁旧世界，新的世界从海中升起，少数幸存者继承神与人的秩序。</P>
