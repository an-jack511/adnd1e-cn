<P>宁胡尔萨格总显现为深肤女子，完全控制重力与磁力。她可赐特别宠爱的人飞行，也能使憎恨者枯萎。枯萎是特别的九级法术，效果如同枯萎法杖的三次充能，材料成分与 wish 法术相同。</P>
