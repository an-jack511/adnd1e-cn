<h1>附录二：神庙陈设 · Appendix II: Temple Trappings</h1>
<P>下表列出本书某些神祇的神庙中可能出现的典型物品，作为有代表性的样本。神庙中的信徒或侍从应由地下城主另行编定。地下城主应从表中选择物品布置神庙；随机选择只用于补充细节或临时应急。部分物品不适用于某些宗教，例如守序善良神庙不会有焚烧活祭品的火坑。</P>
<P><STRONG>神庙陈设百分骰表</STRONG>（；。00 表示 100。）</P>
