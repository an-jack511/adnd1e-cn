<h1>凡人与不朽 · Mortality and Immortality</h1>
<P>凡人死后灵魂按阵营、信仰与生前行为前往相应位面；复活、复生和灵魂召回受时间、位面距离、尸体状态与施法者等级限制。神祇、恶魔、魔鬼和其他不朽者被逐回本位面后，通常需要一段休眠或重聚力量的时间。凡人若想成为神祇，必须达到远超普通冒险者的等级，长期忠诚于某一信仰，获得追随者，并完成地下城主设定的神圣试炼。</P>
