<h1>凯尔特颈环 与 塔瑟鲁姆 · Celtic Torc 与 Tathlum</h1>
<P><STRONG>Torc of the Gods</STRONG> 是 Goibhnie 制作的稀有金属项圈，镶嵌一枚随机宝石，可让持有者变形或将他人变形成其他形态。<STRONG>Tathlum</STRONG> 是以敌人头颅和死者领土的石灰层制成的一次性武器；在明亮日光下投向死者亲友时，可造成目标原生命值的一定比例伤害。</P>
