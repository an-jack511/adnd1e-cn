<h1>神圣包 · Sacred Bundle</h1>
<P>战士可在部族牧师和被召来的印第安灵体协助下制作神圣包。包内总有 5–10 件物品，由灵体挑选并赋予神圣意义；持有者豁免检定获得 +2，只在掷出 1 时被突袭，护甲等级为 2，并且每次受到伤害时减免 1 点。所有物品集齐后，牧师会要求加入最后一件由他指定、且通常可服务于牧师自身的物品。</P>
