<h1>地下城主主持神祇 · Dungeon Mastering Divine Beings</h1>
<P>神祇不应因玩家一时兴起而不断解决凡人问题。通常只有重大任务、忠诚考验、宗教危机或与神祇长期目标一致的行动，才值得直接回应。善神可能派遣同阵营的代理者，邪神可能利用、威胁或惩罚信徒；神祇之间的冲突应通过凡人、选民和圣物展开，以免战役被神祇直接战斗取代。</P>
