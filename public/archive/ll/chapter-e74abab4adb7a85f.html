<h1>附录四：进一步参考 · Appendix IV: Further Reference</h1>
<P>以下书目是编写本书时所使用的一部分参考资料。它们以及许多其他著作对神祇及其神性有比本书所能容纳的更详细的叙述。希望扩充本书资料的地下城主，宜继续研究。</P>
<P>以下逐项转录的 17 条参考书目。英文书名和出版项保留原页写法，中文书名仅为便于查阅的译名，不表示存在对应中文版本。</P>
