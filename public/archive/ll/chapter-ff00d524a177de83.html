<h1>乌鸦 · Raven</h1>
<P>混乱善良强大神，AC 0，移动 24 英寸，400 点生命值，魔法抗性 75%，位于空气元素位面；12 级牧师／德鲁伊、10 级巡林客、16 级魔法师／幻术师、14 级盗贼。乌鸦是改变世界的变形者与恶作剧者，可变成狐狸、松鸦、巨乌鸦或其他形态；他带来火焰与食物，最容易通过献食请求援助。</P>
