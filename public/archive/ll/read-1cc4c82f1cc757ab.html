<P><STRONG>Yamamoto Date</STRONG> 是守序善良英雄，AC 2，189 点生命值，15 级圣武士。他是皇帝之子，以战士能力、对父皇的忠诚、速度和伪装技巧闻名，拥有相当于 11 级盗贼的易容能力。他的魔法剑同时具备屠龙与锋锐能力，能对任何生物造成致命威胁。</P><P class="reading-order"><A href="read-5da61caea0493f4a.html">上一节：雷神（雷电之神与弓手守护者） · Raiden</A><BR><A href="read-265e30aa58035c70.html">下一节：义家 · Yoshi-Iye</A></P>
