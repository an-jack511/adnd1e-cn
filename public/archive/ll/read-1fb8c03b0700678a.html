<P>南纳辛有人类外形，始终沐浴在蓝色光辉中，对进入十英尺范围的人如同蛊惑权杖（rod of beguiling）。他可随意消除热、冷、电、光、黑暗中的任何一种。他持 +3 漆黑斧头，每击 30 点伤害，并具有锋锐剑（sword of sharpness）的效能。</P><P class="reading-order"><A href="read-55da947514675e7d.html">上一节：基 · Ki</A><BR><A href="read-53712d51bb473a7a.html">下一节：宁胡尔萨格 · Nin-Hursag</A></P>
