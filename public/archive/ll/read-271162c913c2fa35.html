<P>诸神各自拥有云战车，看似放出耀眼光辉的云。神踏上去时成为运输平台，也用以震慑信徒与不信者。移动率 24″，能传送到天空中有云的任何地方；不受任何物质力量影响，永不可毁。神总乘这样的装置向牧师显现，以证明神性。云战车能承载驾驭它的神所希望的任何东西。</P><P class="reading-order"><A href="read-97e03ec5cdac699a.html">上一节：乌图 · Utu</A><BR><A href="read-1d0e2551d451a34a.html">下一节：苏美尔神话完整原页（英文扫描）</A></P>
