<P class="inline-illustration"><IMG alt="熊地精与冒险者交战的原书插图" src="../art/5e2590b048b4e4f26f58199e.jpg"></P>
<P>熊地精通常以松散的小群体生活，常与地精出没在相同地区。与体型较小的同族不同，这些长毛的大型地精无论在明亮日光下还是彻底黑暗中都能行动自如（拥有 <STRONG>60 尺</STRONG>红外视觉），因此既会选择地表栖居，也会居住在地下。</P>
<P>若遇到 <STRONG>12</STRONG> 只或更多熊地精，其中会有一名首领：<STRONG>22–25 点</STRONG>生命值，护甲等级 <STRONG>4</STRONG>，按 <STRONG>4 个生命骰</STRONG>的怪物进行攻击，伤害 <STRONG>+1</STRONG>。若遇到 <STRONG>24</STRONG> 只或更多，还会额外出现一名酋长和一名副酋长。酋长护甲等级 <STRONG>3</STRONG>，有 <STRONG>28–30 点</STRONG>生命值，按 <STRONG>4 个生命骰</STRONG>的怪物进行攻击，伤害 <STRONG>+2</STRONG>；副酋长与首领相同。若在巢穴中遇到熊地精，必定有酋长和副酋长；雌性与幼体的数量各相当于雄性的 <STRONG>50%</STRONG>。除非性命受到威胁，否则雌性和幼体不会战斗；若被迫战斗，雌性按大地精的能力战斗，幼体则按狗头人的能力战斗。</P>
<P>熊地精会携带各种武器，从剑到钉有尖刺的木棒（晨星）都有。他们也常携带长矛，并倾向于将长矛、斧、钉头锤和战锤当作投掷武器使用。熊地精力量很大，能将这些武器投掷至 <STRONG>4 寸</STRONG>远；不足 <STRONG>2 寸</STRONG>的距离视为中程。</P>
<P>熊地精看起来笨拙，步态蹒跚，实际上行动迅速、擅长潜行，因此有 <STRONG>50%</STRONG> 的概率使对手遭遇突袭。除了自己的种族语和阵营语，他们也会说地精语与大地精语。</P>

<section class="chapter-section" id="read-9048a259636e1049">

<h2>外貌 · Description</h2>
<P>熊地精的皮肤呈浅黄色至黄褐色，通常是暗黄；毛发从无光泽的棕褐色到砖红色不等。眼白泛绿，瞳孔为红色。他们身穿的零散护甲，以及披挂的布料、兽皮和毛皮，往往都肮脏破旧、疏于打理。熊地精的寿命约为 <STRONG>75 年</STRONG>。</P>
