<P>巨羊是隐居的草食动物，栖息在丘陵地带，会积极抵御任何威胁。冲锋时，命中伤害额外增加 +4（总计 6–20 点）。它们用两根长而尖锐的角抵头攻击；偶尔能被驯化为坐骑。</P>
<P>若遭遇超过 7 只，超出的个体为幼羊；掷百分骰确定成熟度，将结果除以二再加 50%。</P>
