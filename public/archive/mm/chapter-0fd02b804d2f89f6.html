<P>巨型水獭生活在湖泊与河流中，通常没有攻击性，但受到威胁或被逼入绝境时会猛烈反击。它们喜欢玩耍，滑行和追逐是最爱的消遣；若遭遇时正在玩耍，可能惊吓马匹、掀翻马车、意外撞坏车厢，水上船只也可能因嬉戏而倾覆。若在巢穴发现它们，必定有 5 只（2 只成年、3 只成长到 40%–70% 的幼体），父兽必定攻击威胁幼体的生物。巨型水獭皮毛售价为 1,000–4,000 金币。</P>
