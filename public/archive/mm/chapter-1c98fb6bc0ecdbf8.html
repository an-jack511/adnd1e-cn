<P>黄褐色胶冻是巨型变形虫，缓慢渗过地城，寻找并吞食各种肉类或纤维素，尤其偏好前者。它的无定形身体能流过狭小缝隙，也能轻松沿墙壁或天花板移动；分泌出的液体会溶解血肉，每轮接触造成 3–12 点伤害。闪电箭击中黄褐色胶冻只会将其分裂成一个或多个较小个体，每个小个体造成一半正常伤害；寒冷和火焰攻击照常生效。</P>
