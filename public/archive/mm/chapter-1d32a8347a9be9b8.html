<P>位移兽的群体只由成年个体组成。它们的分子振动使其看起来总在实际位置偏移 <STRONG>3 尺</STRONG>——可能在左、右、前或后。因此，攻击者的攻击骰须减去 2，豁免骰则加上 2。它们憎恨所有生命，尤其憎恨闪现犬。战斗中，位移兽会用两条触须猛击，触须粗糙的角质边缘会造成可怕伤口。</P>
<P><STRONG>外观：</STRONG>这种生物模样依稀像美洲狮，身体呈蓝黑色，触须为纯黑色，触须上的角质边缘呈棕黄色，双眼发出地狱般的绿光。</P>
