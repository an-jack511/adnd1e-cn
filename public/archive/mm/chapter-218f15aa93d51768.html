<P>这些蠕虫状鱼类缓慢地游过珊瑚礁，碾碎并吞食珊瑚。遭遇突袭或受到威胁时，它们往往会以“自卫”为由发动攻击。</P>
<P>压碎鱼背部长有若干根 4 尺长的背刺，分泌毒液；每只个体有 4、6 或 8 根。除非从正前方或腹部攻击，否则攻击者可能被这些背刺挡住，或被刺中；被刺中者必须通过对抗毒素的豁免检定，否则死亡。</P>
