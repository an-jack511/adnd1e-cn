<P>幼虫是死后堕入下层位面的灵魂中最自私邪恶者的形态。它们栖居于哈迪斯的阴暗之地，受夜 hag 控制。恶魔与魔鬼都渴求幼虫，分别用它们制造夸赛魔与小魔鬼。巫妖也会利用幼虫的精华维持不死形态与力量。幼虫十分珍贵，因此夜 hag 会将它们作为筹码交易，以维持自己在各个位面的行动自由。</P>
<P>幼虫看起来像病态的黄色蛆虫，长着扭曲的人脸。</P>
