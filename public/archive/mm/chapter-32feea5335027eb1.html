<P>这种怪异生物出没于荒废之地，外貌丑陋到令大多数生物难以忍受。它的身体像雄鹿，尾巴近似狮子，腿末端是分趾蹄；头部像巨大的獾，但口中没有牙齿，而是长着锋利、参差的骨质脊棱。</P>
<P>勒克洛塔狡猾异常，能够模仿男女的声音，以此诱使猎物进入攻击范围。撤退时，它能用双蹄向后踢；每只命中的蹄子造成 1–6 点伤害。它会说自己的阵营语与通用语。</P>
