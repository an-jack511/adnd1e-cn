<P>猛犸象有多个种类，包括披毛猛犸象与帝王猛犸象，后者体型最大。它们生活在更新世，从亚寒带到亚热带地区皆有分布。这些庞大的草食动物受到威胁时相当好斗。</P>
<P>猛犸象与大象、乳齿象一样有五种攻击方式，但通常对单个对手最多只能同时使用其中两种。</P>
<P>猛犸象的长牙比大象的重 50%，因此价值也相应更高。</P>
