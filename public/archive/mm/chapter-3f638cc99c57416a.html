<P>泰坦兽是更新世温带平原上的巨大无畏食草动物，通常成群活动。若遭遇超过 6 只，其中超过可能数量一半的个体会有 1–4 只幼兽，成长度为 10%–100%。群体受到威胁时，最大的雄兽会冲锋；冲锋命中时伤害骰加倍，造成 4–32 点伤害。泰坦兽会践踏足够低矮的目标，每只脚命中造成 2–12 点伤害。</P>
