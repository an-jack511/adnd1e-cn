<P>骷髅是由强大魔法师或邪恶阵营牧师以魔法唤起的不死生物，只会遵照唤起者的命令行动，命令范围通常不超过十几个词。它们只出现在墓地、地城和类似的荒废之地。骷髅使用某种武器攻击，但无论武器类型如何，命中均造成 1–6 点伤害。</P>
<P>骷髅受到锐器和刃器（如矛、匕首、剑）时只承受一半伤害；钝器（如棍棒、钉头锤、连枷）造成正常伤害，火焰也造成正常伤害。睡眠、魅惑、定身和寒冷法术对骷髅无效；每瓶命中的圣水对骷髅造成 2–8 点伤害。骷髅会战斗至被摧毁。</P>
