<P>大猩猩通常只生活在偏远的热带森林中。它们性情害羞，并不主动攻击；但若受到威胁或被逼入绝境，就会猛烈反击。若双手都击中对手，便会抓住并撕扯目标，额外造成 <STRONG>1–6 点</STRONG>伤害。</P>
