<P>这种怪物透明得几乎无法发现，发现概率仅 5%。它栖息在地城和其他黑暗场所，通常不会立即攻击猎物（立即攻击概率 10%），而是跟随选定的受害者，直到其睡觉时才发动攻击。半流体身体能从鼠洞或门下的大裂缝等狭小开口流过。</P>
<P>滑行追踪者通过接触裸露皮肤攻击，分泌物会使受害者麻痹（除非通过麻痹豁免）。目标被固定后，追踪者会在 6 个战斗轮内吸干其全部血浆。</P>
