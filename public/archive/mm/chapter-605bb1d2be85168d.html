<P>梦魇马又称“恶魔马”或“地狱马”，来自下层位面，主要被强大的恶魔、魔鬼与夜女巫骑乘，偶尔也为幽魂、吸血鬼和巫妖等不死生物充当坐骑。梦魇马用獠牙和燃烧的蹄子攻击，并呼出滚烫烟雾，使对手失明、窒息；除非豁免成功，受影响者命中与伤害骰均承受 <STRONG>&#8722;2</STRONG>。梦魇马能飞行、进入以太状态并遨游星界，憎恨物质生命，即使没有骑手也会凶猛攻击。地狱马身形瘦削如骸骨，头部巨大，双眼发红光，鼻孔喷出橙色火焰，蹄子如余烬，皮毛漆黑，鬃毛和尾巴粗乱。</P>
