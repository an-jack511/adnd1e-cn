<P>飞马生活在偏远地区，通常羞怯而野性难驯。这些有翼的聪慧战马速度极快，因此常被追寻；它们只会效忠善良角色，而且一旦效忠便至死不渝。飞马用两只前蹄和强壮牙齿攻击；雄性可负担中型战马的重量，雌性可负担轻型战马的重量。巢穴中每对飞马有一个巢，每个巢有 20% 的机会出现 1–2 枚蛋（30%）或成长到 20%–50% 的幼兽（70%）；蛋值 3,000 金币，幼兽 5,000 金币。</P>
