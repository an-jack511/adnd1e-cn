<P>乌木巨怪是地下捕食者，铁一般的爪子使它能以每轮 1 寸的速度掘穿实心岩石，穿过松土时速度可达 6 倍。它们捕食幼年紫虫、锹甲怪等怪物，但最喜欢人类。乌木巨怪以爪和强大的颚攻击；任何直视其四只眼睛的有智生物都必须进行魔法豁免，否则混乱 3–12 个战斗轮。乌木巨怪有自己的语言。</P>
<P>乌木巨怪全身黑色，前部渐变为黄灰色，头顶灰色，颚部象牙色。由于颜色很暗，40 尺外很容易被误认为某种人形生物。</P>
