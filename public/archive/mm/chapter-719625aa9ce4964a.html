<P>巨型海马是除最寒冷水域外各处都能发现的海生草食动物。它们天性胆小，会尽量躲避接触，但可以训练为坐骑。战斗时用头部撞击；最常见的个体为 2 骰，30% 为 3 骰，10% 为 4 骰。水精灵和洛卡萨族偶尔会捕捉并训练海马。</P>
