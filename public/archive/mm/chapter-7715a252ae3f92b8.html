<P>黑色布丁怪由成群的单细胞构成，通常只在地下出没，是一种食腐兼捕猎的怪物。它的身体结构使其能够流过狭窄缝隙，例如门下 <STRONG>1 寸</STRONG>宽的空隙；它在墙壁、天花板和地面上都能同样自如地移动。它细小的口器与唾液每个近战轮会对裸露的血肉造成 <STRONG>3–24 点</STRONG>伤害。若它要溶解木材以取得食物，每个近战轮可啃穿约 <STRONG>2 寸</STRONG>厚、面积与自身直径相当的木材。</P>
<P>黑色布丁怪的腐蚀性唾液也能溶解金属：锁子甲需 <STRONG>1 个近战轮</STRONG>，板甲需 <STRONG>2 个近战轮</STRONG>；魔法护甲每有 <STRONG>+1</STRONG> 加值，就额外需要 <STRONG>1 个近战轮</STRONG>。例如，<STRONG>+1</STRONG> 魔法板甲接触黑色布丁怪 <STRONG>3 个近战轮</STRONG>后才会溶解。若它被砍击或击打，就会分裂成两块或更多部分，每一部分都能继续攻击；受到闪电攻击时也会如此。寒冷对它无效，火焰则造成正常伤害，而且它会躲避火焰。黑色布丁怪有时呈灰、棕或白色。</P>
<P>生命值为 <STRONG>10–20</STRONG> 点时，直径约 <STRONG>5 尺</STRONG>；<STRONG>21–40</STRONG> 点时约 <STRONG>6 尺</STRONG>；<STRONG>41–60</STRONG> 点时约 <STRONG>7 尺</STRONG>；<STRONG>61–80</STRONG> 点时约 <STRONG>8 尺</STRONG>。即使是最小个体（或直径仅 <STRONG>1 尺</STRONG>的个体），也能造成完整伤害；较大的布丁怪只是有更多口器，平时并不会全部暴露出来。</P>
