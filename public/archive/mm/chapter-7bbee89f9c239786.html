<P>鸟妖有秃鹫的身体、女人的上半身与头部，是污秽贪婪的食肉生物。栖息在海岸边的鸟妖通常称为塞壬。所有鸟妖都能发出悦耳歌声；听见歌声的生物若未通过对抗魔法的豁免检定，便会不由自主地走向鸟妖。鸟妖触碰生物时也会造成魅惑，目标若豁免失败便会受其控制。鸟妖会攻击、折磨并吞食被魅惑的猎物；不想吃的部分则会用排泄物糟蹋。</P>
<P>鸟妖用秃鹫利爪与某种武器攻击，常用骨棒或从受害农夫处夺来的武器。它们只会说自己的语言。</P>
