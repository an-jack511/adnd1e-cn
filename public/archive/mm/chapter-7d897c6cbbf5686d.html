<P>腐尸蛆偶尔出现在内脏或粪便堆中，极少出现在天花板、墙壁或地板里。这些小生物会凶猛地钻入接触到的任何活体肉中，并以此为食。受害者必须立即对伤口施火（每次造成 1–6 点伤害），或对其施展移除疾病；否则腐尸蛆会钻入心脏，在 1–3 个战斗轮内杀死宿主。</P>
