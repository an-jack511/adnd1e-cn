<P>穿刺怪栖息在洞穴、岩窟等地下区域。石质外壳使它们与洞顶钟乳石无法区分；它们会被声音和热量吸引，当活物经过其下方时便坠落杀死并吞食目标。较大的穿刺怪附近常有较小个体。穿刺怪的体型等于生命骰，1、2、3、4 骰的概率相等；最大的个体约长 6 尺、底部直径 1 尺、重 500 磅。</P>
