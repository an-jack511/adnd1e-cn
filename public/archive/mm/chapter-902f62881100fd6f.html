<P>蝎狮喜欢阴森的巢穴，因此通常栖居于洞穴或地下。它们分布于各种气候地带，比起寒冷更偏好温暖环境。人类是蝎狮最喜欢的猎物，所以它们通常在巢穴之外狩猎时被发现。</P>
<P>蝎狮首先会射出一轮 6 根铁尾刺：射程 18 寸，相当于轻弩射程；每根命中造成 1–6 点伤害。它们最多可射出四轮这样的尾刺。</P>
<P><STRONG>外观。</STRONG> 蝎狮的身体各部分分别呈现其来源动物的颜色：身体如狮子般黄褐，翅膀如蝙蝠般棕黑，头部则像人类的血肉之躯。</P>
