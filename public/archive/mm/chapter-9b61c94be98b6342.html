<P>这些奇特的怪物只见于淡水中。它们在陆上爬行缓慢，但能在短时间内快速游动。与巨型螃蟹相似，巨型螯虾会藏起来，伺机冲出捕捉猎物；掷 <STRONG>1d6</STRONG>，结果为 <STRONG>1–3</STRONG> 时，猎物会遭到突袭。</P>
