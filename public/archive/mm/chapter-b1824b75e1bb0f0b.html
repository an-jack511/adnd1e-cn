<P>麒麟是生活在云间、驾驭风的飞行生物，蹄子很少触地。不会遇到雌性麒麟；麒麟总是独自出现。若受到适当祈请，或对抗邪恶的需要十分迫切，它们有时会帮助人类。它们有时也会穿行于星界与以太位面。</P>
<P>麒麟可用双蹄猛击，并以一支如独角兽之角般、带有魔力的尖角（相当于 +3 武器）刺击。它也能采用其他攻击方式。麒麟可像 18 级施法者一样使用各环法术，每日可施放：一环 9 个、二环 8 个、三环 7 个、四环 6 个、五环 5 个、六环 4 个、七环 3 个、八环 2 个、九环 1 个。它们还掌握 4 项主要灵能学科与 6 项次要灵能学科，所有学科的精通等级均为 9。</P>
<P>麒麟每日各可使用一次以下能力：为 2–24 人创造有营养的食物；为 2–24 人创造可饮用的饮料；创造至多 32 立方尺软质物品或 18 立方尺木制物品（均永久存在）；创造重量不超过 2,000 金币的金属物品（存在时间取决于金属种类：黄金可维持 2–5 日，精金则仅维持 1 小时）；创造包含声音、影像与气味的幻象（无需专注即可持续，直到被魔法解除或有人不相信它为止）；变为气体形态；风行术；召雷术；召唤天气。</P>
<P>麒麟召唤天空或与空气有关的事物时，其力量加倍，包括生命值与造成的伤害。麒麟说自己的语言；凭借特殊的心灵感应交流能力，它们几乎能与任何生物交谈。</P>
<P><STRONG>外观。</STRONG> 麒麟的毛色如晴日朝阳般闪耀金光，鬃毛与尾巴是较深的金色，角与蹄呈金粉色，双眼为紫罗兰色。若麒麟皮毛完整无损，价值 25,000 金币。</P>
