<P>新奥提尤格是奥提尤格的更大、更聪明种类，遵循奥提尤格的一般特征，并且捕猎时更加凶猛；它们进行心灵感应交流的能力也略好。有些个体直径可达 8 尺，高度 3 尺或更高；其皮肤比普通奥提尤格更加坚韧，但外观相似。</P>
