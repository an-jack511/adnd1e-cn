<P>血蚊只在极其黑暗、纠结的森林或地下巢穴出现。它们埋伏温血生物，俯冲而下，用长而尖的口器刺入目标，吸取血液作为食物。</P>
<P>血蚊以 4 骰生物而非 1+1 骰生物的方式进行攻击。口器命中造成 1–3 点伤害；之后每轮持续吸血，直到吸取价值 12 点生命值的血液，每轮吸取 1–4 点。吸满 12 点后，血蚊会鼓胀并飞走消化；只有杀死它才能让其脱离猎物。羽毛呈锈红至红棕色，眼睛和足部黄褐色，口器尖端粉红，根部渐变为灰色。</P>
