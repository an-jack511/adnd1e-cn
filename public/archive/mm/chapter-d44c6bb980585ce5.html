<P>顾名思义，河马生活在热带地区的河流与湖泊中。它们是草食动物，但会凶猛地保卫自己的领地。河马以极强的颚部咬击；公牛每次攻击造成 3–18 点伤害。每群有 1–3 头公牛，每 4 头河马中就有 1 头公牛。</P>
<P>若船只或独木舟驶过潜在水下的河马上方，公牛有 50% 概率从船下浮起并将其掀翻。河马在水下沿河床行走移动。</P>
