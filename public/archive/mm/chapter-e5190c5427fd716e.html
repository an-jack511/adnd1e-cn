<P>巨型羊只出现在丘陵或山地。成年个体无论雌雄均符合上述数据，但雄性（巨型公羊）会冲锋，头撞伤害加倍。它们通常不具攻击性，但若羊群受到威胁会战斗至死。每群有一只公羊、四只母羊，其余为羔羊；数量以百分骰决定，将结果减半后加 50%。</P>
