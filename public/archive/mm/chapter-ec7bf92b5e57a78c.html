<P>舍杜在世间旅行，帮助盟友并促进守序善良的事业。它们能用强壮的前蹄攻击，但更倾向于使用 3 种主要和 5 种次要灵能能力，所有能力均以 9 级掌握度施展。舍杜可以随意变为以太状态，经常穿行于星界与以太位面。它们有自己的语言，也懂得大多数人类语言；由于具备有限的心灵感应，通常直接以心灵接触沟通。</P>
