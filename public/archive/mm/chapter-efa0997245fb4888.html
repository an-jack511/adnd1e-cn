<P>巨型螃蟹栖息于各种水域附近，在陆地和水中都能自如行动，并总是在寻找食物。它们的眼睛长在眼柄上，因此能轻松越过边缘或绕过拐角窥视。它们通常会藏身起来，再猛冲出去抓住猎物；掷 <STRONG>1d6</STRONG>，结果为 <STRONG>1–4</STRONG> 时，猎物会遭到突袭。</P>
