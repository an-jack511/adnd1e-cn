<P>狮鹫会选择悬崖与多岩地带筑巢；条件允许时，也会住在洞穴中。它们是凶猛的食肉动物，最爱捕食马匹。一旦在约 36 寸范围内看见或嗅到马肉，狮鹫便会飞扑猎食。</P>
<P>若在巢穴中遭遇，每两只狮鹫就有 75% 概率另有 1–2 枚蛋或幼鸟。幼鸟不会战斗，但成年狮鹫会战至死亡。尚未成年的雏鸟很受追捧：若能在其成熟前驯服，便可训练成凶猛而忠诚的坐骑。公开市场上雏鸟售价 5,000 金币，蛋售价 2,000 金币。</P>
