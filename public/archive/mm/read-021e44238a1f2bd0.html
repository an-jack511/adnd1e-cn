<P>美洲豹是极其凶猛的丛林掠食者，会攻击任何它们认为构成威胁的生物。若在巢穴中发现它们，有 75% 概率存在 1–3 只幼崽，成长程度为 10%–40%；幼崽无法有效战斗。饥饿时，它们会猎捕体型大得多的猎物，包括蛇与鳄鱼。美洲豹擅长攀爬和游泳，也能跃出 30 尺发动攻击。</P>
<P>近战中，美洲豹会用两只前爪抓住对手（同一近战轮内以两次爪击命中），再用后爪撕抓，每轮额外攻击两次，每次造成 2–5 点伤害。</P><P class="reading-order"><A href="read-e1099902e78abe7a.html">上一节：豺狼人 · Jackalwere</A><BR><A href="read-df8c90ff2bc074e9.html">下一节：K 部怪物 · K</A></P>
