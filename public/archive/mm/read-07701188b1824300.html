<P>山地矮人与前述山丘矮人相似，差别在于身高约 4&#189; 尺以上、生命骰为 1+1，肤色通常较浅且多为棕发。他们较少使用弩（最多 20%），更多使用长矛（30%）。力量 16 的山地矮人最高可达 7 级，力量 17 可达 8 级，力量 18 可达 9 级。山地矮人的寿命至少 400 年。</P><P class="reading-order"><A href="read-7b7f202f3f7e9b5a.html">上一节：矮人 · Dwarf</A><BR><A href="read-e015cd74d5521547.html">下一节：E 部怪物 · E</A></P>
