<P>石巨人大多居于山区，住在洞穴或山洞中。它们喜欢穴熊，巢穴有 75% 概率由 1–4 只穴熊守卫。若巢穴中遇到 4 只以上，编号 5、6 的是巨人女性（生命骰与伤害按山丘巨人计算），编号 7、8 的是幼年巨人（掷百分骰确定体型）。</P>
<P>石巨人有时很爱嬉闹，尤其在夜间。成年石巨人喜欢把石块掷至 1–30 寸远，命中造成 3–30 点伤害；它们有 90% 概率接住同类投来的石块。</P>
<P><STRONG>外观。</STRONG> 石巨人肤色从灰色到灰褐色，头发深灰至蓝灰，眼睛像银或钢铁般泛着金属光泽。它们外形醒目，却能轻易融入岩石环境；身穿岩石色衣物，通常以石制武器为装备。</P><P class="reading-order"><A href="read-519fa1cb7ade9d95.html">上一节：山丘巨人 · Hill Giant</A><BR><A href="read-f0c91c2c6c075e33.html">下一节：风暴巨人 · Storm Giant</A></P>
