<P>蛇颈龙宛如披着龟身的巨蛇（没有龟甲），性情凶猛，往往会攻击任何目标。它的颈部长约为全长的三分之一，既强壮又灵活。在海战中，它可用有力的前鳍攻击，每只前鳍造成 2–12 点伤害。</P><P class="reading-order"><A href="read-7a87007eb8490f10.html">上一节：板龙 · Plateosaurus</A><BR><A href="read-b8228ff73e8cb3cc.html">下一节：无齿翼龙 · Pteranodon</A></P>
