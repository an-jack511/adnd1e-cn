<P>火元素极为可怖，是凶猛的对手；它们触碰任何可燃物都会使其起火。对抗使用火焰的敌人时，每颗伤害骰减 1 点。水会阻挡火元素；它们无法越过不可燃液体。</P>
<P>火元素位面存在许多不同种类的火元素与类似生物。传说统治所有火元素的领主名为“暴君”。</P><P class="reading-order"><A href="read-c41175577cf9cef8.html">上一节：土元素 · Earth Elemental</A><BR><A href="read-f3bfac917948192a.html">下一节：水元素 · Water Elemental</A></P>
