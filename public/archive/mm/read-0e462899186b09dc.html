<P>海狮是栖息在近海水域的可怕食肉动物，成群捕猎，即使在水下也会发出响亮的咆哮。它们有鬃毛的头部护甲等级为 5，厚鳞覆盖的身体其余部分护甲等级为 3。海狮常把猎物拖回巢穴，因此巢穴中有时会留下值钱物品。它们用带爪的前肢和下颚攻击；幼年海狮可以驯服，用于守卫与狩猎。</P><P class="reading-order"><A href="read-719625aa9ce4964a.html">上一节：巨型海马 · Sea Horse, Giant</A><BR><A href="read-216c97f7aab8bf24.html">下一节：影子 · Shadow</A></P>
