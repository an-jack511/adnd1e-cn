<P>巨型蟾蜍遍布大多数地区。较小的近亲以捕食昆虫为人类所益，但大型蟾蜍会吞食任何看似可吃的生物。所有蟾蜍都能跳出自身移动距离；跳跃高度可达水平距离的三分之一，只需一个战斗轮完成，并能在空中或落地时攻击。</P><P class="reading-order"><A href="read-8d74b6c47ca93d71.html">上一节：巨型蟾蜍 · Toad, Giant</A><BR><A href="read-05a502e862865424.html">下一节：冰蟾蜍 · Ice Toad</A></P>
