<P>在恶魔王子之中，耶诺古是最强大、最令人畏惧者之一。通常有 <STRONG>66 只</STRONG>最强壮的豺狼人（每只 <STRONG>14–16 点</STRONG>生命值）侍奉左右；若耶诺古独处，则能在一个回合内召来 <STRONG>6–66 只</STRONG>豺狼人。它也受到食尸鬼之王的敬奉，因此还可以召来 <STRONG>6–16 只</STRONG>食尸鬼。耶诺古通常携带一柄可怖的 <STRONG>7 尺</STRONG>长枷，上有三条精金链，每条链末端各系一枚带刺铁球。每枚铁球分别判定是否命中：第一枚造成 <STRONG>3–18 点</STRONG>伤害；第二枚命中后，目标必须通过对抗魔杖的豁免检定，否则陷入麻痹；第三枚命中后，目标必须通过对抗魔法的豁免检定，否则如同受到法术影响般陷入困惑。</P>
<P>耶诺古会说所有“巨人类”语言以及通用语，也能将言语以心灵感应投射给任意一个生物；但这种交流只能依靠言辞说服，不能直接影响对方。它能够看见以太位面与星界位面。每个近战轮，它可以任选下列力量之一：半径 <STRONG>10 尺</STRONG>的黑暗术；每天三次施展魔法飞弹（每次 <STRONG>6 枚</STRONG>，每枚造成 <STRONG>2–8 点</STRONG>伤害，命中检定 <STRONG>+2</STRONG>）；侦测魔法、阅读魔法或语言、侦测隐形物体、隐形术、飞行术、定身人类、如同 <STRONG>20 级魔法师</STRONG>般施展解除魔法、暗示术、改变自身形态、恐惧术、传送术、念动价值 <STRONG>10,000 金币</STRONG>的重量、石化为泥，或群体魅惑术。它每天还能以 <STRONG>80%</STRONG> 的成功率开启传送门召来 <STRONG>2–5 只</STRONG>I 型恶魔。</P>
<P><STRONG>外观：</STRONG>耶诺古乍看之下形似人类，仔细看则有鬣狗般的头、犬科动物般的胸膛、爪状双手与双脚。它瘦得几乎只剩骨头，身体几乎没有毛发；头顶至背部中段长着一绺肮脏发黄的鬃毛。它的皮肤呈死灰色且光滑，双眼巨大，闪着琥珀色的光。</P><P class="reading-order"><A href="read-8da43911d2f628f4.html">上一节：VI 型恶魔 Type VI Demon（Balor 等）</A><BR><A href="read-6add87423c08c35f.html">下一节：魔鬼 · Devil</A></P>
