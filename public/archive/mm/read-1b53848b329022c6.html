<P>结节龙简直是“行走的无畏战舰”：厚重的甲皮、锐利的侧刺与尖刺尾巴令它几乎刀枪不入。掠食者试图咬它时，若命中，通常会反受 3–12 点伤害。结节龙会甩动带刺的尾巴驱退攻击者；若有人侵入其领地，它有时也会主动攻击。</P><P class="reading-order"><A href="read-df5e6b5140ba167e.html">上一节：沧龙 · Mosasaurus</A><BR><A href="read-bc8fbf4404706ec7.html">下一节：五角龙 · Pentaceratops</A></P>
