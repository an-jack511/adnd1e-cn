<P>巨雀鳝不同于体型较小的亲族，会主动捕猎。它们只栖息在面积大、水深的湖泊与河流中，能够将猎物整只吞下；生命骰掷出 20 即表示吞噬成功。小型巨雀鳝甚至能吞下整只精灵或矮人。</P>
<P>被吞下的生物每个近战轮有 5% 概率死亡。要切开鱼腹逃出，生物必须手持锋利武器，并能造成至少相当于巨雀鳝总生命值 25% 的伤害。刺穿巨雀鳝的攻击有 20% 概率同时击中被吞下的生物；若击中，巨雀鳝与猎物都会受到相应伤害。</P><P class="reading-order"><A href="read-fa610cfde826fff6.html">上一节：G 部怪物 · G</A><BR><A href="read-24041131b5f8ae7e.html">下一节：石像鬼 · Gargoyle</A></P>
