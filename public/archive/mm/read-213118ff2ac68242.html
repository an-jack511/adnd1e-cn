<P>劣魔是居于九层地狱的死者所化成的形体。这些模糊的人形团块会受魔鬼折磨，心智已完全丧失，见到非魔鬼生物便会攻击。它们每个近战轮恢复 <STRONG>1 点</STRONG>生命值，因此通常不会被环境或魔鬼造成的伤害彻底消灭；只有受祝圣之物（如圣水、圣剑等）才能将其永久毁灭。劣魔不受任何睡眠、魅惑等类似效果影响。在地狱中待过一段时间后，有些劣魔会被选中转化为幽魂或怨灵（见相关条目）。</P><P class="reading-order"><A href="read-8d6b13d98e9dde17.html">上一节：冰魔 · Ice Devil</A><BR><A href="read-c4b15feadb613db8.html">下一节：深狱炼魔 · Pit Fiend</A></P>
