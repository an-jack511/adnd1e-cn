<P>乳齿象几乎能在任何气候地带生活，从近极地地区到热带皆可。它们是与大象有远亲关系的巨型草食动物，体形更低矮、身躯也更长；更新世平原上常有乳齿象出没。</P>
<P>乳齿象有五种攻击方式：两根长牙、鼻子与两只前足；但对单个对手一次最多只能使用其中两种。攻击限制及其他数据详见“大象”条目。乳齿象的长牙与大象长牙重量相同，价值也相同。</P><P class="reading-order"><A href="read-218f15aa93d51768.html">上一节：压碎鱼 · Masher</A><BR><A href="read-3c5a75f286185071.html">下一节：美杜莎 · Medusa</A></P>
