<P>石像鬼是具有魔法性质的凶猛掠食者，通常出没于废墟或地下洞穴。它们会攻击 90% 的自己发现的生物，不论对方善恶；最喜欢趁猎物无力反抗时将其折磨致死。石像鬼颇有智慧且邪恶，有时会效忠某个邪恶主人。</P>
<P><STRONG>海石像鬼 Kapoacinth。</STRONG> 这是石像鬼的海生变种，以翅膀游泳；其他特征与普通石像鬼相同。它们生活在较浅海域，以海底洞穴为巢。</P><P class="reading-order"><A href="read-1e5f1ebe4fa1456f.html">上一节：巨雀鳝 · Gar, Giant</A><BR><A href="read-116f05040be40332.html">下一节：气孢 · Gas Spore</A></P>
