<P>巨型蜘蛛会结网，将黏性陷阱横向或纵向布置，捕捉触碰蛛网的生物；有些会潜伏在道路上方，突然落下袭击猎物。蛛网坚韧黏稠，如同蛛网术：力量 18 或更高的生物一轮内可挣脱，力量 17 需 2 轮，依此类推。蛛网极易燃烧。巨型蜘蛛的咬噬带毒，目标未通过毒素豁免即死亡。遇到明显强于自己的敌人时，巨型蜘蛛会逃跑，通常躲到隐蔽地点。</P><P class="reading-order"><A href="read-a6408749141c657e.html">上一节：蜘蛛 · Spider</A><BR><A href="read-37c2af8699a99b4a.html">下一节：巨大蜘蛛 · Huge Spider</A></P>
