<P>巨型蟒蛇通常从上方落下，缠住范围内的猎物并咬噬，随后每轮绞缠造成 2–8 点伤害。若有数名强壮生物（例如 4 名力量 16 以上的人类）抓住蛇的头尾，可在 2–5 个战斗轮内将其解开。进食后，巨型蟒蛇会睡上数日。</P><P class="reading-order"><A href="read-33df386261475082.html">上一节：双头蛇 · Amphisbaena</A><BR><A href="read-6db933f821b5969e.html">下一节：巨型毒蛇 · Poisonous</A></P>
