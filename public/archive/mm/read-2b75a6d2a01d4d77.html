<P>群居动物遍布各种气候：北极有麝牛与驯鹿，赤道附近有长颈鹿与羚羊。最小的只有 1 颗生命骰，最大的有 5 颗。它们以各自的防御方式攻击，例如用角顶撞、用蹄踢或逃跑；伤害取决于防御方式与体型、力量。</P>
<P>群居动物并不主动攻击，遇到威胁时会朝它们认为最危险的一方奔逃。人类或体型相近、甚至更小的类人生物若被卷入兽群行进路线，便会被践踏致死。</P><P class="reading-order"><A href="read-1a738647e1fc8879.html">上一节：地狱犬 · Hell Hound</A><BR><A href="read-540583aaa4732c43.html">下一节：海马兽 · Hippocampus</A></P>
