<P>II 型恶魔形似长着手臂的巨型蟾蜍，前肢的位置长有双腿；普通武器可以伤害它。它能随意施展半径 <STRONG>15 尺</STRONG>的黑暗术，并可任选造成恐惧、如同 <STRONG>8 级魔法师</STRONG>般施展浮空术、侦测隐形、念动价值 <STRONG>3,000 金币</STRONG>的重量，或以 <STRONG>20%</STRONG> 的成功率开启传送门召来另一只 II 型恶魔。它与 I 型恶魔一样贪食；两类恶魔彼此敌视。</P><P class="reading-order"><A href="read-ab189957df726cac.html">上一节：I 型恶魔 · Type I Demon（Vrock）</A><BR><A href="read-db8ab1e1cc9e75bc.html">下一节：III 型恶魔 Type III Demon（Glabrezu）</A></P>
