<P>雌狮身人面像是公狮身人面像的雌性对应，既博学又睿智。她们崇尚中立并珍爱宝石等财富，只有得到报酬才会帮助人类；报酬也可以是谜语、诗歌、散文、知识或公狮身人面像的所在地。若不给报酬，她们会毫不犹豫地吞食冒犯者。</P>
<P>雌狮身人面像每天各能使用一次：侦测魔法、阅读魔法、阅读语言、侦测隐形、定位物品、解除魔法、聆听术、透视术、移除诅咒和传奇传闻；每周各能使用一次符文相关能力。她们会说其雄性同族所知的全部语言。</P><P class="reading-order"><A href="read-4351f893f7866188.html">上一节：公羊狮身人面像 · Criosphinx</A><BR><A href="read-9d4036508785244b.html">下一节：鹰头狮身人面像 · Hieracosphinx</A></P>
