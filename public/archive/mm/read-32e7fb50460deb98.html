<P>狒狒基本上是群居的草食动物。族群由 <STRONG>2–8 只</STRONG>体型较大的雄性带领；它们每次攻击额外造成 <STRONG>1 点</STRONG>伤害。族群中约有一半是不会攻击的幼兽。若有人侵入狒狒的领地，它们会试图驱逐入侵者；但若遇到坚决抵抗，狒狒有 <STRONG>90%</STRONG> 的概率逃跑。</P><P class="reading-order"><A href="read-91889a2071fa6764.html">上一节：B 部怪物 · B</A><BR><A href="read-707e914341a471f5.html">下一节：獾 · Badger</A></P>
