<P>双头蛇两端各有一颗头，两颗头都带毒牙。它会抓住一侧的脖子，像铁环一样滚动前进，能用双头同时攻击；被咬后未通过毒素豁免的受害者立即死亡。寒冷攻击对双头蛇无效。</P><P class="reading-order"><A href="read-7b0b6ee556d6148f.html">上一节：巨蛇 · Snake, Giant</A><BR><A href="read-26389fbd46c79570.html">下一节：巨型蟒蛇 · Constrictor</A></P>
