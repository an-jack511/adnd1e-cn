<P>迪斯帕特统治地狱第二层，其首都为钢铁之城迪斯，整个位面也因此得名。迪斯帕特在城中建有宏伟至极的宫殿；城里满是僵尸、艾尼瑞斯，此外还有少量倒刺魔与马利布兰奇。</P>
<P>每回合或每近战轮（视情况而定），迪斯帕特可任选一项能力施展：烟火术、造焰术、火墙术、光亮术、阅读魔法、阅读语言、侦测隐形、改变自身形态、惑控、誓约术、复原术、完全复生术，或替他人实现一个愿望。他能以 <STRONG>90%</STRONG> 的成功率开启传送门；成功后，有 <STRONG>75%</STRONG> 的概率召来 <STRONG>1–3 只艾尼瑞斯</STRONG>，有 <STRONG>25%</STRONG> 的概率召来 <STRONG>1 只深狱炼魔</STRONG>。每天一次，他可以施展痛苦徽记与神圣或亵渎圣言。他的凝视会令所有未能通过对抗魔法豁免检定的人感到恐惧或寒冷。</P>
<P><STRONG>外观：</STRONG>迪斯帕特邪恶而英俊；只有小角、尾巴与左脚的分趾蹄足以让人认出他并非人类。他持有一根具备支配权杖能力的权杖，以及一根威力加倍的击打法杖，可造成 <STRONG>4–24 点</STRONG>伤害。</P><P class="reading-order"><A href="read-f54c8e17c4fa42ee.html">上一节：骨魔 · Bone Devil</A><BR><A href="read-b54e7dd50c7eaf0a.html">下一节：艾尼瑞斯 · Erinyes</A></P>
