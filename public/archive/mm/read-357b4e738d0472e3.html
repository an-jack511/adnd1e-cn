<P>鹰马只栖息在人类不居住的地方，通常在岩石峭壁等处筑巢。它们是凶猛的战士，会坚决自卫。鹰马是杂食动物，因此不会与飞马一同出现；狮鹫有时会攻击并吞食鹰马。不过鹰马凭借一双强壮前爪与有力鸟喙善于作战，并非容易捕食。</P>
<P>若在巢穴（筑巢地）中遭遇，它们会立即攻击。每两只鹰马有一处巢，每处巢中有 1–2 枚蛋或幼鸟。公开市场上鹰马蛋价值 1,000 金币，幼鸟价值 2,000–3,000 金币。</P><P class="reading-order"><A href="read-540583aaa4732c43.html">上一节：海马兽 · Hippocampus</A><BR><A href="read-d44c6bb980585ce5.html">下一节：河马 · Hippopotamus</A></P>
