<P>大型蜘蛛到处爬行，在墙壁、天花板和地面上进出蛛网，不断寻找受害者。它们有 90% 的概率攻击 3 寸内的任何生物；其毒素通常较弱，因此目标毒素豁免获得 <STRONG>+2</STRONG>。</P><P class="reading-order"><A href="read-37c2af8699a99b4a.html">上一节：巨大蜘蛛 · Huge Spider</A><BR><A href="read-2ba1aad6e2ed46f5.html">下一节：相位蜘蛛 · Phase Spider</A></P>
