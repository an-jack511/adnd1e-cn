<P>典型的巨大蜘蛛不结网，而是像狼蛛一样游猎。它能跳跃 3 寸扑向猎物并施以致命咬噬；其他同类会建造隐蔽藏身处，突然冲出攻击，例如巨型活板门蜘蛛。巨大蜘蛛的毒素豁免检定获得 <STRONG>+1</STRONG>；它们突袭猎物时以 1–5（而非通常的 1）作为突袭点数。</P><P class="reading-order"><A href="read-24245569bdc73fa7.html">上一节：巨型蜘蛛 · Giant Spider</A><BR><A href="read-36b26d266ee2cd7d.html">下一节：大型蜘蛛 · Large Spider</A></P>
