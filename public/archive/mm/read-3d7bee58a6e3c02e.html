<P>公牛是危险的对手，性情暴躁，很容易被激怒。若有人靠近至 <STRONG>8 寸</STRONG>以内，它有 <STRONG>75%</STRONG> 的概率发动攻击。冲锋至少需要助跑 <STRONG>30 尺</STRONG>；撞击造成 <STRONG>3–12 点</STRONG>伤害，随后践踏造成 <STRONG>1–4 点</STRONG>伤害。野牛和原牛等也归入这一类。有牛群时，通常会有几头公牛保护其他成员。</P><P class="reading-order"><A href="read-81c1cbf52d331f0a.html">上一节：外貌 · Description</A><BR><A href="read-576df14282b55cfa.html">下一节：C 部怪物 · C</A></P>
