<P>罗刹最初在印度被发现，是包裹于肉身中的邪灵，如今正在扩散。它们嗜食人肉，且精通幻术，很容易达成目的。罗刹能先使用心灵感应，再制造出符合遭遇者心中“友善形象”的幻象，等待猎物毫无防备时才攻击。</P>
<P>罗刹能施展最高三环的魔法师法术和一环牧师法术，却不受八环以下法术影响。非魔法武器无法伤害它们；低于 <STRONG>+3</STRONG> 的魔法武器只造成一半伤害，但牧师祝福的弩矢命中即能杀死罗刹。若巢穴中遇到一只以上，必定是一名雄性与一名或多名雌性。</P><P class="reading-order"><A href="read-dc3b27eb5bb43625.html">上一节：R 部怪物 · R</A><BR><A href="read-e5190c5427fd716e.html">下一节：巨型公羊 · Ram, Giant</A></P>
