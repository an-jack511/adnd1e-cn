<P>这些长有翅膀与羽毛的蛇形怪物，除了温暖的丛林地带或以太界之外，极少在其他地方出现。它们智慧卓越、能力非凡，故而故乡居民对它们敬畏有加，视其为神祇。库奥托很少干涉人类事务。它们能够改变自身形态，并可像 <STRONG>5 级魔法师</STRONG>和／或 <STRONG>7 级牧师</STRONG>一样施法：<STRONG>45%</STRONG> 使用魔法师法术，<STRONG>35%</STRONG> 使用牧师法术，<STRONG>20%</STRONG> 两类法术都会使用。近战时，它们会以带毒的啮咬（可进行豁免检定）和缠绕攻击；若缠绕命中，受害者每个近战轮及此后每轮都会受到 <STRONG>2–8 点</STRONG>伤害，直至其中一方死亡。</P>
<P>库奥托具有灵能意识，拥有 <STRONG>2 项主要学科</STRONG>与 <STRONG>4 项次要修习</STRONG>，并具备相应的攻击与防御模式。库奥托会说几种人类语言，以及大多数蛇类和鸟类语言。</P><P class="reading-order"><A href="read-5569108e34ec641e.html">上一节：鸡蛇 · Cockatrice</A><BR><A href="read-efa0997245fb4888.html">下一节：巨型螃蟹 · Crab, Giant</A></P>
