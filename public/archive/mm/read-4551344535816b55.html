<P>与较常见的巨人不同，云巨人通常住在山顶或魔法云岛上的粗陋城堡中。在巢穴中遭遇时，有 60% 概率有 1–4 只斑点狮作为宠物或守卫。若在巢穴遇到多只云巨人，第二只为巨人女性的概率为 75%（生命骰与伤害按火巨人计算），其他为幼年巨人（掷百分骰确定成熟度）；若共遇到 6 只，其中一只幼年巨人为成年雄性、一只为成年雌性，另两只为任一性别的亚成年巨人（掷 1–3 为雄性，4–6 为雌性）。</P>
<P>成年云巨人能将石块掷至 1–24 寸远，命中造成 2–24 点伤害；它们有 60% 概率接住同类投来的石块。云巨人嗅觉敏锐，因此只有遭遇骰为 1 时才会被突袭。10% 的云巨人智力极高，这些个体居住在云岛上；它们每天可两次使自己及额外不超过 20,000 金币重量的物体悬浮。邪恶的云巨人巢穴中有 50% 概率关押 1–3 名俘虏作奴隶。</P>
<P><STRONG>外观。</STRONG> 云巨人肤色从淡蓝白到浅蓝不等，头发为银白色或黄铜色，穿戴各类衣物与珠宝，并以巨型棍棒为武器。</P><P class="reading-order"><A href="read-6b8e924076d6b100.html">上一节：巨人 · Giant</A><BR><A href="read-c20f87f2cf858c6b.html">下一节：火巨人 · Fire Giant</A></P>
