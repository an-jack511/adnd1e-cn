<P>闪现犬呈棕黄色，智力与普通人类相当，拥有相当复杂的语言，以吠叫、短促叫声、呜咽和低吼组成。它们会使用一种有限的传送能力“闪现”。战斗时，犬群成员会以随机间隔忽隐忽现；每只闪现的犬有 <STRONG>75%</STRONG> 的概率出现在对手身后。</P>
<P>单只闪现犬掷 <STRONG>12 面骰</STRONG>结果为 <STRONG>7 或更高</STRONG>时即可闪现。再掷一次决定出现的位置：<STRONG>1</STRONG> 为对手正前方；<STRONG>2</STRONG> 为有盾一侧（或左侧）前方；<STRONG>3</STRONG> 为无盾一侧（或右侧）前方；<STRONG>4–12</STRONG> 为对手身后。闪现犬出现时距对手 <STRONG>1–3 尺</STRONG>，可以立即攻击。闪现是与生俱来的本能，它不会出现在已有实体占据的位置。</P>
<P>若犬群遭受严重威胁，或损失达到 <STRONG>25%</STRONG> 及以上，全体便会闪现离去且不再返回。闪现犬与移位兽之间有极深的仇怨；两者相遇必定互相攻击。若在巢穴中遇到闪现犬，有 <STRONG>50%</STRONG> 的概率另有 <STRONG>3–12</STRONG> 只幼犬；幼犬有 <STRONG>1–2 个生命骰</STRONG>，攻击造成 <STRONG>1–2／1–3 点</STRONG>伤害。幼犬可以驯服和训练，市场价值为 <STRONG>1,000–2,000 金币</STRONG>。</P><P class="reading-order"><A href="read-7715a252ae3f92b8.html">上一节：黑色布丁怪 · Black Pudding</A><BR><A href="read-7c608110f4c9e8f4.html">下一节：野猪 · Boar</A></P>
