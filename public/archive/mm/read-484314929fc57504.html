<P>虽然有些鳄鱼体型巨大，但通常只有在咸水水域或史前环境中才会遇到这类巨兽。所有鳄鱼都愚钝而贪食。寒冷天气会使它们行动迟缓（移动力减半）。它们通常潜伏起来，以便突袭猎物；掷 <STRONG>1d6</STRONG>，结果为 <STRONG>1–3</STRONG> 时，猎物会遭到突袭。</P><P class="reading-order"><A href="read-9b61c94be98b6342.html">上一节：巨型螯虾 · Crayfish, Giant</A><BR><A href="read-b056d88f237a2307.html">下一节：D 部怪物 · D</A></P>
