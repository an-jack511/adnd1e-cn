<P>这种危险的群居动物生活在热带和亚热带草原。若有人靠近至 <STRONG>6 寸</STRONG>以内，它们通常会发动攻击，并可能成群冲锋。冲锋至少需要助跑 <STRONG>40 尺</STRONG>；撞击造成 <STRONG>3–18 点</STRONG>伤害，随后践踏造成 <STRONG>1–4 点</STRONG>伤害。有 <STRONG>50%</STRONG> 的概率，遇到的野牛属于温顺种类，受到威胁时会逃跑。</P><P class="reading-order"><A href="read-bbb0b41105974a31.html">上一节：棕精灵 · Brownie</A><BR><A href="read-0a8f0ba9cfb4fbc2.html">下一节：熊地精 · Bugbear</A></P>
