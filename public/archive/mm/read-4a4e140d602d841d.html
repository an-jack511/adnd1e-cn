<P>强盗出没于温带至亚热带的各种地区，通常成群行动，由高等级战士、魔法师和牧师带领。地城中的强盗数量少得多，也常与盗贼合作。除骰子决定的数量外，每遇到 20 名强盗，另有 1 名 3 级战士；每 30 名另有 1 名 4 级战士；每 40 名另有 1 名 5 级战士；每 50 名另有 1 名 6 级战士。</P>
<P>强盗队伍总由一名 8、9 或 10 级战士率领，另有 6 名 2 级卫兵和一名 7 级副手；这些人均不计入骰子决定的强盗人数。强盗少于 100 人时，首领为 8 级；100–150 人时为 9 级；150 人或更多时为 10 级。每 50 名强盗另有 25% 的机会出现一名 7–10 级魔法师（若出现，掷四面骰决定等级）；例如，200 名强盗必定有一名魔法师。每 50 名强盗另有 15% 的机会出现一名 5 或 6 级牧师，并带一名 3 或 4 级助手（只为牧师掷骰决定等级）。</P>
<P>强盗巢穴有 80% 的机会是临时营地，10% 是带秘密入口的洞穴群，另有 10% 是设有 1–4 架轻型投石机防御的普通城堡。巢穴中有 2–20 名重要俘虏及 5–30 名随营人员／奴隶。</P>

<P>地形会影响骑乘强盗的比例：丘陵或山地中，骑马者不超过总数的 10%；开阔地带则有 90% 的强盗骑马。其首领获得灵能的机会照常。</P>
<P><STRONG>劫掠强盗 Brigands。</STRONG>劫掠强盗属于混乱邪恶阵营，其余方面遵循一般强盗的规则。它们有 20% 的机会以洞穴群为巢穴、30% 的机会以城堡为巢穴；只会有 1–10 名重要俘虏，但会有 20–50 名随营人员／奴隶。它们战斗士气高昂，士气反应骰获得 +1。</P>
<P><STRONG>强盗（或劫掠强盗）示例 Example of Bandits (or Brigands)。</STRONG>遭遇 110 名强盗时，其中 33 名骑马、77 名徒步；额外配置 5 名 3 级战士、3 名 4 级战士、2 名 5 级战士、1 名 6 级战士、1 名 9 级首领、1 名 7 级副手及 6 名 2 级卫兵，共计 130 人。另有 50% 的机会出现魔法师，30% 的机会出现两名牧师。</P><P class="reading-order"><A href="read-75b6b633da029bec.html">上一节：人物 · Men</A><BR><A href="read-45c84ca2aa40fef7.html">下一节：狂战士 · Berserker</A></P>
