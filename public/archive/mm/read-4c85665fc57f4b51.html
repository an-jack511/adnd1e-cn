<P>阿斯摩蒂尔斯是地狱大魔王，凭借力量与智谋统治所有公爵。他的体魄胜过任何其他魔鬼，力量堪比风暴巨人；其心计与狡诈也无人能及。他的宫殿坐落于地狱第九层最深裂谷的底部，由深狱炼魔及他所指挥的其他低阶、高阶魔鬼侍奉。每年一次，他可以命令所有魔鬼大公前来朝拜。</P>
<P>阿斯摩蒂尔斯可随意施展以下任一能力，每回合或每近战轮一次（视情况而定）：烟火术、造焰术、火墙术、冰暴术、冰墙术、持续光亮术、阅读语言、阅读魔法、侦测隐形、定位物体、隐形术、解除魔法、定身人类、定身怪物、改变自身形态、惑控、支配术、群体魅惑、誓约术、复原术、完全复生术，或替他人实现一个愿望。每天一次，他还能施展痛苦徽记、疯狂徽记、绝望徽记（目标对抗魔法的豁免检定失败便服从阿斯摩蒂尔斯），以及神圣或亵渎圣言。他随时可以召来 <STRONG>2 只低阶魔鬼</STRONG>或 <STRONG>1 只高阶魔鬼</STRONG>。这位大魔王的凝视可造成恐惧、恐惧与虚弱，或寒冷（令速度减半，且所有骰值承受 <STRONG>&#8722;5</STRONG> 惩罚）；目标可进行对抗魔法的豁免检定。</P>
<P>阿斯摩蒂尔斯持有一根发光的纯红宝石权杖。它具有吸收权杖的能力；以乳白色宝石尖端触及目标，还会造成重伤。奉命后，它能喷出寒霜锥、酸液射流或闪电束，分别如同相应的龙息武器。仅按宝石品质计算，这件权杖便价值 <STRONG>1,000,000 金币</STRONG>。</P>
<P><STRONG>外观：</STRONG>阿斯摩蒂尔斯无疑是所有魔鬼中最英俊的，同时也是力量最强、最具谋略的一个。他所代表的终极邪恶，只有在他愿意显露，或忘乎所以、勃然大怒时，才会从这副美貌中显现出来。</P><P class="reading-order"><A href="read-c16427945bab3587.html">上一节：共通特征 · General Characteristics</A><BR><A href="read-9e7fe868abdf7f42.html">下一节：巴尔泽布 · Baalzebul</A></P>
