<P>剑齿虎是更新世最凶猛、最具攻击性的捕食者，除该时代外很少遇到。它们只在温暖地区活动，其他特征与普通虎相同。六寸长的獠牙能造成可怕伤口，其长度和强大的下颚使其命中检定获得 <STRONG>+2</STRONG>。</P><P class="reading-order"><A href="read-8bb12a3a95a34202.html">上一节：普通虎 · Tiger (Normal)</A><BR><A href="read-63e764333d117cb3.html">下一节：泰坦 · Titan</A></P>
