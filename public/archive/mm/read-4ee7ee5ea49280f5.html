<P>拉弥亚喜欢栖居在沙漠中的废弃城市、隐蔽处等地。它们的上半身、手臂与头部像人类女性，下半身则是兽躯。拉弥亚行动迅捷而强健，通常携带匕首。</P>
<P>拉弥亚每日可各使用一次以下法术：魅惑人类、镜影术、暗示术，以及如同魔杖般使用的幻术。它们通常以这些法术引诱受害者靠近并困住对方，再将其吞食。拉弥亚的触碰会永久吸取受害者 1 点感知；当感知降至 3 以下，受害者便会心甘情愿地服从拉弥亚的一切命令。拉弥亚先吸干猎物的血，再享用其血肉。它们会说自己的阵营语与通用语。</P><P class="reading-order"><A href="read-1545527c691e441f.html">上一节：L 部怪物 · L</A><BR><A href="read-88d909cfc6313527.html">下一节：拉玛苏 · Lammasu</A></P>
