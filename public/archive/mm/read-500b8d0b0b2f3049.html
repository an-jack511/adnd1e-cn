<P>海巫婆居住在温暖海域的茂密浅滩，极少数变种生活在淡水中。它们隐居并憎恨美丽，巢穴通常阴暗丑陋。海巫婆的面容可怕到足以令生物因恐惧而衰弱；除非魔法豁免成功，否则目标力量减半，持续 1–6 个战斗轮。更可怕的是其死亡凝视，射程可达 3 寸；目标若未通过毒素豁免会立即死亡。海巫婆每天只能使用 3 次死亡凝视，受害者随后会被吞食。</P><P class="reading-order"><A href="read-6bd244be47aa99aa.html">上一节：巨型蝎 · Scorpion, Giant</A><BR><A href="read-719625aa9ce4964a.html">下一节：巨型海马 · Sea Horse, Giant</A></P>
