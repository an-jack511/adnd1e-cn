<P class="inline-illustration"><IMG alt=鼠人原书插图的清晰修复版" src="../art/75aa5887f650e3afd8fef799.jpg"></P>
<P>鼠人有时也称鼠民，狡猾邪恶，居住在城市下方的地下隧道群中。它们有三种形态：人类、人高的鼠人，以及巨鼠；通常持剑。鼠人会以人形欺骗人类，把人引到埋伏地点后绑架勒索，或将其吃掉。它们更喜欢以介于人类与普通老鼠之间大小的鼠形活动。鼠人还能召唤并控制巨鼠，每只鼠人可控制 2–12 只。</P><P class="reading-order"><A href="read-9761529d1cdd5518.html">上一节：野猪人 · Wereboar</A><BR><A href="read-2635ddfbd3c72067.html">下一节：虎人 · Weretiger</A></P>
