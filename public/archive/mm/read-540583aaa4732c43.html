<P>海马兽是最珍贵的海中坐骑，强壮、迅捷且聪明。它与普通海马不同：后半身长得像大型鱼类，前肢则以强力鳍肢为足。前半身覆盖细鳞，其他部位为大鳞。海马兽会说自己的语言；经过适当训练后，也能学会另一种语言。人鱼常会驯养海马兽。</P><P class="reading-order"><A href="read-2b75a6d2a01d4d77.html">上一节：群居动物 · Herd Animal</A><BR><A href="read-357b4e738d0472e3.html">下一节：鹰马 · Hippogriff</A></P>
