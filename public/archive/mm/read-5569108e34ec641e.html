<P>鸡蛇栖息于温带至热带地区，地上与地下都能见到。它们用喙只能造成轻微伤害，但触碰会使血肉化为石头（进行对抗石化的豁免检定，否则即被石化）。注意，这种怪物的石化灵气也延伸至星界和以太位面，因此能影响这些位面上的生物（参见<A href="read-0365e29291e7b7ef.html#mm-basilisk">石化蜥蜴 Basilisk</A>）。</P>
<P><STRONG>外观：</STRONG>鸡蛇有一条黄绿色的蛇形尾巴，脚和喙为黄色，翅膀灰色，羽毛金棕色；肉垂、鸡冠、眼睛和舌头都是红色。</P><P class="reading-order"><A href="read-de3d636eeedc91e3.html">上一节：奇美拉 · Chimera</A><BR><A href="read-4414a63bc50e99dc.html">下一节：库奥托 · Couatl</A></P>
