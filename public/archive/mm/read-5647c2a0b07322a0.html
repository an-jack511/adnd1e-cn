<P>IV 型恶魔兼具猿与野猪最恶劣的特征；它们长着一对小翅膀，看起来根本不足以支撑这副沉重、身高约 <STRONG>10 尺</STRONG>的身躯。与低阶恶魔不同，只有魔法武器与魔法投射物能够伤害它们。它们可以随意施展半径 <STRONG>10 尺</STRONG>的黑暗术；每个近战轮还可任选下列能力之一：制造幻象（如同幻象魔杖）、造成恐惧（如同恐惧魔杖）、如同 <STRONG>12 级魔法师</STRONG>般施展浮空术、侦测魔法、阅读语言、解除魔法、改变自身形态、念动价值 <STRONG>5,000 金币</STRONG>的重量、投影幻象，或使用恐惧／纷争徽记；也可开启传送门召来 I–IV 型恶魔（骰子随机决定种类），成功率 <STRONG>60%</STRONG>。</P>
<P>若召唤者知道某只 IV 型恶魔的真名并正确说出，该恶魔有 <STRONG>90%</STRONG> 的概率愿意听取报酬优厚的短期差事。它们也喜食人肉与人血。</P><P class="reading-order"><A href="read-db8ab1e1cc9e75bc.html">上一节：III 型恶魔 Type III Demon（Glabrezu）</A><BR><A href="read-c39ae22c045c0ff5.html">下一节：V 型恶魔 · Type V Demon</A></P>
