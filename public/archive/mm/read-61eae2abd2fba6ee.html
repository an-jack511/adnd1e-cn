<P>倒刺魔栖居于地狱第三、四层，是出色且时刻警觉的守卫，不会遭遇突袭。未经许可闯入的生物会立刻被投进地牢牢房受尽折磨。它们不携带武器：长满角质倒刺的双手与可怕的尾巴已足以伤敌。倒刺魔击中对手时，能令对方恐惧；目标可进行对抗魔杖的豁免检定。每回合或每近战轮（视情况而定），它们可任选一项施展：烟火术、造焰术、定身人类，或以 <STRONG>30%</STRONG> 的成功率召来另一只倒刺魔。</P><P class="reading-order"><A href="read-9e7fe868abdf7f42.html">上一节：巴尔泽布 · Baalzebul</A><BR><A href="read-f54c8e17c4fa42ee.html">下一节：骨魔 · Bone Devil</A></P>
