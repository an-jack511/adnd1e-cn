<P>鹏鸟栖息在岩石丘陵或山地，是外貌诡异的杂食生物，可能与制造枭熊的实验有关。它们用尖锐角攻击，命中骰获得 <STRONG>+2</STRONG>；爪子太弱，不能用于攻击。每只鹏鸟只会攻击一个目标，目标死亡后便用牙齿掏出其心脏；心脏是繁殖所必需的，鹏鸟会立即带走。它们尤其偏爱人类心脏。普通武器无法伤害鹏鸟。鹏鸟在高崖洞穴或山峰筑巢，有时会活捉人类或类似生物，留作食物与繁殖所需。它们说自己的语言。</P><P class="reading-order"><A href="read-6204665d797733fd.html">上一节：飞马 · Pegasus</A><BR><A href="read-8b859c18fee2e8e4.html">下一节：穿刺怪 · Piercer</A></P>
