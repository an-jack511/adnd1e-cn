<P>巨型蝎是凶猛的捕食者，即使在地城等较冷的地方也可能出现。它们通常会攻击接近的生物，用巨钳抓住猎物，再以分节尾巴刺击。尾刺命中造成 1–4 点伤害；若毒素豁免失败，目标立即死亡。巨型蝎可同时与最多 3 名对手战斗。若意外刺中自己，毒液会杀死它。被杀死的生物会被拖回巢穴食用。</P><P class="reading-order"><A href="read-d6a61216b5458d96.html">上一节：萨梯 · Satyr</A><BR><A href="read-500b8d0b0b2f3049.html">下一节：海巫婆 · Sea Hag</A></P>
