<P>这种噩梦般的生物丑恶得难以形容，毫无可取之处。它的身体像一头臃肿巨大的水牛，散发着令人作呕的气味。它的脖子细长，顶着一颗比疣猪还丑陋的大头；四肢粗短，像河马一样。尾巴强壮如蛇，能以惊人的速度抽打敌人。</P>
<P>被尾巴击中的生物有 <STRONG>75%</STRONG> 的基础概率被击晕 <STRONG>1–10 个近战轮</STRONG>。角色每高于 <STRONG>1 级</STRONG>（怪物则每高于 <STRONG>1 个生命骰</STRONG>），此概率便降低 <STRONG>5%</STRONG>。例如，<STRONG>11 级</STRONG>角色被击中时，只有 <STRONG>25%</STRONG> 的概率被击晕。它可能因栖息于恶臭沼泽与瘴气泥潭，才形成这种古怪的遗传特征；也可能是某个疯狂神祇肆意改造生命的结果。无论成因如何，它最可怖的特征都是那双充血的眼睛。</P>
<P>卡托布莱帕斯的凝视等同于死亡射线，射程为 <STRONG>6 寸</STRONG>，甚至能穿透至星界与以太位面。任何与其目光相遇的生物都会立即死亡，无法豁免。若遭遇时完全突袭（掷 <STRONG>6 面骰</STRONG>结果为 <STRONG>2</STRONG>），队伍中就有一人已经与它对视。否则，它虚弱的脖子只有 <STRONG>25%</STRONG> 的概率能抬起头，达到使用凝视的高度。若双方都保持静止，这一概率每个近战轮增加 <STRONG>15%</STRONG>；若它必须追随快速移动，或正缓慢追踪猎物，则每轮只有 <STRONG>10%</STRONG> 的概率能抬起头并锁定目标。</P>
<P>逃跑的受害者即使避开目光，也仍会受到卡托布莱帕斯致命凝视的影响，但此时可以进行豁免检定。</P><P class="reading-order"><A href="read-7a4a3ca9b7c7f548.html">上一节：腐尸爬行者 · Carrion Crawler</A><BR><A href="read-0e940e62e3cddd01.html">下一节：野化牛群 · Cattle, Wild</A></P>
