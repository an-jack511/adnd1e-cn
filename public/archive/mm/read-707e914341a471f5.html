<P>獾善于掘洞，通常独居。它们速度很快，因此护甲等级较高；战斗时十分凶猛，会坚定地守卫自己的领地。若遇到多只，通常是一对配偶及其幼崽。獾皮通常可卖 <STRONG>10–30 金币</STRONG>。</P>
