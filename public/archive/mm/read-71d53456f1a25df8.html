<P>狗头人社会以氏族为基础，部落由战团组成；强大的部落统治弱小部落。它们通常居住在阴暗潮湿之处，例如荒芜的茂密森林或地下环境。狗头人厌恶明亮阳光，在强光下视力很差；夜视极佳，并具有可达 60 尺的红外视觉。在明亮阳光下，它们的战斗能力下降，攻击生命骰减 1。</P>
<P>每遇到 40 只狗头人，就会有一名首领和两名护卫；其能力相当于地精首领与护卫：每只生命值 4、护甲等级 6，伤害 1–6。若在巢穴中遇到 200 只以上狗头人，还会有 5–20 名上述护卫、数量相当于总数 50% 的雌性狗头人、相当于总数 10% 的幼崽，以及 30–300 枚蛋。每个狗头人巢穴中总有一名首领及其贴身护卫。巢穴中还有 65% 概率出现 2–5 头野猪（70%）或 1–4 只巨型鼬鼠（30%），作为守卫。</P>
<P>狗头人部队通常按下表配备武器：</P>

<P>首领与护卫总是装备可获得的最佳武器。所有狗头人盾牌均由木头或柳条制成。</P>
<P>狗头人憎恨大多数其他生物，喜欢杀戮与折磨；它们尤其憎恨棕仙、皮克精、精灵与侏儒，会不断与侏儒交战并一见面就发动攻击。除守序邪恶语与狗头人语外，它们通常（75%）还会说地精语与兽人语。</P>
<P><STRONG>外观。</STRONG> 狗头人的皮肤从深锈褐色到锈黑色不等，没有毛发；眼睛泛红，小角则从棕褐色到白色。它们偏爱红色或橙色服饰，寿命最长可达 135 年。</P><P class="reading-order"><A href="read-b1824b75e1bb0f0b.html">上一节：麒麟 · Ki-rin</A><BR><A href="read-1545527c691e441f.html">下一节：L 部怪物 · L</A></P>
