<P>巨型狗鱼生活在深而大的湖泊中，是凶猛的捕食者，饥饿时会攻击附近任何生物。它们视力良好、移动迅速，三分之二的时间能突袭猎物；尼克希常会驯养巨型狗鱼。</P><P class="reading-order"><A href="read-8b859c18fee2e8e4.html">上一节：穿刺怪 · Piercer</A><BR><A href="read-6e4f984ce4de0599.html">下一节：皮克精 · Pixie</A></P>
