<P>巨型海龟基本不具攻击性，但受到骚扰或威胁时会凶猛反击。若它从小船下方浮出，可能掀翻船只：长舟 90% 概率，普通长船 10% 概率。头和鳍护甲等级为 5，但可以缩回，使这些部位的护甲等级提高至 3。</P><P class="reading-order"><A href="read-6c0fda8230ed2c43.html">上一节：巨龟 · Turtle</A><BR><A href="read-693e3c39fadf4ef3.html">下一节：巨型鳄龟 · Snapping Turtle, Giant</A></P>
