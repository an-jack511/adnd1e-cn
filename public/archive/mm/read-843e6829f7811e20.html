<P>豹生活在热带林地与丛林中，通常埋伏后跃向猎物，遭遇突袭骰为 1–3。它们可以向上跃 20 尺，或向前跃至少 25 尺。若在同一近战轮内两只前爪都命中，豹便可用后爪追加两次攻击，每次造成 1–4 点伤害。</P>
<P>若在巢穴中发现豹，有 25% 概率还会有 1–3 只幼崽；幼崽无法有效攻击。</P><P class="reading-order"><A href="read-f9f390cabc0bd4dc.html">上一节：巨型水蛭 · Leech, Giant</A><BR><A href="read-f907a5bca626f1ea.html">下一节：小妖精 · Leprechaun</A></P>
