<P>霸王龙无疑是所有肉食恐龙中最可怕、最凶残的一种。尽管身躯庞大，它仍行动迅捷。它的头近 6 尺长，牙齿长 3–6 寸。霸王龙生活在平原，凶猛到会攻击小型三角龙，一口吞下其头部；几小时后，猎物的角便会刺穿其胃部，令它死亡。霸王龙会追捕并吞吃几乎任何东西；掷出 18 或更高时，它能将人类大小的生物整个吞下。</P><P class="reading-order"><A href="read-88b8393fc686c6f5.html">上一节：三角龙 · Triceratops</A><BR><A href="read-1d32a8347a9be9b8.html">下一节：位移兽 · Displacer Beast</A></P>
