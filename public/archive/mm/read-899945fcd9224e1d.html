<P class="breadcrumbs"><A href="index.html">怪物图鉴</A> &gt; <A href="read-b056d88f237a2307.html">D 部怪物 · D</A> &gt; <A href="read-73509e714422f62b.html">龙 · Dragon</A></P><H1>睡眠中的龙</H1>
<P>睡眠中的龙只会出现在巢穴中。若龙在 30–120 尺内（距离取决于墙壁、门等阻隔及声音大小），听到交谈、喊叫、破门等响动，就会醒来；遭到攻击也会醒来。此外，掷六面骰出现 6 时，龙也会醒来。攻击睡眠中的龙时，攻击者获得 +3 命中加值；龙醒来后，该加值立即失效。</P><P class="reading-order"><A href="read-6fe9f108a988a90e.html">上一节：感官与恐惧灵气</A><BR><A href="read-12714e35b0c7bd1a.html">下一节：攻击龙</A></P>
