<P>地狱寒冷的第八层主要由冰魔盘踞。它们无愧于大魔鬼之名，喜欢用利爪、颚爪与尾巴攻击并折磨受害者。少数冰魔（<STRONG>25%</STRONG>）携带巨矛，造成 <STRONG>2–12 点</STRONG>伤害；被击中的生物会因寒冷而麻痹，移动速度减半 <STRONG>50%</STRONG>，除非通过对抗麻痹的豁免检定。与其他大魔鬼一样，冰魔都有自己的名字。</P>
<P>每回合或每近战轮（视情况而定），冰魔可任选一项能力施展：飞行术、冰墙术、侦测魔法、侦测隐形、改变自身形态，或开启传送门召来 <STRONG>2 只骨魔</STRONG>（概率 <STRONG>70%</STRONG>）或 <STRONG>另一只冰魔</STRONG>（概率 <STRONG>30%</STRONG>）；开启成功率为 <STRONG>60%</STRONG>。每天一次，它可以施展冰风暴。</P>
<P>冰魔具有 <STRONG>60 尺</STRONG>超视术，每个近战轮恢复 <STRONG>1 点</STRONG>生命值；其擒抱力量值为 <STRONG>18/76</STRONG>。它周围 <STRONG>10 尺</STRONG>范围会散发恐惧气息，目标可进行对抗魔杖豁免检定。</P><P class="reading-order"><A href="read-c0fd2861e667bbc9.html">上一节：角魔 · Horned Devil</A><BR><A href="read-213118ff2ac68242.html">下一节：劣魔 · Lemure</A></P>
