<P>每只 VI 型恶魔都有自己的名字；其中已知的共有六只，巴洛尔是体型最大的一只。这类恶魔偏爱大型 <STRONG>+1 长剑</STRONG>与多尾鞭。鞭子能够把对手拖进恶魔周身燃起的火焰。每个近战轮，VI 型恶魔都有 <STRONG>2/3</STRONG> 的概率焚身并挥鞭；最大的两只在受害者被拖入火焰时造成 <STRONG>4–24 点</STRONG>伤害，中等体型者造成 <STRONG>3–18 点</STRONG>，最小者造成 <STRONG>2–12 点</STRONG>。</P>
<P>它们可以随意施展半径 <STRONG>10 尺</STRONG>的黑暗术，并可任意频率任选下列能力之一：造成恐惧、侦测魔法、阅读魔法或语言、侦测隐形物体、烟火术、解除魔法、暗示术、念动价值 <STRONG>6,000 金币</STRONG>的重量，或使用恐惧、纷争、睡眠、震慑中的一种徽记；也可开启传送门召来 III 型恶魔（成功率 <STRONG>80%</STRONG>）或 IV 型恶魔（成功率 <STRONG>20%</STRONG>）。每次只能使用一种能力。</P>
<P>若角色以正确的召唤仪式、献祭与承诺相邀，VI 型恶魔可能愿意暂时合作；但会伺机夺取或篡夺指挥权。混乱邪恶的怪物大多会被这种恶魔强大的邪恶魅力吸引；在同类中，VI 型恶魔的邪恶组织性更强，因此不受恶魔领主与恶魔王子欢迎。</P><P class="reading-order"><A href="read-c39ae22c045c0ff5.html">上一节：V 型恶魔 · Type V Demon</A><BR><A href="read-161bbdbecb0840b5.html">下一节：耶诺古 · Yeenoghu</A></P>
