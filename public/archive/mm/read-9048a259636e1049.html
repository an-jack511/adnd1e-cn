<P class="breadcrumbs"><A href="index.html">怪物图鉴</A> &gt; <A href="read-91889a2071fa6764.html">B 部怪物 · B</A> &gt; <A href="read-0a8f0ba9cfb4fbc2.html">熊地精 · Bugbear</A></P><H1>外貌 · Description</H1>
<P>熊地精的皮肤呈浅黄色至黄褐色，通常是暗黄；毛发从无光泽的棕褐色到砖红色不等。眼白泛绿，瞳孔为红色。他们身穿的零散护甲，以及披挂的布料、兽皮和毛皮，往往都肮脏破旧、疏于打理。熊地精的寿命约为 <STRONG>75 年</STRONG>。</P><P class="reading-order"><A href="read-0a8f0ba9cfb4fbc2.html">上一节：熊地精 · Bugbear</A><BR><A href="read-e32ed0159ab2493d.html">下一节：布雷特 · Bulette</A></P>
