<P>恐狼只是典型的更新世巨型狼，其他特征与普通狼相同。邪恶的座狼（worg）拥有自己的语言，常与哥布林合作以获得猎物或享受杀戮；它们与小马一样大，可以骑乘，其他特征同恐狼。</P><P class="reading-order"><A href="read-d0c7358f0b097c7e.html">上一节：普通狼 · Wolf (Normal)</A><BR><A href="read-55519397a5e37fa9.html">下一节：冬狼 · Winter Wolf</A></P>
