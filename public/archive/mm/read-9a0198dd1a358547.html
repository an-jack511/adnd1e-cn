<P>鬣狗是生活在温暖平原上的群居动物，兼为猎手与食腐动物，颚部强健，饥饿时会变得凶猛。</P>
<P>斑鬣狗是体型巨大的史前鬣狗。</P><P class="reading-order"><A href="read-ad852c86bf11265d.html">上一节：九头蛇 · Hydra</A><BR><A href="read-c671801d2c616cf7.html">下一节：I 部怪物 · I</A></P>
