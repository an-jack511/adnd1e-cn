<P>鹰头狮身人面像邪恶而贪婪，出没于丘陵，偏好捕食温血生物，人类尤其是它们喜爱的猎物。它们每轮用前爪和喙攻击，并像其他同族一样高度重视财宝；有时也会被某些邪恶而强大的生物驯服为坐骑。</P><P class="reading-order"><A href="read-31c4daed5bc6028c.html">上一节：雌狮身人面像 · Gynosphinx</A><BR><A href="read-a6408749141c657e.html">下一节：蜘蛛 · Spider</A></P>
