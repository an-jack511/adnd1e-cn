<P>巴尔泽布统治地狱第六、七层——马尔博吉与马拉多米尼，尊号“苍蝇之主”（也有人戏称“谎言之主”）。他是仅次于阿斯摩蒂尔斯的强大魔鬼大公。马尔博吉是布满恶臭蒸气、烟雾、火坑与巨大洞窟的黑石位面；马拉多米尼则与之相似，但有护城河环绕的马利布兰奇城堡，以及巴尔泽布的巨型要塞。</P>
<P>在每回合或每近战轮（视情况而定）中，巴尔泽布可任选一项能力施展：烟火术、造焰术、火墙术、持续光亮术、阅读语言、阅读魔法、侦测隐形、定位物体、隐形术、解除魔法、改变自身形态、惑控、支配术（如同支配权杖）、定身人类、魅惑怪物、誓约术、复原术、完全复生术，或替他人实现一个愿望。每天一次，他可以施展痛苦徽记、疯狂徽记及神圣或亵渎圣言。他随时可以召来 <STRONG>1–4 只角魔</STRONG>。凡被他直接凝视者，都会感到恐惧与虚弱；若对抗魔法的豁免检定失败，便会浑身颤抖、瘫倒在地，直到凝视移开后的 <STRONG>1–4 个近战轮</STRONG>。</P><P class="reading-order"><A href="read-4c85665fc57f4b51.html">上一节：阿斯摩蒂尔斯 · Asmodeus</A><BR><A href="read-61eae2abd2fba6ee.html">下一节：倒刺魔 · Barbed Devil</A></P>
