<P>魅魔是独居的雌性恶魔，天生就有一副高挑美丽的人类女性外貌，背生蝠翼。普通武器无法伤害她。她能施展半径 <STRONG>5 尺</STRONG>的黑暗术；亲吻受害者会吸取其 <STRONG>1 个能级</STRONG>。她每轮可以任选下列能力之一：如同油化术般变为灵体、魅惑人类、心灵感应、灵听术、暗示术，或变形成身高体重与自己大致相当的人形生物。她开启传送门的成功率为 <STRONG>40%</STRONG>：召来 IV 型恶魔的概率为 <STRONG>70%</STRONG>，VI 型恶魔为 <STRONG>25%</STRONG>，恶魔领主或恶魔王子为 <STRONG>5%</STRONG>。魅魔凭借狡诈与威胁统治较弱小的恶魔。</P><P class="reading-order"><A href="read-7556592f1eb0ee4b.html">上一节：奥库斯 · Orcus</A><BR><A href="read-ab189957df726cac.html">下一节：I 型恶魔 · Type I Demon（Vrock）</A></P>
