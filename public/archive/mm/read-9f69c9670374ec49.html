<P>格殷永又被称为“狂野巨兽”，是地狱第五层的巨型统治者，力量足以匹敌风暴巨人。它喜欢抓住对手，以利爪撕扯，同时用剧毒尾巴刺击；目标对抗毒素的豁免检定承受 <STRONG>&#8722;4</STRONG> 罚值。它居住在位面中央的一座巨大城堡中，很少外出。</P>
<P>每回合或每近战轮（视情况而定），格殷永可任选一项能力施展：冰风暴、冰墙术、光亮术、阅读语言、阅读魔法、侦测隐形、定位物体、解除魔法、隐形术、改变自身形态、惑控、誓约术、完全复生术，或替他人实现一个愿望。每天一次，它可施展痛苦徽记与亵渎圣言；还可开启传送门，召来 <STRONG>1–2 只骨魔</STRONG>（概率 <STRONG>60%</STRONG>）或 <STRONG>1 只冰魔</STRONG>（概率 <STRONG>40%</STRONG>），开启成功率为 <STRONG>95%</STRONG>。它的怒视会令目标恐惧（可对抗魔法豁免）。</P>
<P>格殷永持有一只巨大的公牛号角，吹响时可召来 <STRONG>5–20 只牛头人</STRONG>；这些怪物会战斗至死，每周只能吹响一次。</P><P class="reading-order"><A href="read-b54e7dd50c7eaf0a.html">上一节：艾尼瑞斯 · Erinyes</A><BR><A href="read-c0fd2861e667bbc9.html">下一节：角魔 · Horned Devil</A></P>
