<P>I 型恶魔是恶魔中最弱的一类，外形似人形兀鹫；普通武器与普通投射物都能伤害它。它能随意施展半径 <STRONG>5 尺</STRONG>的黑暗术，并可任选侦测隐形物体、念动价值 <STRONG>2,000 金币</STRONG>的重量，或尝试开启传送门召来另一只 I 型恶魔（成功率 <STRONG>10%</STRONG>）。它喜食人肉，也贪恋贵金属与宝石；虽然愚钝，却不会接受贿赂。</P><P class="reading-order"><A href="read-9f560aa9d94598c4.html">上一节：魅魔 · Succubus</A><BR><A href="read-2ecd1e132c844112.html">下一节：II 型恶魔 Type II Demon（Hezrou）</A></P>
