<P>可用魔法典籍创造肉魔像，也可由高阶魔法师施展“祈愿术”“任意变形术”“强迫术”“防护普通投射物”与“强力术”创造；施法者至少须为 14 级。材料费为每点生命值 1,000 金币，制造需 1 个月。</P>
<P>创造者可以控制肉魔像并命令它执行简单任务（如前进、停止、杀死），也能令其暂停活动，直到某个事件发生（例如有人进入房间）。但肉魔像每参与一个近战轮，便有 1% 的累积概率陷入狂暴，随机攻击视线内的一切目标；其主人每个近战轮有 10% 概率重新夺回控制权。</P>
<P>肉魔像力大无穷，能砸穿普通木门与木结构。例如，砸穿带铁箍与铁铰链的橡木门需要 5–8 个近战轮。它每 3 个近战轮可对木结构造成 1 点结构伤害。</P>
<P>普通武器无法伤害肉魔像，魔法武器则正常生效。多数法术无效，但火焰或寒冷法术（如“火墙术”“火球术”“冰风暴”）会令其速度减半，持续 2–12 个近战轮。电击攻击会按原本应造成的伤害骰数恢复肉魔像的生命值；例如，六骰闪电箭会为它恢复 6 点生命值。</P><P class="reading-order"><A href="read-3de39a3ae1a19602.html">上一节：黏土魔像 · Clay Golem</A><BR><A href="read-6d038411f4440e19.html">下一节：铁魔像 · Iron Golem</A></P>
