<P>艾尼瑞斯居于地狱第二层，是魔鬼中最常被派往物质位面收集灵魂的一类。她们通常呈女性形貌，但也能化作男性。她们会用一把带有腐蚀性毒液的魔法匕首作战；伤口剧痛，未通过对抗毒素豁免检定的目标会昏厥 <STRONG>1–6 个近战轮</STRONG>。她们还携带一条纠缠套索。艾尼瑞斯可被普通武器命中。</P>
<P>每回合或每近战轮，她可任选一项能力施展：以凝视使目标恐惧（对抗魔杖豁免）、侦测隐形、定位物体、隐形术、改变自身形态、造焰术，或以 <STRONG>25%</STRONG> 的成功率召来另一只艾尼瑞斯。艾尼瑞斯的力量值为 <STRONG>18/01</STRONG>，但力量不带来命中或伤害加值。她们会追捕邪恶者，将其活捉并带回地狱，也可能以交易诱使凡人堕入邪恶。</P><P class="reading-order"><A href="read-355b2121f1092efb.html">上一节：迪斯帕特 · Dispater</A><BR><A href="read-9f69c9670374ec49.html">下一节：格殷永 · Geryon</A></P>
