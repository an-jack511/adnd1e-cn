<P>这种飞行爬行动物通常俯冲捕食海中猎物，但也会攻击任何看似脆弱的生物。它没有牙齿；若猎物大到无法一口吞下，便用喙将其刺穿。典型翼手龙的喙约长 4 尺，体重只有 40–50 磅，却能带走相当于自身四倍重量的猎物。</P><P class="reading-order"><A href="read-0a9afc4106499de8.html">上一节：蛇颈龙 · Plesiosaurus</A><BR><A href="read-d9ed2171d45c175a.html">下一节：剑龙 · Stegosaurus</A></P>
