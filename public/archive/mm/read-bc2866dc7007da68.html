<P>风精灵是与树精相似的美丽生物，但主要栖息在空中。它们喜欢轻盈飞舞，因此很少会在自己的居所附近被发现。20% 的风精灵会与善良阵营生物交朋友，并以某种方式帮助对方。</P>
<P>风精灵拥有 7 级魔法能力，每天可使用 4 个一环、3 个二环、2 个三环和 1 个四环法术；此外还能随意隐形，并每周一次召唤空气元素。风精灵会说自己的语言和通用语。</P><P class="reading-order"><A href="read-5133a2dc05637561.html">上一节：苏魔兽 · Su-monster</A><BR><A href="read-01b42b3bf9db2fc3.html">下一节：T 部怪物 · T</A></P>
