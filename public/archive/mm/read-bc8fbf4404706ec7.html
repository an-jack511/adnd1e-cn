<P>五角龙是鸟臀目四足恐龙，与单角龙、戟龙和三角龙近缘。它是性情凶猛的食草动物，骨盾与角使头部护甲等级为 2，身体护甲等级为 6。若它发动冲锋，会踩踏较小的生物，造成 2–20 点伤害。</P><P class="reading-order"><A href="read-1b53848b329022c6.html">上一节：结节龙 · Paleoscincus</A><BR><A href="read-7a87007eb8490f10.html">下一节：板龙 · Plateosaurus</A></P>
