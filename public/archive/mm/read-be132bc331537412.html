<P>这种双足生物能够改变形态，模仿其观察过的任何类人生物，身高范围为 <STRONG>4–8 尺</STRONG>。变形怪会冒充某个目标，试图杀死对方并取而代之；若无法得手，便直接攻击，并利用混乱使自己难以与被模仿者区分开来（突袭时尤其如此）。</P>
<P>变形怪能使用灵能 ESP，以 <STRONG>90%</STRONG> 的准确度模仿目标。它们不受睡眠或魅惑法术影响。虽然只有 <STRONG>4 颗生命骰</STRONG>，其豁免检定却如同 <STRONG>10 级战士</STRONG>。</P>
<P>注意：变形怪会把自己变成目标的衣物与装备的模样，不仅仅模仿其外貌。</P><P class="reading-order"><A href="read-f0efd8e9a97ec47b.html">上一节：海豚 · Dolphin</A><BR><A href="read-73509e714422f62b.html">下一节：龙 · Dragon</A></P>
