<P>霜巨人通常居住在城堡，也常在寒冷洞穴中筑巢。巢穴中有 50% 概率有 1–6 只冬狼看守。若在巢穴中遇到 4 只以上，编号 5、6 的是巨人女性（生命骰与伤害按石巨人计算），编号 7、8 的是幼年巨人（掷百分骰确定体型）。</P>
<P>成年霜巨人能将石块掷至 1–20 寸远，命中造成 2–20 点伤害；它们有 40% 概率接住同类投来的石块。霜巨人不受寒冷伤害，包括白龙的吐息。</P>
<P><STRONG>外观。</STRONG> 霜巨人肤色惨白如骨或象牙，头发为蓝白色或黄色，眼睛淡蓝或黄色；体格与强壮的人类相似，只是尺寸更大。它们穿盔甲，武器样式近似北方蛮族所用装备。</P><P class="reading-order"><A href="read-c20f87f2cf858c6b.html">上一节：火巨人 · Fire Giant</A><BR><A href="read-519fa1cb7ade9d95.html">下一节：山丘巨人 · Hill Giant</A></P>
