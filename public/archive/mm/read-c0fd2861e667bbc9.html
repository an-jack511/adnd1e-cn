<P>所谓“恶角”（Malebranche）主要来自地狱第六与第七层，是较弱的大魔鬼。它们有时会以“狗剩”“邪尾”“折翼”等名字称呼，憎恨任何比自己强大的存在，并畏惧更强的魔鬼。</P>
<P>角魔若持械，有 <STRONG>75%</STRONG> 的概率使用双叉，造成 <STRONG>2–12 点</STRONG>伤害；有 <STRONG>25%</STRONG> 的概率使用倒刺鞭，造成 <STRONG>1–4 点</STRONG>伤害，并使目标震慑同等数量的近战轮，除非目标通过对抗魔法豁免检定。未持械时，它会以爪、爪、噬咬攻击。无论是否持械，它还可用尾巴攻击，造成 <STRONG>1–3 点</STRONG>伤害；伤口会持续流血，每回合损失 <STRONG>1 点</STRONG>生命值，直到包扎或治愈。角魔周身 <STRONG>5 尺</STRONG>范围会散发恐惧气息，目标可进行对抗魔杖豁免检定。</P>
<P>每回合或每近战轮（视情况而定），角魔可任选一项能力施展：烟火术、造焰术、心灵感应、侦测魔法、幻象，或以 <STRONG>50%</STRONG> 的成功率召来另一只角魔。每天一次，它还能制造一道威力为普通三倍的火墙，造成 <STRONG>3–24 点</STRONG>伤害。</P><P class="reading-order"><A href="read-9f69c9670374ec49.html">上一节：格殷永 · Geryon</A><BR><A href="read-8d6b13d98e9dde17.html">下一节：冰魔 · Ice Devil</A></P>
