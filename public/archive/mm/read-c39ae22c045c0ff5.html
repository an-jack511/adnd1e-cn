<P>V 型恶魔也是雌性恶魔之一：上半身为多臂女性，下半身则是巨蛇。它们比高大的凡人还要高，且更为可怖。六条手臂都能使用武器，偏爱的武器是剑与战斧；蛇尾还能缠住受害者。它们需要时可以施展半径 <STRONG>5 尺</STRONG>的黑暗术；还可随意任选下列能力之一：魅惑人类、如同 <STRONG>11 级魔法师</STRONG>般施展浮空术、阅读语言、侦测隐形物体、烟火术、改变自身形态、投影幻象，或开启传送门召来其他恶魔：I 型 <STRONG>30%</STRONG>、II 型 <STRONG>25%</STRONG>、III 型 <STRONG>15%</STRONG>、IV 型 <STRONG>15%</STRONG>、VI 型 <STRONG>10%</STRONG>、恶魔领主或恶魔王子 <STRONG>5%</STRONG>。不过，传送门成功开启的总概率只有 <STRONG>50%</STRONG>。</P>
<P>低阶恶魔十分畏惧专横残酷的 V 型恶魔。它们都有可用于谈判的名字，并且常要求献祭强大的战士。</P><P class="reading-order"><A href="read-5647c2a0b07322a0.html">上一节：IV 型恶魔 Type IV Demon（Nalfeshnee 等）</A><BR><A href="read-8da43911d2f628f4.html">下一节：VI 型恶魔 Type VI Demon（Balor 等）</A></P>
