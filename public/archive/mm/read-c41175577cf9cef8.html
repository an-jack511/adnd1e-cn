<P>土元素行动较慢。跨越水域时，它必须钻入地下、从水床下方穿过，路程可能十分遥远。对站在土地上的生物造成全额伤害；对飞行、悬浮等未踏地的对手，每颗伤害骰减 2 点。攻击建在石头或泥土上的建筑时，它们如同超级攻城锤，可造成 2–8 点结构伤害（普通小屋约有 7 点结构值）。土元素可从泥土或石头中召来。</P>
<P>据说土元素位面上存在一位体型惊人的首领。</P><P class="reading-order"><A href="read-bba6f4b7872b1919.html">上一节：气元素 · Air Elemental</A><BR><A href="read-0d6c4b1d8f0d8b98.html">下一节：火元素 · Fire Elemental</A></P>
