<P>深狱炼魔居于地狱第一层，力量强大、秉性邪恶，并都有自己的名字；它们是阿斯摩蒂尔斯的贴身仆从。每只通常携带一件钩刃状的 <STRONG>ancus</STRONG> 武器和一根锯齿狼牙棒，可在一个近战轮内同时使用两者攻击。</P>
<P>每回合或每近战轮（视情况而定），深狱炼魔可任选一项能力施展：烟火术、造焰术、火墙术、阅读语言、阅读魔法、侦测魔法、侦测隐形、改变自身形态、定身人类，或开启传送门召来 <STRONG>1–3 只倒刺魔</STRONG>（成功率 <STRONG>60%</STRONG>）或 <STRONG>另一只深狱炼魔</STRONG>（成功率 <STRONG>70%</STRONG>）。每天一次，它可施展痛苦徽记；目标若未通过对抗魔法豁免检定，攻击检定承受 <STRONG>&#8722;4</STRONG> 罚值，敏捷降低 <STRONG>2</STRONG>，持续 <STRONG>2–20 个近战轮</STRONG>。深狱炼魔周围 <STRONG>20 尺</STRONG>范围会散发恐惧气息，目标可进行对抗魔法豁免检定。</P>
<P>所有深狱炼魔的力量值均为 <STRONG>18/00</STRONG>，每个近战轮恢复 <STRONG>2 点</STRONG>生命值。若尾击命中，目标会被尾巴缠住，每回合承受 <STRONG>2–8 点</STRONG>勒束伤害。</P><P class="reading-order"><A href="read-213118ff2ac68242.html">上一节：劣魔 · Lemure</A><BR><A href="read-f52e3224c9f45bfd.html">下一节：恐龙 · Dinosaur</A></P>
