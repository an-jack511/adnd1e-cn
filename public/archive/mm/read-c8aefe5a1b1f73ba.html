<P>巨鸟是外形有些像鹰的巨大鸟类，栖息在温暖地区的最高山峰。它们捕食牛、马、大象等大型生物，会俯冲抓住猎物，用强大的利爪将其带回巢穴。若猎物反抗，巨鸟会用喙攻击，每次造成 4–24 点伤害。</P>
<P>巨鸟的巢穴是由树木、树枝等构成的巨大鸟巢，财宝散落其中；它们不懂得珍惜财宝，那些只是猎物遗骸留下的物品。巨鸟偶尔会被巨人驯服并骑乘。</P><P class="reading-order"><A href="read-b3187bc1ee6b79c0.html">上一节：披毛犀 · Woolly Rhinoceros</A><BR><A href="read-245f4151a938c9dc.html">下一节：绳怪 · Roper</A></P>
