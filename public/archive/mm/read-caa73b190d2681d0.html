<P>沙华鱼人又称“海魔”或“深海魔人”，居住在温暖盐水中 100–1,500 尺深处。它们极端嗜杀，既为食物也为取乐而杀戮，憎恶淡水；它们不喜欢光线，强光（例如光亮术制造的光）会伤害眼睛。沙华鱼人会在无月的黑夜登岸，袭击和掠夺人类村庄。它们甚至憎恨邪恶的刺须鲨，只有鲨鱼会得到它们的善意。</P>
<P>沙华鱼人的社会由一名统治巨大海底城市的国王领导，领地分为九个省，每省由一名王子统治。每个群体由一名首领带领，每十名成员配一名中尉；首领有 4 骰+4 点生命值，中尉有 3 骰+3 点生命值，均不计入遭遇数量。若在巢穴中遭遇，还会有 1 名男爵（6 骰+6）、9 名卫士（3 骰+3）、30–120 名雌性、10–40 名幼体和 20–80 枚卵。每十名雄性有 10% 概率伴随一名邪恶牧师和 1–4 名助祭；巢穴中的牧师为 5–8 级，助祭为 3–4 级。</P>
<P>沙华鱼人的巢穴是石砌村落或城镇，建筑呈穹顶状，周围海藻和海生植物使其难以发现。它们不穿护甲，但鳞片坚硬，相当于护甲等级 5；身上佩戴用来携带装备的背带。一个群体通常有 30% 使用长矛和匕首，50% 使用三叉戟、渔网和匕首，20% 使用重弩和匕首。长矛只用于突刺；渔网带有大量倒钩，力量低于 16 或没有武器的受害者几乎无法挣脱；离岸行动时，渔网会换成 3 支标枪。重弩在水下最远射程为 30 尺。</P>
<P>沙华鱼人的蹼手长有利爪，每只手可造成 1–2 点伤害，并能双手同时攻击；强力后腿的爪足每只造成 1–4 点伤害；满口尖牙咬中造成 1–4 点伤害。因此无武器时也能在一轮内攻击 3 或 5 次（1–2／1–2／1–4，若用双腿抓挠则再加 1–4／1–4）。它们的视觉与听觉特别敏锐，在 100 尺深处能看清 30 尺远处；每增加 100 尺深度，视距减少 1 尺。它们能在一英里外听到金属碰撞或船桨声，但 24 寸以内无法听见游泳等声音。</P>
<P>沙华鱼人使用自己的语言，部分个体能与刺须鲨交流。典型个体背部黑绿、腹部渐变为绿色，鳍为黑色，双眼深黑发亮；每 216 名中约有 1 名四臂变种。雌性略小，幼体孵化后约 1–2 个月变暗并完全成长。它们常袭击海岸、摧毁船只，并把俘虏囚禁、折磨或吃掉。沙华鱼人能离水约 4 小时；贵族城镇有供会呼吸空气的俘虏使用的房间。其国王据说居住在最深处的海底峡谷，统领约 5,000 名沙华鱼人；国王为 10 骰+10，身边有 9 名 6 骰+6 的贵族卫士和一名大祭司及九名助祭。</P><P class="reading-order"><A href="read-5e85c02b90572b93.html">上一节：S 部怪物 · S</A><BR><A href="read-93e73353cffc4aa3.html">下一节：火蜥蜴 · Salamander</A></P>
