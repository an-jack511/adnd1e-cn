<P>耳寄虫是生活在木材中的小型昆虫，以死亡的纤维素为食；它们需要温暖处产卵，因此常选择耳朵一类的地方。进入温暖处后，它总会产下 9–16 枚微小虫卵，然后爬出并死去。虫卵在 4–24 小时后孵化，幼虫会吞食周围的肉，通常向体温与食物最充足处钻入；宿主有 90% 概率因此死亡。疾病痊愈术可杀死虫卵。</P><P class="reading-order"><A href="read-1f17a8a5b9f6407a.html">上一节：巨鹰 · Eagle, Giant</A><BR><A href="read-8ae64b97e28d1df4.html">下一节：鳗鱼 · Eel</A></P>
