<P>漂浮眼是一种极不寻常的咸水鱼。它们身体透明，只有一只约 3 寸大的眼睛清晰可见。任何注视这只眼睛的生物，都必须通过对抗麻痹的豁免检定，否则会被催眠并呆立不动。掠食鱼总在漂浮眼附近徘徊，会吃掉无助的猎物；漂浮眼则吞食残渣。它们也会捕食遇到的小型海洋生物，并以目光催眠猎物。</P><P class="reading-order"><A href="read-ed0cae863dccb10f.html">上一节：双头巨人 · Ettin</A><BR><A href="read-b227ba0bc16a227a.html">下一节：深海之眼 · Eye of the Deep</A></P>
