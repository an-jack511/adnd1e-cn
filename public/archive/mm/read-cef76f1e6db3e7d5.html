<P>这类大型鸟包括鸵鸟、鸸鹋与美洲鸵。它们生活在温暖气候的开阔草原上：鸵鸟大小的有 3 颗生命骰，鸸鹋大小的有 2 颗，美洲鸵大小的有 1 颗。不会飞的鸟通常不具攻击性，遇险便逃；若被逼入绝境，则会啄击（造成 1–4 点伤害）或踢击（造成 2–8 点伤害）。</P><P class="reading-order"><A href="read-687fb1830fc78bd3.html">上一节：F 部怪物 · F</A><BR><A href="read-1a0a4093f5fa0a7a.html">下一节：巨蛙 · Frog, Giant</A></P>
