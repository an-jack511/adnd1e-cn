<P>狼是从极地到温带森林都能发现的食肉动物，总是成群狩猎。饥饿时（75% 概率）会跟踪并攻击猎物，寻找其疏于防备的时刻。狼嚎有 50% 概率使未被人类控制和安抚的食草动物惊慌。狼喜爱马肉；巢穴中每对成年狼有 30% 概率有 1–4 只幼崽。幼狼不战斗，但可训练为战犬或猎兽。</P><P class="reading-order"><A href="read-d5011e691540a3a6.html">上一节：狼 · Wolf</A><BR><A href="read-964aa0fdcdf3b1c3.html">下一节：恐狼 · Dire Wolf</A></P>
