<P>巨型蜈蚣几乎无处不在。它们生性好斗，会猛扑猎物并咬噬，将毒液注入伤口；不过，这种毒液通常较弱，不一定致命（目标的豁免检定骰结果 <STRONG>+4</STRONG>）。此外，由于蜈蚣体型很小，它也更容易受到可进行豁免检定的攻击影响（豁免检定骰结果 <STRONG>&#8722;1</STRONG>）。</P>
<P>蜈蚣的颜色多种多样，从浅灰至黑色、从红色至棕色都有。</P><P class="reading-order"><A href="read-fa7fa67dd8f328ff.html">上一节：半人马 · Centaur</A><BR><A href="read-34968ab9847078ae.html">下一节：脑寄生虫 · Cerebral Parasite</A></P>
