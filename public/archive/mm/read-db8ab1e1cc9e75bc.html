<P>III 型恶魔体格宽阔，皮肤满是皱褶，头似长角的犬类；它有一对钳状前肢，胸前另长着一对人类手臂。普通武器可以伤害它。它能施展半径 <STRONG>10 尺</STRONG>的黑暗术，并可任选造成恐惧、如同 <STRONG>10 级魔法师</STRONG>般施展浮空术、烟火术、改变自身形态、念动价值 <STRONG>4,000 金币</STRONG>的重量，或以 <STRONG>30%</STRONG> 的成功率开启传送门召来 I–III 型恶魔（由骰子随机决定种类）。</P><P class="reading-order"><A href="read-2ecd1e132c844112.html">上一节：II 型恶魔 Type II Demon（Hezrou）</A><BR><A href="read-5647c2a0b07322a0.html">下一节：IV 型恶魔 Type IV Demon（Nalfeshnee 等）</A></P>
