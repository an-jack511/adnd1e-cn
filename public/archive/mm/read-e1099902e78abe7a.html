<P>豺狼人是人类的邪恶敌手：豺狗能够变成人形，常以人类外貌四处游荡，伺机杀害人类，再夺走财物并吞食尸体。它们会使用人类武器。任何未察觉其敌意、且未通过对抗魔法豁免检定的生物，都会受到其凝视影响，如同遭受睡眠术。注意：已经敌对的生物并非“未察觉”。豺狼人有时（20%）会与普通豺狗一同出现。</P><P class="reading-order"><A href="read-89d9e1d2c1627fa6.html">上一节：豺狗 · Jackal</A><BR><A href="read-021e44238a1f2bd0.html">下一节：美洲豹 · Jaguar</A></P>
