<P>双头巨人是只生活在偏远地区的巨人类生物，巢穴总在地下，因为它们喜爱黑暗，且为夜行生物。</P>
<P>双头巨人用双臂同时攻击：左侧的头指挥左臂，右侧的头指挥右臂。左臂一击造成 2–16 点伤害，右臂造成 3–18 点伤害。它们总有一个头保持警觉，因此很难被突袭。</P>
<P><STRONG>外观。</STRONG> 双头巨人显然与兽人关系密切。它们穿着通常破旧污秽的兽皮衣，并使用带刺棍棒等武器。</P><P class="reading-order"><A href="read-ad1005207a065197.html">上一节：高等精灵 · Elf, High</A><BR><A href="read-cca97684b474997e.html">下一节：漂浮眼 · Eye, Floating</A></P>
