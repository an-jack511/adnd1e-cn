<P>眼魔的每只眼睛各有不同能力。若攻击来自眼魔前方 <STRONG>90°</STRONG> 的扇区，通常只有中央眼和 <STRONG>1–4</STRONG> 根眼柄能够发挥作用；攻击来自 <STRONG>180°</STRONG> 扇区时，可发挥作用的眼柄数量加倍；来自 <STRONG>270°</STRONG> 或 <STRONG>360°</STRONG> 扇区时，数量分别增至三倍或四倍。若攻击来自上方，全部 <STRONG>10 根眼柄</STRONG>都能发挥作用，但中央眼不能。</P>
