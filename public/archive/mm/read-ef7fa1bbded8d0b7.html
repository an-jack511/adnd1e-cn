<P>这种被称作“雷龙”的四十吨食草动物生活在沼泽与湖泊附近。它大部分时间待在浅水中，以支撑沉重的身躯；遇到肉食者时会移向深水。迷惑龙会无视小型生物，但容易踩到挡路的东西，造成 4–40 点伤害。</P><P class="reading-order"><A href="read-a2aaf41217735daf.html">上一节：异特龙 · Antrodemus（Allosaurus）</A><BR><A href="read-464ca16e4d5b87f5.html">下一节：阿切隆巨龟 · Archelon Ischyros</A></P>
