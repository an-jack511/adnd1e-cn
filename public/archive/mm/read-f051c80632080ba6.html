<P>僵尸是被魔法唤起的尸体，由邪恶魔法师或牧师控制。它们遵循即时下达或预先指定的命令，命令长度和复杂度通常只有十几个词。僵尸通常出现在墓地、地城和类似的尸骸之地。</P>
<P>僵尸行动缓慢，总是最后攻击，但命中必定造成 1–8 点伤害；它们会战斗至被摧毁，只有牧师能驱散它们。睡眠、魅惑、定身和寒冷法术对僵尸无效；每瓶命中的圣水造成 2–8 点伤害。</P>
