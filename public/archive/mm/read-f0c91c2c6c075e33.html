<P>风暴巨人是最强大、最受尊敬的真正巨人。这些通常隐居的巨人只生活在偏僻之地：巢穴有 60% 位于云岛，30% 位于山峰，10% 位于水下；它们会在那里建造宽敞的城堡。巢穴有 30% 概率饲养动物作为守卫或宠物。居住在云岛或山峰上的风暴巨人有 70% 概率饲养 1–2 只巨鹰，也会将其作为坐骑；另有 30% 概率饲养 1–4 只狮鹫。水下的风暴巨人则会有 2–8 头海狮。</P>
<P>风暴巨人不掷石攻击，而是施展天赋魔法与法术。每天一次，它可以发出 8 枚八面骰伤害的闪电箭；每天两次，它可使自己以及额外不超过 30,000 金币重量的物体悬浮。它还能随意在水下正常呼吸；水下的风暴巨人也可正常移动并施放闪电箭。它每天还可各施展以下法术一次，每次只施展一种：预言天气、召唤闪电（3 道闪电，每道造成 10–15 枚六面骰伤害）、控制风向、召唤风暴。风暴巨人被激怒进入战斗时，很可能先召唤风暴并引来闪电，因为暴风雨最适合愤怒的风暴巨人作战。</P>
<P>风暴巨人不受电击能量伤害，包括蓝龙吐息造成的电击。</P>
<P><STRONG>外观。</STRONG> 风暴巨人的肤色从浅淡的绿到紫色不等；海生个体通常为绿色，长着深绿头发与翡翠绿眼睛。其他风暴巨人的头发多为深紫或蓝黑色，眼睛为银灰或紫色。</P><P class="reading-order"><A href="read-093a248e94c22110.html">上一节：石巨人 · Stone Giant</A><BR><A href="read-bf62535554992c3d.html">下一节：豺狼人 · Gnoll</A></P>
