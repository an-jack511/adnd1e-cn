<P>水元素几乎只能在水中行动，离开其元素环境不得超过 6 寸。召来水元素通常需要相当大量的水：至少 1,000 立方尺的水池；不过数个大酒桶的麦酒或葡萄酒也足够。在水元素位面之外，其力量会减弱，每颗伤害骰减 1 点；在水中则能发挥全部威力，移动更快，还能掀翻小船（每颗生命骰可掀翻 1 吨船只），或减速、拦停船只（每点生命值可拦停 1 吨船只；若船只吨位更大，可按吨位与生命值之比计算减速程度）。</P>
<P>水元素位面还存在许多其他元素形态。具有智慧、自由行动的生物十分常见，也有远比此处所述更强大的元素生物；它们可能由一位神一般的君王统治。</P><P class="reading-order"><A href="read-0d6c4b1d8f0d8b98.html">上一节：火元素 · Fire Elemental</A><BR><A href="read-9a4da69d16f674c4.html">下一节：象 · Elephant</A></P>
