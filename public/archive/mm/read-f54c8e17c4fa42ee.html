<P>骨魔栖居于地狱下层，尤其是第五层；它们生性恶毒，喜欢折磨弱小生物。骨魔喜寒恶热，还拥有超视术，可在 <STRONG>60 尺</STRONG>范围内看见紫外光谱中的光线。</P>
<P>骨魔有一柄巨大的骨钩，用来钩住并伤害对手。目标被钩中后，有 <STRONG>50%</STRONG> 的概率被牢牢钉住；随后骨魔会以尾巴攻击，造成 <STRONG>2–8 点</STRONG>伤害，并使目标失去 <STRONG>1–4 点</STRONG>力量，除非其对抗毒素的豁免检定成功。力量损失持续 <STRONG>10 个近战轮</STRONG>。</P>
<P>每回合或每近战轮（视情况而定），骨魔可任选一项能力施展：在半径 <STRONG>5 尺</STRONG>范围内制造恐惧、制造幻象、飞行、隐形、侦测隐形、施展恐惧术，或以 <STRONG>40%</STRONG> 的成功率召来另一只骨魔。每天一次，它还能制造一道冰墙。</P><P class="reading-order"><A href="read-61eae2abd2fba6ee.html">上一节：倒刺魔 · Barbed Devil</A><BR><A href="read-355b2121f1092efb.html">下一节：迪斯帕特 · Dispater</A></P>
