<P>雄鹿甲虫栖息于林地，十分喜爱谷物及其他作物，因此有时会大量侵扰农田。与其他甲虫一样，它们视力和听觉都很差；不过受到攻击时会还击，也会攻击它们视为食物的有机物。巨型雄鹿甲虫的两只角通常至少有 <STRONG>8 尺</STRONG>长。</P><P class="reading-order"><A href="read-0987470539d19349.html">上一节：犀甲虫 · Rhinoceros Beetle</A><BR><A href="read-5e68bba844e7d087.html">下一节：水甲虫 · Water Beetle</A></P>
