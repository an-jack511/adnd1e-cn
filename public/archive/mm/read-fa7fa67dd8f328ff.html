<P>半人马居住在远离人类聚居地的隐蔽牧场。游荡的半人马群总是携带武器，首领还会带盾。半数半人马会装备橡木棍棒（效果相当于晨星；每次攻击对不同体型的目标造成 <STRONG>1–8</STRONG> 或 <STRONG>1–6 点</STRONG>伤害）；四分之一携带复合长弓和 <STRONG>10–30 支</STRONG>箭（射程 <STRONG>24 寸</STRONG>，每次攻击造成 <STRONG>1–6 点</STRONG>伤害）；其余四分之一是首领（护甲等级 <STRONG>4</STRONG>），持盾与长枪（每次攻击造成 <STRONG>1–8</STRONG> 或 <STRONG>2–24 点</STRONG>伤害）。首领的财宝加倍。近战中，每只半人马攻击两次：先用武器攻击，再像马一样用两只前蹄攻击。</P>
<P>若在巢穴中遇到半人马，那里会是一处隐蔽山谷，水草丰美。巢穴中另有 <STRONG>1–6 名</STRONG>成年雄性；雌性的数量是雄性的两倍；幼崽则有 <STRONG>5–30 只</STRONG>。雌性半人马（<STRONG>3 个生命骰</STRONG>）与幼崽（<STRONG>1–3 个生命骰</STRONG>）不使用武器，只有在生死关头才会用蹄子战斗。若雌性与幼崽受到威胁，半人马有 <STRONG>90%</STRONG> 的概率以主要财宝赎回她们。半人马会说自己的语言，以及与其阵营相应的语言。</P>
<P>半人马通常不喜欢人类与矮人；它们容忍侏儒和半身人；对精灵友善，尤其喜爱木精灵。</P><P class="reading-order"><A href="read-0e940e62e3cddd01.html">上一节：野化牛群 · Cattle, Wild</A><BR><A href="read-d0ff3b6d7402ae44.html">下一节：巨型蜈蚣 · Centipede, Giant</A></P>
