<P>飞龙与龙有远亲关系，也栖息在龙喜爱的纠结森林、巨大洞穴等地。它们相当愚钝却极具攻击性，总会主动攻击。飞龙用嘴咬噬造成 2–16 点伤害，并以带毒刺的尾巴同时攻击一两名对手。被尾刺命中的生物必须进行毒素豁免，否则死亡；即使通过，也会受到 1–6 点伤害。尾巴很长且灵活，能从身体后方绕过来攻击前方敌人。飞龙呈深棕至灰色，眼睛橙色或红色。</P><P class="reading-order"><A href="read-c57ca1ccaff11c50.html">上一节：幽影 · Wraith</A><BR><A href="read-b8b4cc6584d5dfea.html">下一节：X 部怪物 · X</A></P>
