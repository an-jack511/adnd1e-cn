<P>两种松鼠的巢穴内百分比、特殊攻击／防御和灵能能力均无；魔法抗性均为标准，体型均为 S。</P>
<P>巨人 Black 松鼠 只出现在被邪恶力量占据的古老黑暗森林中。它们恶毒，会攻击弱小或无助的生物。如果有机会，它们会从粗心个体那里偷走小型闪亮物品（硬币、戒指、珠宝、瓶子等），藏进巢穴。巢穴总在离地 20 英尺或更高的树洞中，财宝只有零星物品。</P>
<P>普通灰色或红色松鼠只会在自卫时咬人。飞行肉食松鼠另见下文。</P>
