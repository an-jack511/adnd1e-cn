<P>Yeth 只在最荒野偏僻之地出现，日光消退前躲在地下巢穴，出来猎食温血动物，尤其喜爱类人、棕精灵等。它们的可怖嚎叫可传一英里；9" 内生物须对抗法术豁免，否则恐慌逃跑，通常被群犬扑倒啃死。它们常与夜女巫、邪恶人类及其他邪恶猎手合作；会与其一同狩猎者不受嚎叫恐惧。外形是暗黑巨犬，头部近似人脸，耳朵像角，眼睛樱红发光。</P>
