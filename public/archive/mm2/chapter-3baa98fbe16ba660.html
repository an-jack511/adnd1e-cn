<P>这种奇异蜥蜴有凹凸多疣的外皮和类似变色龙的能力，可以潜伏在岩石地区，看起来只是一堆碎石或岩块。岩石爬兽 偏爱黑暗，但非常饥饿时偶尔会在白天外出。</P>
<P>它的第一次冲刺速度是正常速度的两倍，因此有 3/6 的概率突袭猎物。把猎物拖回巢穴时，巢中可能留下财宝：J、K、L 和 M 各有 25% 的概率，还有 Q、S（×2）和 T（×2）。如果遇到 2 只，只有金属和宝石财宝翻倍。</P>
