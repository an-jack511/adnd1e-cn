<P>这些蛞蝓般的生物在洞穴中组成群落。它们生活在石墙里的囊状洞穴中；猎物经过时，它们会冲出来，通常从通道两侧同时发动攻击。攻击范围从 3–5 英尺不等。生物必须缩回囊穴，才能为下一次攻击蓄力。</P>
<P>洞穴海鳝的身体护甲等级为 5，但它们速度极快，因此击中暴露在外的身体的概率只有 1/20。洞穴海鳝的皮肤呈棕灰色；头部结节状且有斑驳，眼睛暗棕色、鼓胀，外表像岩石。</P>
