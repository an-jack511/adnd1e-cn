<P>它们视力至少与鹰、隼或鹫相当，在高空寻找不规则移动、跛行或倒地生物。普通型会在被有效反击前保持距离；巨型型必须真正被命中才离开。附近生物倒地后 7–12 轮到达，每轮 1–6 只啄食；若猎物迅速移走并置于明显健康者身边，则不会吸引它们。</P>
