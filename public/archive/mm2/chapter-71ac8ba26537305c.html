<P>山羊 栖息在丘陵、平原和山地的灌木丛生区域。除非被逼入绝境，否则它们只会攻击。雄山羊可以发动冲锋，使命中骰获得 +2，并额外造成 1–2 点伤害。一群 山羊 由 1–2 只雄山羊、最多 12 只雌山羊以及其余的幼崽组成；幼崽不是战斗者。</P>
