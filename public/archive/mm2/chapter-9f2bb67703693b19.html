<P>与其他类型的熊一样，这些生活在亚北极和温带地区的熊是杂食动物。一次爪击的生命骰结果为 18 或更高，表示完成了一次“拥抱”，并额外造成 3–18 点伤害。这些好斗的动物在生命值降至 0 至 -12 点后仍会战斗 2–5 轮，但受到更大的伤害就会立即死亡。</P>
