<P>它们是大型狮身人面马，在温带草原和稀树草原游荡，以羚羊等群居动物为猎。会说本族语与 通用语，懂火，是优秀追踪者和向导。只在 1 上被突袭，可向上跳 10 英尺、向前跳 30 英尺。雄性带标枪和石棍或短剑，常用硬皮盾（AC 5）；雌性无武器，但幼崽受袭时攻击命中 +2；幼崽不战斗。部族由首领、护卫和偶尔的巫医组成，巫医为 7 级牧师/4 级魔法使用者。</P>
