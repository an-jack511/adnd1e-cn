<P>巨鹤生活在普通鹤、苍鹭、麻鳽及类似涉水鸟类相同的栖息地。它们在沼泽、湿地、水道两岸或湖边捕捉大鱼。巨鹤通常不主动攻击，但会保护配偶、幼鸟和筑巢区域。如果遇到超过 10 只，其中每一只额外出现的鸟都有 50% 的概率是未成年个体。如果遇到 20 只，有 50% 的概率它们属于一个有 31–50 只成员的大鸟群（1d20+30）；鸟群中会有 3–12 只半成年的雏鸟。</P>
