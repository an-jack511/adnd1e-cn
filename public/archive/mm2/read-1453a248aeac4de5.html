<P>人类认为阿斯匹斯神秘莫测。除非为了寻找食物而进行劫掠，否则很少在有人居住的土地上遇到它们。它们通常以小群体生活，专心处理自己的事务，偶尔才与外界接触。很少有人能够报告见过这些生物；幼虫与母牛的存在也只是传闻。然而，为了这个种族的生存，它们必然存在。</P>
