<P>褐布丁怪主要栖息在沼泽。它的外皮更坚硬，但攻击比其他类型弱。褐布丁怪不会溶解金属，却能在 1 个完整轮内摧毁皮革或木材，无论这些材料具有多少魔法加值。</P><P class="reading-order"><A href="read-aeabbde1ed9a15d1.html">上一节：致命布丁怪 · Deadly Pudding</A><BR><A href="read-f47e6cb522d04f0e.html">下一节：暗褐布丁怪 · Dun Pudding</A></P>
