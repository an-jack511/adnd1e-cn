<P>水獭是鼬类等动物的水生近亲，生活在河流、池塘和湖泊中。海獭是普通水獭中最大的一种，生活在浅海沿岸；上方括号中的数值代表海獭差异。它们行动迅速而顽皮，只有被逼入绝境时才会攻击。它们的皮毛具有毛皮价值。</P><P class="reading-order"><A href="read-564f2b7276eea52f.html">上一节：奥皮尼库斯 · Opinicus</A><BR><A href="read-03569412a95acab5.html">下一节：猫头鹰 · Owl</A></P>
