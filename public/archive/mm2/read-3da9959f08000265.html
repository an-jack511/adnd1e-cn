<P>剑鱼 是咸水中常见的强壮鱼类。它们速度快，通常没有攻击性，会逃跑而不是战斗。但被攻击、激怒、控制或训练时，会用长而骨质的“剑”作为可怕武器。较小的剑鱼通常被水生精灵和海豚群落当作宠物和守卫。</P><P class="reading-order"><A href="read-250522c741c6ad60.html">上一节：天鹅女 · Swanmay</A><BR><A href="read-01b42b3bf9db2fc3.html">下一节：T 部怪物 · T</A></P>
