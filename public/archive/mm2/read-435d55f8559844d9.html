<P class="breadcrumbs"><A href="index.html">怪物图鉴 II</A> &gt; <A href="read-b056d88f237a2307.html">D 部怪物 · D</A> &gt; <A href="read-6add87423c08c35f.html">魔鬼 · Devil</A></P><H1>地狱位面的层级</H1>
<P>《怪物图鉴 I》详细说明了许多魔鬼的名称与等级，但并不完整。下列名单列出地狱公爵以及其中一些最重要的部下。多数魔鬼没有给出统计资料和描述。一般而言，公爵大致相当于较弱的大魔鬼，但有些只比 深狱炼魔 强一点，或者实际上就是 深狱炼魔。</P>
