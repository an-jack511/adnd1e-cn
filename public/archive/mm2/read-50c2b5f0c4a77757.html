<P>这些在侏罗纪平原上游荡、速度极快的食肉动物，会捕猎从昆虫和蛋到与自身体型相当的各种小型猎物。虽然体重相当轻，但由于速度很快，很难击中。只要数量明显超过受害者且足够饥饿，嗜鸟龙也会攻击大型生物。</P><P class="reading-order"><A href="read-4222b07c51e28b5c.html">上一节：幻龙 · Nothosaurus</A><BR><A href="read-d7f6cbbcd5ae37fc.html">下一节：恐鹤 · Phororhacos</A></P>
