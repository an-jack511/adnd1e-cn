<P class="breadcrumbs"><A href="index.html">怪物图鉴 II</A> &gt; <A href="read-5e85c02b90572b93.html">S 部怪物 · S</A> &gt; <A href="read-b1e4bac3a61c90e1.html">幽影人 · Shade</A> &gt; <A href="read-844eb6d621291dc2.html">幽影人的特殊能力 · Shade Special Abilities</A></P><H1>阴影影像</H1>
<P>幽影人 可以用阴影制造自身的精确复制体，使复制体像活物一样行动。它能制造 2–5 个阴影影像，并在它们距离自己 30 英尺内时控制行动。只有改变 幽影人 周围的光照条件，才能驱散影像。阴影影像没有物质，因此攻击不造成伤害；而且 幽影人 必须从周围阴影中抽取物质来制造它们。</P><P class="reading-order"><A href="read-5e6604243743d9c8.html">上一节：阴影行走</A><BR><A href="read-459107e7ac4b1c7b.html">下一节：其他能力</A></P>
