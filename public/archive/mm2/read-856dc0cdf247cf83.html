<P class="breadcrumbs"><A href="index.html">怪物图鉴 II</A> &gt; <A href="read-a0abd3c1322508a6.html">如何使用本书 · How To Use This Book</A> &gt; <A href="read-ccce1a022008dda3.html">一般条目</A></P><H1>阵营 · ALIGNMENT</H1>
<P>阵营表示怪物面对秩序、混沌、善、恶或中立时的典型行为。怪物的阵营会显著影响它遭遇时的行为方式、在特定情况下的反应等。括号中的词表示倾向。因此，“守序善良（中立）”表示倾向于中立。</P><P class="reading-order"><A href="read-30699d94d522295a.html">上一节：智力 · INTELLIGENCE</A><BR><A href="read-78f5ea7d6297d504.html">下一节：体型 · SIZE</A></P>
