<P>这些行动迟缓、极其愚蠢的生物是任何饥饿捕食者的容易猎物。它们通常愚蠢到直到同伴中的一只被杀才会逃跑。任何被卷入这些生物冲锋的人，都必须进行对抗死亡射线的豁免，否则会被踩死。一个群体会由小型、中型和大型个体组成。</P><P class="reading-order"><A href="read-4f0be340460f5f00.html">上一节：近蜥龙 · Ankisaurus</A><BR><A href="read-727461fb2746c172.html">下一节：美颌龙 · Compsognathus</A></P>
