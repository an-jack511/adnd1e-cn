<P>“帆背” 异齿龙 是二叠纪早期的凶猛捕食者。它像短吻鳄，实际上是爬行动物而不是恐龙。它能否游泳尚不确定，但很可能可以。强力撕咬弥补了它没有爪击的缺陷。</P><P class="reading-order"><A href="read-4bea8084a2dacc3f.html">上一节：双脊龙 · Dilophosaurus</A><BR><A href="read-bd7cd62c27c2a489.html">下一节：派克鳄 · Euparkeria</A></P>
