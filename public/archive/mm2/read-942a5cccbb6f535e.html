<P class="breadcrumbs"><A href="index.html">怪物图鉴 II</A> &gt; <A href="read-b056d88f237a2307.html">D 部怪物 · D</A> &gt; <A href="read-73509e714422f62b.html">龙 · Dragon</A> &gt; <A href="read-0140f309a797d9d3.html">云龙 · Cloud Dragon</A></P><H1>降水术</H1>
<P>降水术造成一次短暂阵雨（12–14 段时间）。阵雨最远可出现在距龙 HD" 的位置，形状是高 12"、直径 3" 的圆柱。雨水会完全打湿蜡烛等小火焰，使小型火堆闷烧 1 轮，但不会影响大型火焰。除非通过豁免，所有极热的生物（例如 火蜥蜴）在雨中每段时间承受 1 点伤害。</P><P class="reading-order"><A href="read-0140f309a797d9d3.html">上一节：云龙 · Cloud Dragon</A><BR><A href="read-a00546104d728704.html">下一节：云爆术</A></P>
