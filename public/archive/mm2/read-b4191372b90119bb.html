<P>公羊生活在亚北极至温带地区，偏爱多岩石的丘陵草地，避开树木茂密的地方。25% 的遭遇是单独一只；其他遭遇为 1–6 只，另有 3–18 只母羊和数量为母羊一半的羔羊。</P>
<P>只有在羊群无法通过飞奔逃脱时，公羊才会攻击威胁羊群的生物。冲锋距离达到 20 英尺或更远时，攻击获得 +1 命中并造成双倍伤害。母羊只会顶撞，不会冲锋；羔羊不战斗。</P><P class="reading-order"><A href="read-dc3b27eb5bb43625.html">上一节：R 部怪物 · R</A><BR><A href="read-b4a2ac8e5f1d2c7b.html">下一节：普通鼠 · Rat</A></P>
