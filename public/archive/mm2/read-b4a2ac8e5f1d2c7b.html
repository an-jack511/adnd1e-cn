<P>从森林荒野到城市下水道，任何地方都能发现各种大小和颜色的老鼠。虽然胆小，被困住或逼入绝境的老鼠会凶猛战斗。饥饿时，鼠群会攻击任何活物以取得食物。像巨鼠一样，这类普通啮齿动物的污秽咬伤有 5% 的概率造成严重疾病，除非对抗毒素豁免成功。普通鼠害怕火，但饥饿时有时会冒险穿过火焰。</P><P class="reading-order"><A href="read-b4191372b90119bb.html">上一节：公羊 · Ram</A><BR><A href="read-d9dad0565780a183.html">下一节：蒸汽鼠 · Vapor Rat</A></P>
