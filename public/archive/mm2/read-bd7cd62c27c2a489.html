<P>这种下三叠纪的小型食肉恐龙祖先，大小约等于小狗。它们以 2–8 只成群出现；如果有 3 只或更多，就会攻击 1–2 个小型生物或单个类人生物大小的生物。如果足够饥饿，一群派克鳄会跟踪并攻击一大群猎物，尤其是在目标中有一人受伤时。</P><P class="reading-order"><A href="read-9126c1fef5bd9c15.html">上一节：异齿龙 · Dimetrodon</A><BR><A href="read-3b31f06da70448b6.html">下一节：钉状龙 · Kentrosaurus</A></P>
