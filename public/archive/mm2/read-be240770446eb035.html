<P>当人类女性与恶魔交配时，后代总是男性坎比翁半恶魔。坎比翁半恶魔的一般特征和能力取决于其血统。</P>
<P>坎比翁半恶魔的护甲等级取决于穿着的护甲类型和个体的敏捷。根据血统，基础护甲等级不是通常的 10，而是 6 或 2。</P>
