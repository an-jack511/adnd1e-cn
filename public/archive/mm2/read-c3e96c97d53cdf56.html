<P>这种上白垩纪恐龙是杂食动物。它必须非常饥饿才会攻击人类，但较小的类人生物和半人类会被视为可能的食物。它通常偏好高草地区作为栖息地。</P><P class="reading-order"><A href="read-027911d84bd204e0.html">上一节：轻足龙 · Podokesaurus</A><BR><A href="read-aff1642c1d517be1.html">下一节：长颈龙 · Tanystropheus</A></P>
