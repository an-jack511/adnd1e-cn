<P>所有哈得斯魔裔都拥有超视觉。拥有可用手的个体可以使用武器。它们每天一次都能变得近乎隐形（76% 的概率），持续最多完整 1 轮；这需要 1 轮准备。除此之外，哈得斯魔裔并不显眼。注意：在牧师的“驱散”和类似效果方面，将哈得斯魔裔视为次级恶魔。</P><P class="reading-order"><A href="read-e7bb41a9b75d129d.html">上一节：特殊攻击表</A><BR><A href="read-0d1ec5f4ca3a2b6f.html">下一节：鹿人 · Hybsil</A></P>
