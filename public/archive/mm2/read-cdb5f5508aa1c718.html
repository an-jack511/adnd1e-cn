<P>两种 蝎子 都会以钳子和尾刺攻击，魔法抗性标准、智力非智能、阵营中立、灵能能力无。尾刺击中时，受害者必须对抗毒素豁免，否则立即死亡；Large 蝎子 的毒较弱，豁免获得 +2。</P>
<P>它们经常出现在地下城和荒野中，只是 巨蝎 的较小版本。</P><P class="reading-order"><A href="read-b37935b9a693cde3.html">上一节：沙灵 · Sandling</A><BR><A href="read-a5cd326720d8b305.html">下一节：污垢爬兽 · Scum Creeper</A></P>
