<P>恐鹤是中新世时期不会飞的鸟。它是无所畏惧的杀手，即使处于数量劣势也经常攻击。它跳跃攻击时（初次攻击总会这样做），爪击造成双倍伤害（2–8/2–8）。这种生物不是恐龙，但可以在支持这类生命形态的环境中生存。</P><P class="reading-order"><A href="read-50c2b5f0c4a77757.html">上一节：嗜鸟龙 · Ornitholestes</A><BR><A href="read-67b5ea2bc1a70de1.html">下一节：巨型翼龙 · Pterosaur, Giant</A></P>
