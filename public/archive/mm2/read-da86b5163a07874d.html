<P>缠绕蛇通常伏击猎物，偏好林地或沼泽。它们先咬击，再缠绕绞杀。缠绕攻击命中后，之后每轮自动造成绞杀伤害。人形生物可以凭借力量挣脱缠绕；需要掷开门检定，并对检定结果施加 +1 惩罚。</P><P class="reading-order"><A href="read-3f8a8db7f2034fc3.html">上一节：蛇 · Snake</A><BR><A href="read-b86977509bc43168.html">下一节：有毒 · Poisonous</A></P>
