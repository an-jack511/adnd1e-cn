<P class="breadcrumbs"><A href="index.html">怪物图鉴 II</A> &gt; <A href="read-b056d88f237a2307.html">D 部怪物 · D</A> &gt; <A href="read-73509e714422f62b.html">龙 · Dragon</A> &gt; <A href="read-79e1437717b0d7ff.html">龙总则 · Dragon General Rules</A></P><H1>豁免</H1>
<P>当龙达到每生命骰 5 点或更多生命值时，其豁免检定按总生命值除以 4 计算，因此得到高于实际生命骰数量的生命骰数。这反映了龙的魔法抗性和整体坚韧。相反，即使极幼龙每骰生命值只有 1 点，计算所需豁免数值时仍会获得实际生命骰数量的好处。这同样反映了龙族的本质，即魔法抗性与坚韧。</P><P class="reading-order"><A href="read-67fe2ae4dadd16a4.html">上一节：宝藏</A><BR><A href="read-0140f309a797d9d3.html">下一节：云龙 · Cloud Dragon</A></P>
