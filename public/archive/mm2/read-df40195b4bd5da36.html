<P>独角鲸 被称为“海洋独角兽”，常见于凉爽至寒冷的水域。它们是体型相当大的海洋哺乳动物，身长约 20–40 英尺，不包括 6–12 英尺长的螺旋“角”。</P>
<P>独角鲸 基本上不具攻击性，只有在受到严重威胁或实际攻击时，才会用巨角自卫。海豚群落会把它们当作宠物和守卫；水生精灵有时也会训练和使用它们。</P><P class="reading-order"><A href="read-2d2ca996194b1405.html">上一节：N 部怪物 · N</A><BR><A href="read-f39c9d388f6a6dbd.html">下一节：水宁芙 · Nereid</A></P>
