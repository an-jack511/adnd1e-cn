<P>这种最大的巨型苍蝇极具攻击性。它倾向于落在任何生物身上并吸食其血液。咬过之后，除非它被赶走或杀死，否则巨人虻会在下一轮吸走伤口中的血液或体液，造成等同于咬击的伤害。</P><P class="reading-order"><A href="read-a540157837fd69f6.html">上一节：丽蝇 · Bluebottle</A><BR><A href="read-0547f7857fd90a25.html">下一节：福兽 · Foo Creatures</A></P>
