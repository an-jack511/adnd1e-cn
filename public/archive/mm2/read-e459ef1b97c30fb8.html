<P class="breadcrumbs"><A href="index.html">怪物图鉴 II</A> &gt; <A href="read-91889a2071fa6764.html">B 部怪物 · B</A> &gt; <A href="read-b2b6d9a175faca5b.html">蝙蝠 · Bat</A></P><H1>普通蝙蝠</H1>
<P>普通蝙蝠这一类别包括许多种类。只有在被逼入绝境、不得不战斗时，它们才会攻击。受到惊吓时，蝙蝠往往会变得恐惧而混乱；如果附近有人的话，它们会成群乱飞、撞向物体、扑灭火把、干扰施法等。蝙蝠的声呐使它们能在完全黑暗中飞行。在良好的飞行条件下，蝙蝠的护甲等级会从 8 提高到 4。在某些大型洞窟中，可能有多达 1000 只或更多蝙蝠。</P><P class="reading-order"><A href="read-6fad33efe82d14e9.html">上一节：巨蝠</A><BR><A href="read-a9a3f8b444a95b6d.html">下一节：火蝠 · Bat, Fire</A></P>
