<h1>生存 · Survival</h1>
<P>在以太位面中，角色仍需要空气、食物和水；但是时间关系会使这些需求比原初位面更快累积。若角色在边界以太中停留很久，应记录其主观时间，而不是只记录原初位面中经过的轮数。</P>
<P>以太位面中的正常方向感很差。角色需要依靠法术、熟悉的参照物、同伴或特殊装备保持路线；失去方向的队伍可能在边界与深层以太之间来回漂移，或错过预定的返回点。</P>
