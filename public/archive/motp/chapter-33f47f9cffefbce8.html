<h1>玩家角色 · Player Characters</h1>
<P>法师与幻术师在星界保留施法能力，但涉及移动、召唤和改变环境的法术需要按星界规则调整。牧师与德鲁伊的法术依赖其神祇所在位面；盗贼大体正常，攀爬墙壁在无重量环境中用途较小。战士、巡林客、野蛮人、骑士、圣武士和武僧保留大多数职业能力，但惊讶、格挡、移动和感知会受到无重力与心灵移动的影响。</P>
