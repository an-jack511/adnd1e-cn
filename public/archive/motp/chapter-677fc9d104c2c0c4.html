<h1>玩家角色 · Player Characters</h1>
<P>魔法师与幻术师可以正常恢复法术；牧师与德鲁伊受到神祇所在位面的限制。盗贼面对本位面原住民时通常承受 <STRONG>–20%</STRONG> 检定修正，圣武士、战士和骑士的大多数战斗能力正常生效。巡林客在内层位面中失去避免被偷袭的优势，但仍保留发现偷袭者的机会。野蛮人、武僧和其他职业的特殊能力，按本章关于重力、元素伤害和魔法的规则处理。</P>
