<h1>准元素生物 · Para-Elemental Creatures</h1>
<P>副元素生物通常分为元素类人和元素怪物。烟、岩浆、泥和冰的元素类人可按 d20 分别决定出现几率；烟与火、岩浆与火、泥与水、冰与水的相邻关系决定它们的外观与能力。准元素生物是原初生物的元素版本，通常保留原始智能与职业能力，但获得对应准元素的免疫和弱点。</P>
