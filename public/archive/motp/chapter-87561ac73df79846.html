<h1>移动 · Movement</h1>
<P>星界有两种移动：物理移动和心灵移动。物理移动需要推开物体或借助外力；心灵移动由智力和意志决定，是跨越星界的主要方法。旅行者选择一个目标位面或颜色池后，通常可在几轮到数小时内到达；若不清楚目标，只能在星界中漫游。</P>
<P>旅行者的心灵移动速度取决于智力，智力越高越快。物理移动可通过推动岩块、同伴或其他物体实现；速度与施力者力量有关。大型星界生物和星界船只也能提供稳定的物理旅行方式。</P>
