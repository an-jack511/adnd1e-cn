<h1>战斗 · Combat</h1>
<P>内层位面的战斗规则因位面而异。护甲通常正常发挥作用；近战武器和远程武器也通常可用，但非魔法远程攻击在没有空气或其他传播介质的位面中会受到限制。生物可能从上方、下方和侧面发动攻击，盾牌与掩护方向由当地重力决定。</P>
<P>魔法武器通常能伤害元素生物，普通武器则可能只能造成极少伤害或完全无效。武器、护甲与法术的跨位面作用，优先检查该物品或法术的具体说明。</P>
