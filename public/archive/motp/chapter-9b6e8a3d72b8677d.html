<h1>组织 · Organization</h1>
<P>每个主要位面都按四个部分介绍：概览、前往、生存、移动、遭遇、战斗、魔法和玩家角色。并非每个位面都需要所有部分；有些位面会另列特殊特征、半位面或独有的旅行方式。</P>
<P>地下城主可以按下列顺序使用这些章节：先决定角色如何抵达，再决定环境如何影响角色，然后处理移动、遭遇和战斗；最后再检查哪些法术、魔法物品与特殊能力有效。</P>
