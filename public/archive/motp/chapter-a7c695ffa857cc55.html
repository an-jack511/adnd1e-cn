<h1>战斗 · Combat</h1>
<P>星界战斗不受重量影响。物理形体与星界形体都可被攻击，但星界形体受到的伤害会反映到肉身；魔法武器和护甲在星界通常降低一档效果，非魔法护甲只提供有限保护。力量和敏捷对星界攻击没有通常意义，攻击与伤害更多由智力和感知决定。</P>
<P>星界中的武器可以正常使用，但远程攻击会受方向和心灵移动影响。来自下方的攻击相当于背后攻击；导弹武器在星界距离更长，却容易被移动目标避开。毒药、酸和液体会形成漂浮的球，可能贴在目标身上并继续造成伤害。</P>
