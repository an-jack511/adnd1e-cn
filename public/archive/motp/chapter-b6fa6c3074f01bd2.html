<h1>战斗 · Combat</h1>
<P>外层位面战斗大体类似原初位面，但地形、层数和阵营会改变细节。不同位面的环境可能使火、冰、毒、酸或光明效果增强或减弱；某些原住民对非魔法武器免疫，另一些则会因相反阵营的攻击而受到额外伤害。魔法物品在星界或跨层通道中可能降低一档，但在外层位面通常恢复其本来力量。</P>
