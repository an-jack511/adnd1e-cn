<h1>时间 · Time</h1>
<P>不同位面的时间并不总是以同样的速度流逝。这里的“真实轮”指原初位面的标准时间；“主观轮”指正在被描述的位面中的时间。</P>
<figure class="rule-table" id="read-dbf2cf32c2bbe127-table-1"><figcaption><a href="#read-dbf2cf32c2bbe127-table-1">表 1　时间 · Time</a><button type="button" data-cite=《AD&amp;D 1e 不全书》v1.0.0 · 位面手册 Manual of the Planes · 时间 · Time · 表 1 时间 · Time">复制引用</button></figcaption><div class="scroll-table" tabindex="0" aria-label="规则表格"><TABLE class="MsoNormalTable rules-table" style="BORDER-COLLAPSE: collapse; WIDTH: auto" cellSpacing=0 cellPadding=0 border=0 align=center>
<TR><TH style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">位面</TH><TH style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">时间关系</TH></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">原初位面</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">两种时间相同。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">以太位面</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">每经过 1 个真实轮，经过 10 个主观轮。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">内层位面</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">每经过 1 个真实轮，经过 2 个主观轮。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">星界位面</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">每经过 365,000 个主观轮，约等于 170 个真实日。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">外层位面</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">两种时间相同。</TD></TR>
</TABLE></div></figure>
<P>这些关系只适用于主要位面。半位面和独立领域可能有自己的时间法则：时间可以加速、减慢、反向流动，甚至完全停止。法术持续时间、衰老、饥饿和恢复都应按角色所在位面处理。</P>
