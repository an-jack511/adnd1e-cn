<h1>宝藏 · Treasure of Elemental Creatures</h1>
<P>元素生物的宝藏依照怪物书中的对应生物处理，但宝藏内容会受位面影响。空气位面的宝藏常是药剂、香水和轻质魔法物品；火焰位面有金币、宝石、金属和熔炉制品；土位面有矿石、宝石与金属；水位面有珍珠、珊瑚、沉船货物和双倍数量的金币。副元素位面的宝藏按相邻主要元素中更接近的一方处理。</P>
