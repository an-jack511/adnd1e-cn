<P>组合性法术受到所有组成法术限制。来自原初位面的魔法武器通常在命中与伤害上减少两个加值；专门用于对付元素生物的武器例外。跨越额外空间的魔法装置通常仍可工作，但能从其他位面召来力量的物品，在内层位面中可能失效。</P><P class="reading-order"><A href="read-400a71b59d083b7e.html">上一节：死灵 · Necromantics</A><BR><A href="read-677fc9d104c2c0c4.html">下一节：玩家角色 · Player Characters</A></P>
