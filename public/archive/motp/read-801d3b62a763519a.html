<P>旅行者的饥饿与口渴速度约为原初位面的两倍。除非食物和水由有知生物携带，否则它们会受到所在位面的物质影响：在元素火焰位面保持食物几乎不可能，在元素水位面则需要先处理水的形态和压力。</P><P class="reading-order"><A href="read-aff3c489a9d5d413.html">上一节：重力</A><BR><A href="read-1886609511a596ff.html">下一节：视觉与感官</A></P>
