<P>边界以太中的原初位面通常像一幅被雾覆盖的画：颜色淡、距离难以判断，细节会随旅行者移动而改变。旅行者仍可辨认墙、道路、生物和大型物体，但不能假设远处的距离与原初位面相同。</P>
