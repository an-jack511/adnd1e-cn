<P>元素空气位面中的大多数战斗能力正常生效。这里没有地面，战斗者可以从任何方向接近。非魔法远程武器的弹药会受风影响；若没有特殊设计，远程攻击通常无效或大幅改变轨迹。魔法远程武器与魔法箭矢可以正常工作，但仍须处理强风。</P><P class="reading-order"><A href="read-0eb3bfe79507b21d.html">上一节：移动 · Movement</A><BR><A href="read-7c09910b2d53de2b.html">下一节：魔法 · Magic</A></P>
