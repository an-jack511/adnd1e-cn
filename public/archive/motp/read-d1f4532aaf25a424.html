<P>能见度通常可达 1,000 码，晴朗时约为原初位面清晨的两倍。红外视觉正常；但试图追踪远处的小生物会受到薄云、风和气流影响。细微气流可能提示附近生物，但也可能把花粉、尘土或沙粒吹入旅行者眼中。</P><P class="reading-order"><A href="read-a4238666ab5f68fe.html">上一节：呼吸</A><BR><A href="read-91afbfd5bd6f7e76.html">下一节：遭遇 · Encounters</A></P>
