<h1>宗教 · Religion</h1>
<P>卡拉图的信仰包括祖先、自然灵、地方神、天界官僚、寺院、个人誓约和家族守护者。不同地区可能同时供奉多个神灵；同一神灵由不同家族以不同礼仪侍奉。寺院提供治疗、庇护、读写、情报、训练和政治联系，代价可能是捐献、服务、守戒或完成任务。</P>
<P>灵体并非抽象的西方神学概念：河流、竹林、山、古树、海、房屋与祖先都可能有意志。破坏神龛、拒绝供奉或损害自然灵生命力会产生诅咒、灾害、家族荣誉损失或天界追捕。</P>
