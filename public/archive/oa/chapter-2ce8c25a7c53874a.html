<h1>职业可用物品</h1>
<P>武士按战士处理；僧兵按战士和牧师处理，但不能使用法杖；修贤者按牧师；兵士和剑圣按战士；巫人按魔法使用者；忍者和义侠按盗贼。其他 DMG 物品在东方仍可能出现，但西方外形应改成当地对应形式，例如 lyre 可成为三味线或笛，斗篷可成为长袍或夹克，靴子可成为凉鞋，袋子可成为盒子。改外形不改变功能。</P>
