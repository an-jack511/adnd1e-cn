<h1>法术领域</h1>
<P>巫人的法术围绕自然、元素、阴阳与禁忌展开。火法术偏向伤害、光、热和熔化；水法术偏向冰、雾、净化和压制火；风法术偏向飞行、声音、气流和天气；土法术偏向防护、塑形、岩石、金属和封锁；自然与阴阳法术涉及生命、死亡、灵体、植物、幻象和预言。法术仍受范围、持续时间、施法时间、材料和豁免限制；风雨、盐水、寒冷、能见度和周围材料可能影响实际使用。</P>
