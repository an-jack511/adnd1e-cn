<h1>名字 · Names</h1>
<P>名字通常由家族名、个人名、职位、师名、寺名、别号和荣誉称号组成。家族名常放在个人名之前；家族比个人更重要。武器、家传印、师门和祖先功绩也可能成为称号的一部分。地下城主应保持名字、读音、家纹和亲属关系的一致，避免同一 NPC 在不同场景拥有互相矛盾的身份。</P>
</section>
<section class="chapter-section" id="read-3c520a7c2beabbde">

<h2>姓名类型 · Names</h2>
<P>一个人一生通常会使用至少两个、常常更多的名字，且每个名字都与年龄和身份有关：</P>
<figure class="rule-table" id="read-3c520a7c2beabbde-table-1"><figcaption><a href="#read-3c520a7c2beabbde-table-1">表 1　姓名类型 · Names</a><button type="button" data-cite="《AD&amp;D 1e 不全书》v1.0.0 · 东方冒险 Oriental Adventures · 姓名类型 · Names · 表 1 姓名类型 · Names">复制引用</button></figcaption><div class="scroll-table" tabindex="0" aria-label="规则表格"><TABLE class="MsoNormalTable rules-table" style="BORDER-COLLAPSE: collapse; WIDTH: auto" cellSpacing=0 cellPadding=0 border=0 align=center>
<TR><TH style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">名称</TH><TH style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">用途</TH></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">秘密名</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">出生时取得，永不公开；迷信认为知晓真名便能获得对其施法或控制的力量。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">童名</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">出生时使用的日常名字，明显不同于成年名，便于判断是否成年。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">成年名</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">成年礼时取得，表示获得成人权利和责任；此后很少再使用童名。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">家族名</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">与个人名连用的世袭姓氏，主要属于贵族和上层；下层使用可能被视为僭越。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">氏族名</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">表示所属部族或氏族，重视部族归属的蛮族常用。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">地名</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">类似世袭姓氏，用来说明本人来自哪座村、哪一郡或哪一省。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">绰号</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">用于区别同名者、表示荣誉或进行嘲讽。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">职业名</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">工匠、名门人物或从事不体面职业者使用的替代名，不隐藏身份，只隐藏与该职业的联系。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">艺名</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">艺术家、作者或工匠为避免真实姓名与强大家族相连，或制造诗意典故而选择的名字。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">师名</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">艺术家、工匠或武士为表示所属流派或师承而选择的替代名。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">宗教名</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">入寺或入教时取得，表示切断旧日生活、成为新的人，通常有特殊宗教意义。</TD></TR>
<TR><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">事迹名</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">本人或他人根据功绩和事迹赋予，可随行为和声望改变。</TD></TR>
<TR style="BACKGROUND: #eeeeee"><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">谥名</TD><TD style="PADDING: 5.4pt; TEXT-ALIGN: center; VERTICAL-ALIGN: middle">下葬后不久取得，用于保护死者并帮助其抵御邪灵影响。</TD></TR>
</TABLE></div></figure>
