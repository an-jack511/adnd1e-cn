<h1>愿望对属性值的影响</h1>
<P>玩家常用愿望或卷轴上的“改变现实”法术提高重要或薄弱的属性。允许这样做，但属性越高，提高就越困难，否则战役最终会被属性膨胀的角色淹没。</P>
<P>愿望或“改变现实”可以把 3–15 的属性提高 1 点；对 16 或更高的属性，每次只提高十分之一点。例如，16 需要十次愿望才能变成 17。魔法书籍或装置可以按其自身说明把 16 以上的属性提高整点；上述限制只适用于愿望和“改变现实”法术。</P>
