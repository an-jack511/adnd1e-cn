<h1>服饰 · Dress</h1>
<P>服饰显示地区、职业、阶层、年龄、宗派和场合。普通旅行者穿棉布、麻布或皮革，贵族使用丝绸、毛皮、家纹和精细染色；冬季、战争、宫廷、葬礼、婚礼、寺院和祭典都有不同服装。盔甲也显示身份：武士的成套甲、家纹旗和头盔往往先于姓名被认出，僧侣与修贤者的袍服显示寺院归属。穿错服饰会让角色失礼、被拒绝入场，甚至损失荣誉。</P>
