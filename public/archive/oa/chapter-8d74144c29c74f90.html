<h1>禁忌与法术后果</h1>
<P>巫人的法术不是抽象的“每日按钮”。师父、师门、自然灵和元素力量都可能追究违禁使用；地下城主应依据禁忌的性质决定法术失败、失去记忆中的法术、被师门追杀、被元素反噬或荣誉与阵营变化。巫人的卷轴和论著也是剧情资源，丢失卷册会限制新法术学习，但不会抹去已记忆且尚未施展的法术。</P>
