<h1>Gargantua 巨兽</h1>
<P>巨兽是自然过程的畸变、远古时代的遗存或疯狂实验的产物。它们体型巨大，行走时地面震动，不能惊讶其他生物；咆哮使其极难忽视。所有巨兽每轮再生 4 点。</P>
<P>人形巨兽高 80–100 英尺，能以 25% 几率理解其他语言，以双拳各造成 4d10，践踏造成 10d10；栖息在险峻山地或远海小岛。昆虫巨兽从巨蛋、幼虫、蛹到成虫成长，幼虫有 20 HD，能向 60 英尺发射强韧茧丝缠住生物。</P>
