<h1>怪物条目格式</h1>
<P>每个条目依次列出出现频率、出现数量、AC、移动、生命骰、巢穴几率、财宝类型、攻击次数、伤害、特殊攻击、特殊防御、魔法抗性、智力、阵营、体型、灵能、攻击/防御模式和等级/经验值。生物的生态、语言、社会与栖息地同样属于规则的一部分。</P>
