<P>Tigbanua buso 是墓地、森林或岩山附近的食尸鬼般生物，半径 10 英尺内散发恐惧；低于 1 HD 的生物自动麻痹，其他生物可作麻痹豁免。利爪传播可怕疾病，被抓伤者须作死亡豁免，失败后最终变成 Tagamaling。Tagamaling 是感染者，每夜有 1% 的累计几率变成凶暴、无心智的 Buso，吞食附近一切生物；变形时不能使用职业能力，且不记得自己做过什么。疾病累计到 100% 后无法治愈，每夜都会变形。</P>
