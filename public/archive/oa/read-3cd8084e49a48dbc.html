<P>居合只适用于原本非战斗、武器未出鞘、突然爆发的攻击；武器已经拔出、对手有理由预料攻击或战斗已经开始时不适用。若一方有居合而另一方没有，无居合者的惊讶骰 -1；双方都有居合时双方都 -1。</P><P class="reading-order"><A href="read-04c081bbea007152.html">上一节：居合与惊讶 · Surprise and Iaijutsu</A><BR><A href="read-e423705f7aa7a241.html">下一节：先攻 · Initiative Modifiers</A></P>
