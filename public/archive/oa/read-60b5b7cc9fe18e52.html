<P>武术攻击未调整掷出 20 时，目标须作麻痹豁免；成功则只承受正常伤害，失败后比较该 d20 数值与目标生命骰或等级：骰值低于目标生命骰/等级时震慑 1d6 轮，骰值高于目标时失能 1–3 小时。生命骰带 +4 或更高的生物按多一颗生命骰计算。</P><P class="reading-order"><A href="read-a4be2b64a7b72db6.html">上一节：特殊动作补充</A><BR><A href="read-e6349d4214e7e9b9.html">下一节：事件与遭遇 · Events and Encounters</A></P>
