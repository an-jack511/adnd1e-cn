<P class="breadcrumbs"><A href="index.html">东方冒险</A> &gt; <A href="read-0d587d8aeb83dcef.html">战斗 · Combat</A> &gt; <A href="read-e423705f7aa7a241.html">先攻 · Initiative Modifiers</A></P><H1>先攻修正的个人适用</H1>
<P>巫人和剑圣可修正自己的先攻骰，但每个修正只影响该角色自身行动，不能把整方所有人的先攻一起改变。因此一轮可能分成多个个人攻击阶段；若一方的最高个人修正值仍低于另一方最低值，前一方可先以任意顺序完成全部行动。</P><P class="reading-order"><A href="read-e423705f7aa7a241.html">上一节：先攻 · Initiative Modifiers</A><BR><A href="read-b06162348557d8df.html">下一节：战斗程序 · Combat Procedures</A></P>
