<P class="breadcrumbs"><A href="index.html">东方冒险</A> &gt; <A href="read-0d587d8aeb83dcef.html">战斗 · Combat</A></P><H1>先攻 · Initiative Modifiers</H1>
<P>剑圣和巫人等职业可通过职业能力修正本方先攻骰，但修正只用于该角色自己的行动。因此一方可能分成多个攻击阶段。相同先攻值的行动同时发生；角色完成自己的行动后才承受同一阶段内对他的伤害或法术结果。</P><DIV class="section-contents"><P><STRONG>本节内容</STRONG></P><UL class="book-outline"><LI><A href="read-abf967a78fbad434.html">先攻修正的个人适用</A></LI></UL></DIV><P class="reading-order"><A href="read-3cd8084e49a48dbc.html">上一节：居合的惊讶修正</A><BR><A href="read-abf967a78fbad434.html">下一节：先攻修正的个人适用</A></P>
