<A NAME="communication"></A>
<h1>沟通 · Communication</h1>
<P>若要判断可能友善或中立的怪物意图，或传达你方的意图与愿望，就需要某种沟通方式。对类人生物而言，语言或许足够，因为大多数生物都懂通用语。但若遭遇巨人、眨眼犬或其他众多奇异生物呢？举起右手示意，或仅仅避免敌对举动，或许能让交流继续。记住：若无法清楚沟通，就别指望贿赂一群食人魔，让他们放你通过。</P>
