<A NAME="infravision"></A>
<h1>红外视觉 · Infravision</h1>
<P>红外视觉是看见红外光谱的能力，因此热辐射会变得可见，温差也能形成视觉。温暖的物体明亮，凉爽的物体呈灰色，极冷的物体则呈黑色。大多数红外视觉的距离为60尺；栖居地下的怪物则可看至120尺。</P>
<P>若有光源照亮具备红外视觉的生物，或周围存在强热源，其红外视觉都会受到干扰。盗贼若想在红外视觉下躲藏，必须有热源或光源掩盖体热，或借助极冷的物体或辐射作为掩护。</P>
