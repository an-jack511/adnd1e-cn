<A NAME="silent-movement"></A>
<h1>静默移动 · Silent Movement</h1>
<P>角色通常会发出一定声响，从而让对手察觉其存在。不过，盗贼以及能借助精灵靴等魔法物品安静移动的角色，有机会做到完全无声。此机会以百分比表示，并计入相应调整值；角色掷百分骰，结果等于或低于其静默移动成功率即为成功。成功后，角色移动时不会发出声音，也更容易突袭对手或从其身边悄然经过。</P>
