<A NAME="falling-damage"></A>
<h1>坠落伤害 · Falling Damage</h1>
<P>跌入坑中、从平台坠落或掉下竖井等，若未能缓冲落势，必然会造成伤害。这类坠落可能导致骨折或其他伤势，但裁判通常会简单地按每坠落10尺受到1d6点伤害计算，最多20d6；再根据坠落表面作加减调整。此法让角色更容易存活，不过不如逐项计算骨折、扭伤、脱臼、内脏损伤等方式“真实”。</P>
