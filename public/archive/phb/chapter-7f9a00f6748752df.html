<A NAME="mapping"></A>
<h1>绘图 · Mapping</h1>
<P>必须由一名玩家绘制探险路线图；若有两名玩家各自绘图，远征成功的机会会提高。地下城地图建议使用每英寸5或6条线的方格纸；户外地图通常使用小比例六角格纸。两种纸都应随时备妥。</P>
<P>不必担心地图不够精确，某处偏差10尺或20尺也无妨。只要地图能让队伍了解身在何处，以及如何返回，就达到了目的。记得在地图上标记危险——陷阱、机关和怪物。</P>
