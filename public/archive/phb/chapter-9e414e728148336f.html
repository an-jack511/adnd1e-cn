<A NAME="organization"></A>
<h1>组织队伍 · Organization</h1>
<P>组织队伍时，要标明每名角色所在的位置，并记录队伍在10尺或20尺宽通道中的行进队形，以及通过门口时的安排等。前方战斗固然要准备，后方也要防范。指定一名队伍领袖，由其负责“报位”——告诉裁判队伍要去哪里、要做什么。微缩模型在此很有帮助；若没有模型，地下城主通常会要求你们在纸上画出行进队形。</P>
