<h1>紫外视觉 · Ultravision</h1>
<P>紫外视觉是看见紫外光谱辐射（包括伽马射线、X射线等）的能力。具有此能力的生物能在普通夜间黑暗中视物；换言之，由于地球持续受到紫外线辐射，它们夜间的视力相当于人类黄昏时的视力。</P>
