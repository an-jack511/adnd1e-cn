<A NAME="healing"></A>
<h1>治疗 · Healing</h1>
<P>恢复失去的生命值有许多方法。最普通的方式是休息，让时间逐渐治愈伤势。每休息一天可恢复1点伤害；经过30个游戏日后，此后每天恢复5点生命值。圣武士的“圣疗”、法术、药水及各种魔法装置都能迅速恢复许多失去的生命值。祈愿术可一次为数名角色恢复生命值。生命值永远不能超过角色掷骰所得的总值加上加值。</P>
