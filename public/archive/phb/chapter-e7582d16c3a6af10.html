<h1>角色种族表 II 注释 Notes Regarding Character Race Table II</h1>
<p>括号内的数字表示：该种族只有非玩家角色能够选择这一职业。不带括号的数字表示该种族角色在相应职业中能够达到的最高等级。某个种族栏内若标有 U，表示该种族角色在相应职业中的等级没有上限。</p>
