<H1>伤害 · Damage</H1>
<P>伤害以生命值点数计算。任何生物的生命值降至0或负数时，便会死亡。某些魔法手段能够避免真正死亡，尤其是再生戒指（参见《怪物图鉴》中的巨魔）。</P>
