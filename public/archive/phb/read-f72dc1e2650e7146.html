<H1>隐形移动 · Invisible Movement</H1>
<P>角色可以借助各种魔法手段隐形并移动。精灵斗篷赋予的隐形仅涵盖斗篷所遮蔽的部分；隐形戒指或隐形术则能提供更完整的隐形。请注意，隐形不会遮蔽光线：隐形角色若带着光源移动，旁人仍会看到光，虽然未必能看到持有者或光源本身。</P>
