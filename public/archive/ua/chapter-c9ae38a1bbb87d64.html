<h2>容貌 · Comeliness</h2>
<P>此属性的完整规则见本书。容貌或许更该称为特征，但仍有影响旁人观看、回应角色的游戏效果。上方表格也体现某些职业更可能吸引相貌较出众的人物，故这类职业生成的人类角色更可能有高于平均的容貌值。</P>
