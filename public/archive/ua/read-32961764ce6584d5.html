<H1>人类 · Humans</H1>
<P>人类是 AD&amp;D 游戏宇宙中的主导种族，可选职业与可达到的等级都没有种族上限。请注意，只有人类玩家角色可以使用本书后文提出的一种特殊角色生成方法：玩家先选定角色职业，再确定任何属性值。</P><P class="reading-order"><A href="read-fc3476acd250e0a6.html">上一节：半兽人 · Half-orcs</A><BR><A href="read-e41d0c5b9d7f06ba.html">下一节：种族偏好表 · Racial Preferences Table</A></P>
