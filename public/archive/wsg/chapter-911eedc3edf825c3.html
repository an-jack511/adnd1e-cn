<h1>降水 · Precipitation</h1>
<P>如果正在发生中等强度的降水，使用表 5 中比当前风速高一档的风速行。例如，几乎无风（0–10 英里/小时）时的中等降雨，按 11–20 英里/小时处理。如果正在发生高强度降水，就向下移动两行；例如，风速 11–20 英里/小时的强暴雪，按 31–45 英里/小时处理。降水修正绝不会让条件恶化到表底行以下。</P>
