<h1>植物学熟练项 · Proficiency in Plant Lore</h1>
<P>如果角色进入荒野时无法随时获得治疗和治愈魔法，或想防止旅途中失去这种帮助，队伍中有一名拥有植物学熟练项的角色会显著提高生存机会。此人不能在没有植被的地方找到植被；但只要有绿色植物可供搜索，拥有熟练项的角色就更可能找到所需类型的植物。有关这种角色给队伍带来的好处，见“荒野熟练项”章节。</P>
