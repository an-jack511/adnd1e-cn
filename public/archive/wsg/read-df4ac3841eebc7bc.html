<P>这些页面是不同尺寸的六边形地图纸，不含需要翻译的正文。使用时保留原书页面比例：大比例地图每格通常 20–40 英里；按“聚簇法”把一个大六边形分成八个小六边形，再逐级缩小到 1/3 比例。地图纸本身作为原书扫描页保留。</P><P class="reading-order"><A href="read-cbb73b447ed9834f.html">上一节：汇总表页 · Compiled Tables</A><BR><A href="read-a6d5f8c2b6c6b073.html">下一节：原书索引 · Index</A></P>
