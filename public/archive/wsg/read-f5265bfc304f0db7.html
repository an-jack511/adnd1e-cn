<P class="breadcrumbs"><A href="index.html">荒野生存指南</A> &gt; <A href="read-b373073a9dc85ed7.html">坐骑与驮兽 · Mounts and Beasts of Burden</A> &gt; <A href="read-effd17f5db4ed721.html">常用动物</A></P><H1>小马</H1>
<P>关于马的大多数一般说明也适用于小马。小马可以专门培育用于山地旅行；在这种情况下，地下城主可以允许它以高于“负重与移动”一节所列数值的速度通过山地。小马在崎岖或极崎岖地形中每行进八小时有 2% 的概率跛行，并且每天需要三份食物或水的配给。</P><P class="reading-order"><A href="read-9c9e71c5f263cda9.html">上一节：骡</A><BR><A href="read-c003b998d37f106f.html">下一节：巨型公羊</A></P>
